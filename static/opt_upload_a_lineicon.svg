  <rect x="36" y="78" width="32" height="32" rx="8" fill="transparent" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
  <g transform="translate(44,86)" stroke="#8fa3cc" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="2" width="16" height="13" rx="2"/>
