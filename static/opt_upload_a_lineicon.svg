    <path d="M1 13 L6 8 L9.5 11 L12.5 8.5 L16 12"/>
  </g>
  <text x="80" y="98" fill="#4a5a8a" font-family="system-ui,'PingFang SC',sans-serif" font-size="13">请输入你的问题...</text>
  <rect x="396" y="79" width="56" height="30" rx="8" fill="#667eea"/>
  <text x="424" y="98" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle">发送</text>
  <text x="24" y="150" fill="#3d4d6e" font-family="system-ui,'PingFang SC',sans-serif" font-size="10">悬停时图标变亮 + 显示"上传图片"气泡提示</text>
