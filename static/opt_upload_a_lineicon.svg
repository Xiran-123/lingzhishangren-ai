<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" width="480" height="170">
  <rect width="480" height="170" fill="#0a0e1a" rx="12"/>
  <text x="24" y="30" fill="#E5E5E5" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500">方案 A · 线性 SVG 图标</text>
  <text x="24" y="50" fill="#6b7a99" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">替换 emoji 为矢量图标，任何系统渲染一致</text>
  <!-- 模拟输入栏 -->
  <rect x="24" y="70" width="432" height="48" rx="10" fill="#0f1a3a"/>
