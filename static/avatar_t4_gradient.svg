<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#3D7BFF"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1ECFE"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#67E8F9" stop-opacity=".7"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 背景 -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <!-- 光晕 -->
  <circle cx="100" cy="100" r="78" fill="url(#glow)"/>
  <!-- 头部 -->
  <rect x="36" y="44" width="128" height="116" rx="42" fill="url(#head)"/>
  <!-- 耳朵 -->
  <circle cx="36" cy="100" r="12" fill="#CBD5E1"/>
  <circle cx="164" cy="100" r="12" fill="#CBD5E1"/>
  <!-- 脸屏 -->
  <rect x="54" y="70" width="92" height="56" rx="22" fill="#0F172A"/>
  <!-- 眼睛 -->
  <rect x="70" y="84" width="20" height="22" rx="8" fill="url(#eye)"/>
  <rect x="110" y="84" width="20" height="22" rx="8" fill="url(#eye)"/>
  <rect x="73" y="87" width="6" height="10" rx="2" fill="#FFFFFF" opacity=".85"/>
  <rect x="113" y="87" width="6" height="10" rx="2" fill="#FFFFFF" opacity=".85"/>
  <!-- 微笑 -->
  <path d="M84 128 Q100 142 116 128" fill="none" stroke="#3D7BFF" stroke-width="4" stroke-linecap="round"/>
  <!-- 天线 -->
  <line x1="100" y1="44" x2="100" y2="24" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="20" r="6" fill="#60A5FA"/>
</svg>
