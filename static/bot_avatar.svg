<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8dff"/>
      <stop offset="100%" stop-color="#3a6fd9"/>
    </linearGradient>
    <linearGradient id="cheek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8fb4"/>
      <stop offset="100%" stop-color="#ff5c8a"/>
    </linearGradient>
  </defs>

  <!-- 天线 -->
  <line x1="50" y1="18" x2="50" y2="8" stroke="#5b8dff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="7" r="4" fill="#ffe066">
    <animate attributeName="r" values="4;5.5;4" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- 大圆脑袋 -->
  <circle cx="50" cy="45" r="28" fill="url(#body)" stroke="#ffffff" stroke-width="2"/>

  <!-- 额头小方块（装饰，增加机器人感） -->
  <rect x="42" y="20" width="16" height="5" rx="2" fill="#3a5bbf" opacity="0.6"/>

  <!-- 腮红 -->
  <ellipse cx="32" cy="50" rx="5" ry="3.5" fill="url(#cheek)" opacity="0.7"/>
  <ellipse cx="68" cy="50" rx="5" ry="3.5" fill="url(#cheek)" opacity="0.7"/>

  <!-- 左眼白 -->
  <circle cx="40" cy="42" r="8" fill="#ffffff"/>
  <!-- 左眼黑 -->
  <circle cx="41" cy="43" r="5" fill="#1a1a2e"/>
  <!-- 左眼高光 -->
  <circle cx="43" cy="41" r="2" fill="#ffffff"/>
  <circle cx="39" cy="45" r="0.8" fill="#ffffff" opacity="0.6"/>

  <!-- 右眼白 -->
  <circle cx="60" cy="42" r="8" fill="#ffffff"/>
  <!-- 右眼黑 -->
  <circle cx="61" cy="43" r="5" fill="#1a1a2e"/>
  <!-- 右眼高光 -->
  <circle cx="63" cy="41" r="2" fill="#ffffff"/>
  <circle cx="59" cy="45" r="0.8" fill="#ffffff" opacity="0.6"/>

  <!-- 微笑嘴巴 -->
  <path d="M 42 58 Q 50 65 58 58" stroke="#1a1a2e" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- 小身体 -->
  <rect x="33" y="72" width="34" height="18" rx="9" fill="url(#body)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- 胸口能量灯（可爱小圆） -->
  <circle cx="50" cy="81" r="3" fill="#ffe066">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="81" r="1" fill="#fff"/>

  <!-- 小短胳膊 -->
  <rect x="24" y="75" width="10" height="6" rx="3" fill="#3a6fd9" stroke="#ffffff" stroke-width="1"/>
  <rect x="66" y="75" width="10" height="6" rx="3" fill="#3a6fd9" stroke="#ffffff" stroke-width="1"/>
</svg>
