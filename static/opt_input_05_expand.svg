<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210">
  <rect width="480" height="210" fill="#0a0e1a" rx="12"/>
  <text x="24" y="30" fill="#E5E5E5" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500">方案 5 · 聚焦展开</text>
  <text x="24" y="50" fill="#6b7a99" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">聚焦时自动展开工具栏，快捷键浮出</text>
  <rect x="24" y="70" width="432" height="120" rx="14" fill="#0f1a3a" stroke="rgba(102,126,234,.35)" stroke-width="1.2"/>
  <text x="40" y="100" fill="#4a5a8a" font-family="system-ui,'PingFang SC',sans-serif" font-size="13">请输入你的问题...（Shift+Enter 换行）</text>
  <text x="40" y="120" fill="#4a5a8a" font-family="system-ui,'PingFang SC',sans-serif" font-size="13">帮我排查一个网络故障：...</text>
  <line x1="24" y1="132" x2="456" y2="132" stroke="rgba(255,255,255,.04)"/>
  <!-- 工具栏 -->
  <text x="40" y="155" font-family="system-ui,sans-serif" font-size="14">📷</text>
  <text x="62" y="155" font-family="system-ui,sans-serif" font-size="14">🎤</text>
  <text x="84" y="155" font-family="system-ui,sans-serif" font-size="14">📎</text>
  <rect x="106" y="144" width="62" height="20" rx="4" fill="rgba(255,255,255,.04)"/>
  <text x="137" y="158" fill="#4a5a8a" font-family="system-ui,'PingFang SC',sans-serif" font-size="10" text-anchor="middle">⇧+↵ 换行</text>
  <rect x="390" y="142" width="58" height="26" rx="8" fill="url(#g5)"/>
  <text x="419" y="159" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="12" font-weight="500" text-anchor="middle">发送 ↑</text>
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
</svg>
