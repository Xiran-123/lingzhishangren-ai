<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="480" height="200" fill="#0a0e1a" rx="12"/>
  <text x="24" y="30" fill="#E5E5E5" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500">方案 4 · 状态化按钮</text>
  <text x="24" y="50" fill="#6b7a99" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">发送按钮三态：禁用灰 / 激活紫 / 生成中绿</text>

  <!-- 禁用态 -->
  <text x="24" y="78" fill="#6b7a99" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">空输入</text>
  <rect x="24" y="84" width="132" height="38" rx="8" fill="#0f1a3a"/>
  <text x="38" y="108" fill="#3d4d6e" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">请输入...</text>
  <rect x="114" y="90" width="32" height="26" rx="6" fill="rgba(255,255,255,.08)"/>
  <text x="130" y="108" fill="#3d4d6e" font-family="system-ui,'PingFang SC',sans-serif" font-size="11" font-weight="500" text-anchor="middle">发送</text>

  <!-- 激活态 -->
  <text x="178" y="78" fill="#6b7a99" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">有内容</text>
  <rect x="178" y="84" width="132" height="38" rx="8" fill="#0f1a3a"/>
  <text x="192" y="108" fill="#4a5a8a" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">帮我排查一下...</text>
  <rect x="268" y="90" width="32" height="26" rx="6" fill="url(#g4)"/>
  <text x="284" y="108" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="11" font-weight="500" text-anchor="middle">发送</text>

  <!-- 生成中 -->
  <text x="332" y="78" fill="#6b7a99" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">生成中</text>
  <rect x="332" y="84" width="124" height="38" rx="8" fill="#0f1a3a"/>
  <rect x="408" y="90" width="40" height="26" rx="6" fill="url(#g4b)"/>
  <circle cx="418" cy="103" r="2" fill="#fff"/>
  <circle cx="425" cy="103" r="2" fill="#fff"/>
  <circle cx="432" cy="103" r="2" fill="#fff"/>
  <linearGradient id="g4b" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10b981"/>
    <stop offset="1" stop-color="#059669"/>
  </linearGradient>
  <text x="24" y="160" fill="#3d4d6e" font-family="system-ui,'PingFang SC',sans-serif" font-size="10">← 三态自动切换，用户一眼知道能不能点</text>
</svg>
