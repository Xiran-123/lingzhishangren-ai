<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a4a"/>
      <stop offset="100%" stop-color="#1a3a7a"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆形底 -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)"/>

  <!-- 外六边形（能量盾） -->
  <polygon points="100,22 166,60 166,140 100,178 34,140 34,60" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
  <polygon points="100,35 155,67 155,133 100,165 45,133 45,67" fill="none" stroke="#00c8ff" stroke-width="1.5" opacity="0.4"/>

  <!-- 能量波 -->
  <g fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.5">
    <path d="M100,58 Q130,100 100,142 Q70,100 100,58"/>
    <path d="M60,100 Q100,70 140,100 Q100,130 60,100"/>
  </g>

  <!-- 中心能量核心 -->
  <circle cx="100" cy="100" r="38" fill="url(#glow)"/>
  <circle cx="100" cy="100" r="22" fill="url(#coreGrad)"/>
  <circle cx="100" cy="100" r="22" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

  <!-- 核心电路线 -->
  <g stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.9" stroke-linecap="round">
    <line x1="100" y1="78" x2="100" y2="55"/>
    <line x1="100" y1="122" x2="100" y2="145"/>
    <line x1="78" y1="100" x2="55" y2="100"/>
    <line x1="122" y1="100" x2="145" y2="100"/>
    <line x1="85" y1="85" x2="68" y2="68"/>
    <line x1="115" y1="115" x2="132" y2="132"/>
    <line x1="115" y1="85" x2="132" y2="68"/>
    <line x1="85" y1="115" x2="68" y2="132"/>
  </g>

  <!-- 电路发光节点 -->
  <g fill="#00e5ff">
    <circle cx="100" cy="55" r="3"/><circle cx="100" cy="145" r="3"/>
    <circle cx="55" cy="100" r="3"/><circle cx="145" cy="100" r="3"/>
    <circle cx="68" cy="68" r="2.5"/><circle cx="132" cy="132" r="2.5"/>
    <circle cx="132" cy="68" r="2.5"/><circle cx="68" cy="132" r="2.5"/>
  </g>

  <!-- 中心电路花纹 -->
  <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.7">
    <line x1="88" y1="100" x2="112" y2="100"/>
    <line x1="100" y1="88" x2="100" y2="112"/>
    <rect x="92" y="92" width="16" height="16" rx="2"/>
  </g>

  <!-- 外环节点 -->
  <g fill="#00c8ff">
    <circle cx="100" cy="22" r="2.5"/><circle cx="166" cy="60" r="2.5"/>
    <circle cx="166" cy="140" r="2.5"/><circle cx="100" cy="178" r="2.5"/>
    <circle cx="34" cy="140" r="2.5"/><circle cx="34" cy="60" r="2.5"/>
  </g>
</svg>
