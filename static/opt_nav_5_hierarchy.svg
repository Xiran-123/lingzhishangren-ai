<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <rect width="480" height="140" fill="#0a0e1a" rx="12"/>
  <text x="24" y="28" fill="#E5E5E5" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500">方案 5 · 文字按钮 + 图标分层级</text>
  <text x="24" y="46" fill="#6b7a99" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">主操作实底，次操作文字链，层级分明</text>
  <!-- 文字链 x2 -->
  <g transform="translate(24,72)" stroke="#8fa3cc" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3.5 h11"/><path d="M5 3.5 V2.2 h4 V3.5"/><rect x="3" y="3.5" width="9" height="9.5" rx="1.5"/><line x1="5.5" y1="6.5" x2="5.5" y2="10.5"/><line x1="9" y1="6.5" x2="9" y2="10.5"/>
  </g>
  <text x="44" y="82" fill="#8fa3cc" font-family="system-ui,'PingFang SC',sans-serif" font-size="12">清除记录</text>
  <line x1="44" y1="86" x2="92" y2="86" stroke="rgba(143,163,204,.3)" stroke-dasharray="2 2"/>
  <g transform="translate(118,72)" stroke="#8fa3cc" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 1.5 H3 a1.5 1.5 0 0 0 -1.5 1.5 v8 a1.5 1.5 0 0 0 1.5 1.5 H8"/><path d="M11 4.5 L14 7 L11 9.5"/><line x1="6" y1="7" x2="13.5" y2="7"/>
  </g>
  <text x="138" y="82" fill="#8fa3cc" font-family="system-ui,'PingFang SC',sans-serif" font-size="12">退出登录</text>
  <line x1="138" y1="86" x2="186" y2="86" stroke="rgba(143,163,204,.3)" stroke-dasharray="2 2"/>
  <!-- 主按钮 -->
  <rect x="272" y="64" width="112" height="34" rx="8" fill="#667eea"/>
  <g transform="translate(286,73)" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 3 L4 8 L10 13"/><line x1="4.5" y1="8" x2="15" y2="8"/>
  </g>
  <text x="308" y="85" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="12" font-weight="500">返回首页</text>
  <text x="24" y="122" fill="#3d4d6e" font-family="system-ui,'PingFang SC',sans-serif" font-size="10">次要操作弱化、不抢眼，顶部视觉噪音最低</text>
</svg>
