<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <rect width="480" height="140" fill="#0a0e1a" rx="12"/>
  <text x="24" y="28" fill="#E5E5E5" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500">方案 2 · 纯图标按钮 + 悬停提示</text>
  <text x="24" y="46" fill="#6b7a99" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">顶部只留三个图标，悬停出文字气泡，最省空间</text>
  <!-- 图标按钮 x3 -->
  <rect x="280" y="62" width="34" height="34" rx="8" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.15)"/>
  <g transform="translate(289,71)" stroke="#e0ecff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 4 h12"/><path d="M5.5 4 V2.5 h5 V4"/><rect x="3" y="4" width="10" height="11" rx="1.5"/><line x1="6" y1="7.5" x2="6" y2="12"/><line x1="10" y1="7.5" x2="10" y2="12"/>
  </g>
  <rect x="322" y="62" width="34" height="34" rx="8" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.15)"/>
  <g transform="translate(331,71)" stroke="#e0ecff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 2 H3.5 a1.5 1.5 0 0 0 -1.5 1.5 v9 a1.5 1.5 0 0 0 1.5 1.5 H9"/><path d="M12 5 L15.5 8 L12 11"/><line x1="6.5" y1="8" x2="15" y2="8"/>
  </g>
  <rect x="364" y="62" width="34" height="34" rx="8" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.15)"/>
  <g transform="translate(373,71)" stroke="#e0ecff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 3 L4 8 L10 13"/><line x1="4.5" y1="8" x2="15" y2="8"/>
  </g>
  <!-- tooltip 示例 -->
  <rect x="316" y="104" width="62" height="20" rx="5" fill="#1a2440" stroke="rgba(255,255,255,.15)"/>
  <text x="347" y="118" fill="#c5d0e8" font-family="system-ui,'PingFang SC',sans-serif" font-size="10" text-anchor="middle">退出登录</text>
  <text x="24" y="84" fill="#4a5a8a" font-family="system-ui,'PingFang SC',sans-serif" font-size="12">灵智尚人 · 职业导师</text>
  <text x="24" y="122" fill="#3d4d6e" font-family="system-ui,'PingFang SC',sans-serif" font-size="10">顶部更干净，但图标含义需悬停才知，学生端发现性略降</text>
</svg>
