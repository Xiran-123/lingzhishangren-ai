<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <rect width="480" height="200" fill="#0a0e1a" rx="12"/>
  <text x="24" y="30" fill="#E5E5E5" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500">方案 D · "+" 展开菜单</text>
  <text x="24" y="50" fill="#6b7a99" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">一个入口收纳图片/文件，后续好扩展</text>
  <!-- 展开的菜单 -->
  <rect x="36" y="62" width="120" height="76" rx="10" fill="#1a2440" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
  <g transform="translate(50,74)" stroke="#a0b4ff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="1" width="13" height="11" rx="2"/>
    <circle cx="4" cy="5" r="1.3"/>
    <path d="M1 10 L4.5 6.5 L7 8.5 L10 6.5 L13 9.5"/>
  </g>
  <text x="74" y="84" fill="#c5d0e8" font-family="system-ui,'PingFang SC',sans-serif" font-size="12">上传图片</text>
  <line x1="46" y1="98" x2="146" y2="98" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
  <g transform="translate(50,106)" stroke="#a0b4ff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 1 h7 l4 4 v8 h-11 z"/>
    <path d="M9 1 v4 h4"/>
  </g>
  <text x="74" y="116" fill="#c5d0e8" font-family="system-ui,'PingFang SC',sans-serif" font-size="12">上传文件</text>
  <!-- 输入栏 -->
  <rect x="24" y="148" width="432" height="40" rx="10" fill="#0f1a3a"/>
  <rect x="34" y="154" width="36" height="36" rx="8" fill="rgba(102,126,234,.15)"/>
  <g transform="translate(45,165)" stroke="#a0b4ff" stroke-width="1.8" stroke-linecap="round">
    <line x1="7" y1="0" x2="7" y2="14"/>
    <line x1="0" y1="7" x2="14" y2="7"/>
  </g>
  <text x="84" y="173" fill="#4a5a8a" font-family="system-ui,'PingFang SC',sans-serif" font-size="13">请输入你的问题...</text>
  <rect x="396" y="153" width="56" height="30" rx="8" fill="#667eea"/>
  <text x="424" y="172" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle">发送</text>
</svg>
