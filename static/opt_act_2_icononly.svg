<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <rect width="480" height="160" fill="#0a0e1a" rx="12"/>
  <text x="24" y="28" fill="#E5E5E5" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500">方案 2 · 纯图标小圆钮（ChatGPT 风格）</text>
  <text x="24" y="46" fill="#6b7a99" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">只留图标，悬停出文字气泡，视觉噪音最低</text>
  <rect x="24" y="58" width="300" height="52" rx="12" fill="rgba(255,255,255,.06)"/>
  <text x="40" y="80" fill="#c5d0e8" font-family="system-ui,'PingFang SC',sans-serif" font-size="12">AI 的回复内容……</text>
  <text x="40" y="98" fill="#5a6a8a" font-family="system-ui,'PingFang SC',sans-serif" font-size="11">这是一段回答文本，用于展示按钮位置。</text>
  <!-- 三个图标小圆钮 -->
  <circle cx="40" cy="134" r="13" fill="transparent" stroke="rgba(255,255,255,.12)"/>
  <g transform="translate(34,128)" stroke="#8fa3c7" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 2.5 H4.8 a1.8 1.8 0 0 0 -1.8 1.8 v5.4 a1.8 1.8 0 0 0 1.8 1.8 H7 l3.5 2.6 v-2.6"/><path d="M5.4 5.8 h4.4 M5.4 8.6 h3"/>
  </g>
  <circle cx="72" cy="134" r="13" fill="rgba(102,126,234,.18)" stroke="rgba(102,126,234,.4)"/>
  <g transform="translate(66,128)" stroke="#a0b4ff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="7" height="8" rx="1.2"/><path d="M6 3.5 V2.2 a.9.9 0 0 1 .9 -.9 h4.4 a1.3 1.3 0 0 1 1.3 1.3 v7 a1.3 1.3 0 0 1 -1.3 1.3 h-.9"/>
  </g>
  <circle cx="104" cy="134" r="13" fill="transparent" stroke="rgba(255,255,255,.12)"/>
  <g transform="translate(98,128)" stroke="#8fa3c7" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.8 4.5 v3.4 h2.6 l3.4 3 v-9.6 L4.4 4.5 z"/><path d="M9.6 4 a3.5 3.5 0 0 1 0 4.4 M11.4 2.7 a6 6 0 0 1 0 7"/>
  </g>
  <!-- tooltip -->
  <rect x="50" y="104" width="44" height="18" rx="4" fill="#1a2440" stroke="rgba(255,255,255,.15)"/>
  <text x="72" y="117" fill="#c5d0e8" font-family="system-ui,'PingFang SC',sans-serif" font-size="10" text-anchor="middle">复制</text>
</svg>
