<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 模拟面试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #eef1f6;
            color: #1f2937;
            min-height: 100vh;
        }

        /* ==================== 顶部品牌栏 ==================== */
        .brandbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: #1e3a8a;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(30, 58, 138, 0.25);
        }
        .brandbar .back-btn {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .brandbar .back-btn:hover { background: rgba(255,255,255,0.22); }
        .brandbar .brand-title { font-weight: 600; font-size: 16px; }
        .brandbar .brand-right { opacity: 0.85; font-size: 13px; }
        .brandbar .exit-btn-inline {
            background: transparent; border: 1px solid rgba(255,255,255,0.4);
            color: #fff; padding: 6px 14px; border-radius: 8px;
            font-size: 13px; cursor: pointer;
        }
        .brandbar .exit-btn-inline:hover { background: rgba(255,255,255,0.15); }

        /* ==================== 状态通用 ==================== */
        .state { width: 100%; }

        /* ==================== 状态① 配置页 ==================== */
        .state-config {
            max-width: 560px;
            margin: 0 auto;
            padding: 40px 20px 30px;
            position: relative;
            min-height: calc(100vh - 62px);
        }
        .config-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(30, 58, 138, 0.06);
        }
        .config-card .emoji { font-size: 40px; margin-bottom: 10px; }
        .config-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #1f2937; }
        .config-card .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 26px; }

        .config-fields { text-align: left; margin-bottom: 24px; }
        .field { margin-bottom: 14px; }
        .field label {
            font-size: 12px; color: #6b7280; margin-bottom: 6px;
            display: block; font-weight: 500;
        }
        .field select, .field input[type="text"] {
            width: 100%;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
            background: #fff;
            color: #111827;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .field select:focus, .field input[type="text"]:focus { border-color: #2563eb; }
        .field-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .start-btn {
            width: 100%; border: none; border-radius: 12px;
            padding: 15px; font-size: 16px; font-weight: 600;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: #fff; cursor: pointer;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .start-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(37, 99, 235, 0.45); }
        .start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .config-hint {
            text-align: center; margin-top: 16px;
            font-size: 12px; color: #9ca3af;
        }

        /* 右侧悬浮按钮 */
        .history-fab {
            position: fixed; right: 0; top: 50%; transform: translateY(-50%);
            background: #1e3a8a; color: #fff;
            padding: 18px 10px; border-radius: 12px 0 0 12px;
            border: none; cursor: pointer; z-index: 100;
            display: flex; flex-direction: column; gap: 6px; align-items: center;
            box-shadow: -4px 4px 16px rgba(30, 58, 138, 0.3);
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .history-fab:hover { background: #1e40af; padding-right: 14px; }
        .history-fab .fab-icon { font-size: 20px; line-height: 1; }
        .history-fab .fab-count {
            font-size: 11px; font-weight: 700;
            background: #ef4444; padding: 1px 6px; border-radius: 10px;
            min-width: 18px; text-align: center;
        }
        .history-fab .fab-label {
            font-size: 12px; font-weight: 600;
            writing-mode: vertical-rl; letter-spacing: 2px;
        }
        .history-fab .fab-arrow { font-size: 10px; opacity: 0.7; transition: transform 0.2s; }
        .history-fab.fab-open .fab-arrow { transform: scaleX(-1); }

        /* 抽屉遮罩 */
        .drawer-backdrop {
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(1px);
            z-index: 199;
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .drawer-backdrop.show { opacity: 1; pointer-events: auto; }

        /* 右侧抽屉 */
        .history-drawer {
            position: fixed; right: 0; top: 0; bottom: 0;
            width: 420px; max-width: 90vw;
            background: #fff; z-index: 200;
            box-shadow: -10px 0 32px rgba(15, 23, 42, 0.18);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .history-drawer.open { transform: translateX(0); }

        .drawer-header {
            padding: 20px 22px 16px;
            border-bottom: 1px solid #f1f5f9;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        .drawer-header .dh-title {
            font-size: 16px; font-weight: 700; color: #1f2937;
            display: flex; align-items: center; gap: 8px;
        }
        .drawer-header .dh-count {
            font-size: 12px; font-weight: 500; color: #6b7280;
            margin-left: 4px;
        }
        .drawer-header .dh-close {
            width: 30px; height: 30px; border-radius: 8px;
            border: none; background: #f1f5f9; color: #6b7280;
            cursor: pointer; font-size: 18px; line-height: 1;
            transition: all 0.15s;
        }
        .drawer-header .dh-close:hover { background: #e5e7eb; color: #1f2937; }

        .drawer-list {
            flex: 1; overflow-y: auto;
            padding: 4px 0;
        }
        .drawer-tip {
            padding: 14px 22px;
            font-size: 12px; color: #9ca3af;
            text-align: center; border-top: 1px solid #f1f5f9;
            flex-shrink: 0;
        }

        /* 抽屉里的历史条目（复用 history-item 的结构） */
        .history-item {
            padding: 15px 22px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.15s, border-left-color 0.15s;
            border-left: 3px solid transparent;
        }
        .history-item:hover { background: #f8fafc; }
        .history-item.selected {
            background: #eff6ff;
            border-left-color: #2563eb;
        }
        .history-item-row {
            display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 5px;
        }
        .history-item-row .hi-left {
            display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
        }
        .history-item .hi-avatar {
            width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; color: #fff;
        }
        .history-company { font-weight: 600; color: #1f2937; font-size: 14px; }
        .history-position { font-size: 12px; color: #6b7280; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .history-score { color: #16a34a; font-weight: 700; font-size: 15px; flex-shrink: 0; }
        .history-score.low { color: #f59e0b; }
        .history-score.high { color: #16a34a; }
        .history-score.excellent { color: #059669; }
        .history-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
        .history-tag {
            font-size: 11px; color: #2563eb;
            background: #eff6ff; padding: 2px 8px; border-radius: 4px;
        }
        .history-tag.type { color: #0891b2; background: #ecfeff; }
        .history-tag.diff { color: #c026d3; background: #faf5ff; }
        .history-date { font-size: 11px; color: #9ca3af; margin-left: auto; }
        .history-empty { text-align: center; color: #9ca3af; padding: 40px 0; font-size: 13px; }

        /* 抽屉打开时配置卡片稍微右移露出内容 */
        .state-config.drawer-open .config-card {
            transform: translateX(-8px);
            transition: transform 0.3s ease;
        }

        /* ==================== 状态② 面试中 ==================== */
        .state-chat {
            display: flex; flex-direction: column;
            max-width: 900px; margin: 0 auto;
            height: calc(100vh - 62px);
        }
        .chat-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 24px; background: #fff;
            border-bottom: 1px solid #e5e7eb;
        }
        .chat-title { font-size: 17px; font-weight: 700; color: #1f2937; }
        .chat-subtitle { font-size: 12px; color: #6b7280; margin-top: 3px; }
        .chat-header .exit-btn {
            background: #fff; border: 1.5px solid #d1d5db; color: #374151;
            padding: 6px 14px; border-radius: 8px; font-size: 13px;
            cursor: pointer; transition: all 0.2s;
        }
        .chat-header .exit-btn:hover { border-color: #ef4444; color: #ef4444; }

        .progress-box { padding: 12px 24px; background: #fff; border-bottom: 1px solid #f1f5f9; }
        .progress-text {
            font-size: 12px; color: #4b5563; margin-bottom: 7px;
            display: flex; justify-content: space-between; font-weight: 500;
        }
        .progress-bar { height: 6px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        .chat-body { flex: 1; background: #f0f4f8; overflow: hidden; }
        .messages-area {
            height: 100%; overflow-y: auto;
            padding: 22px 24px;
            display: flex; flex-direction: column; gap: 14px;
        }
        .message { display: flex; gap: 10px; max-width: 85%; animation: fadeInUp 0.25s ease; }
        .message.assistant { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #fff; font-weight: 700; flex-shrink: 0;
        }
        .message.assistant .avatar { background: #1e40af; }
        .message.user .avatar { background: #f59e0b; }

        .message-content {
            padding: 11px 15px; border-radius: 14px;
            font-size: 14px; line-height: 1.65;
            background: #fff; border: 1px solid #e5e7eb;
            color: #1f2937; word-wrap: break-word;
        }
        .message.user .message-content {
            background: #2563eb; color: #fff; border-color: #2563eb;
        }
        .message-content strong { font-weight: 700; }
        .message-content pre {
            background: #1a1a2e; color: #e8e8e8;
            padding: 12px 14px; border-radius: 10px; overflow-x: auto;
            margin: 10px 0; font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 13px;
        }

        .typing-indicator .message-content { padding: 15px 18px; }
        .typing-dots { display: flex; gap: 6px; align-items: center; }
        .typing-dots span {
            width: 8px; height: 8px; background: #94a3b8;
            border-radius: 50%; animation: bounce 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-7px); } }

        .empty-chat {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: #94a3b8; text-align: center;
        }
        .empty-chat-icon { font-size: 48px; margin-bottom: 14px; }
        .empty-chat-text { font-size: 15px; }

        .input-area {
            padding: 14px 24px; background: #fff;
            border-top: 1px solid #e5e7eb;
        }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-row textarea {
            flex: 1; border: 1.5px solid #d1d5db; border-radius: 10px;
            padding: 10px 14px; font-size: 14px; outline: none; resize: none;
            max-height: 120px; font-family: inherit; background: #fff;
        }
        .input-row textarea:focus { border-color: #2563eb; }
        .send-btn {
            border: none; border-radius: 10px; padding: 0 22px;
            background: #2563eb; color: #fff; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .send-btn:hover:not(:disabled) { background: #1d4ed8; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .end-btn {
            width: 100%; background: #fff; color: #dc2626;
            border: 1.5px solid #dc2626; border-radius: 10px;
            padding: 10px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .end-btn:hover:not(:disabled) { background: #fef2f2; }
        .end-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ==================== 状态③ 面试后 ==================== */
        .state-done {
            max-width: 1200px; margin: 0 auto;
            padding: 24px 20px 0;
            min-height: calc(100vh - 62px);
            display: flex; flex-direction: column;
        }
        .done-body {
            display: grid; grid-template-columns: 40% 60%; gap: 18px;
        }
        .replay, .report {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
            padding: 20px; min-height: 480px;
        }
        .replay { display: flex; flex-direction: column; max-height: calc(100vh - 180px); overflow: hidden; }
        .report { display: flex; flex-direction: column; max-height: calc(100vh - 180px); overflow-y: auto; }
        .col-title {
            font-size: 15px; font-weight: 700; color: #1f2937;
            margin-bottom: 14px; flex-shrink: 0;
        }

        /* 回放区消息 */
        .replay-area {
            flex: 1; overflow-y: auto;
            display: flex; flex-direction: column; gap: 0;
        }
        .mini-msg {
            display: flex; gap: 10px; padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px; line-height: 1.65;
        }
        .mini-msg:last-child { border-bottom: none; }
        .mini-msg .who {
            flex: none; font-size: 12px; font-weight: 600;
            border-radius: 6px; padding: 3px 8px; height: fit-content;
        }
        .mini-msg.interviewer .who { background: #dbeafe; color: #1e40af; }
        .mini-msg.student .who { background: #fef3c7; color: #b45309; }
        .mini-msg .content { color: #374151; word-break: break-word; }

        /* 评分报告 */
        .score-report { display: flex; flex-direction: column; flex: 1; }
        .big-score { text-align: center; padding: 10px 0 18px; border-bottom: 1px solid #f1f5f9; margin-bottom: 14px; }
        .big-score .num { font-size: 52px; font-weight: 700; color: #2563eb; line-height: 1; }
        .big-score .label { font-size: 12px; color: #6b7280; margin-top: 6px; }

        .report-block { margin-bottom: 14px; font-size: 13px; line-height: 1.75; }
        .report-block:last-child { margin-bottom: 0; }
        .report-block .h {
            font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 14px;
        }
        .report-block ul { padding-left: 20px; color: #4b5563; }
        .report-block li { margin-bottom: 3px; }
        .report-block p { color: #4b5563; }

        .score-content { font-size: 13px; line-height: 1.75; color: #374151; }
        .score-content pre {
            background: #1a1a2e; color: #e8e8e8;
            padding: 12px 14px; border-radius: 10px; overflow-x: auto;
            margin: 10px 0; font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 13px;
        }
        .score-content strong { font-weight: 700; }
        .score-badge {
            text-align: center; padding: 12px 0 18px; border-bottom: 1px solid #f1f5f9;
            margin-bottom: 14px;
        }
        .score-badge span {
            font-size: 46px; font-weight: 700; color: #2563eb;
        }
        .score-badge::before {
            content: '综合得分'; font-size: 13px; color: #6b7280; display: block; margin-bottom: 6px;
        }

        /* 报告头部信息（企业/岗位/类型/时间/状态） */
        .score-meta {
            display: flex; align-items: center; gap: 12px;
            padding: 14px; background: #f8fafc; border-radius: 10px;
            margin-bottom: 14px; border: 1px solid #f1f5f9;
        }
        .score-meta .sm-avatar {
            width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 700; color: #fff;
        }
        .score-meta .sm-info { flex: 1; min-width: 0; }
        .score-meta .sm-company { font-size: 14px; font-weight: 700; color: #1f2937; }
        .score-meta .sm-position { font-size: 12px; color: #6b7280; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score-meta .sm-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .score-meta .sm-tag {
            font-size: 11px; color: #2563eb; background: #eff6ff;
            padding: 1px 7px; border-radius: 4px;
        }
        .score-meta .sm-status {
            font-size: 12px; font-weight: 600; color: #16a34a; white-space: nowrap;
            background: #ecfdf5; padding: 3px 10px; border-radius: 14px;
        }
        .score-meta .sm-status.pending { color: #f59e0b; background: #fffbeb; }

        /* 能力维度条形图 */
        .competence-chart {
            background: #f8fafc; border-radius: 10px; padding: 14px 16px;
            margin-bottom: 14px; border: 1px solid #f1f5f9;
        }
        .competence-chart .chart-title {
            font-size: 13px; font-weight: 700; color: #374151;
            margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
        }
        .dim-row {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 8px;
        }
        .dim-row:last-child { margin-bottom: 0; }
        .dim-label {
            font-size: 12px; color: #4b5563; flex-shrink: 0;
            width: 80px; text-align: right;
        }
        .dim-bar-bg {
            flex: 1; height: 8px; background: #e5e7eb;
            border-radius: 4px; overflow: hidden;
        }
        .dim-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dim-score {
            font-size: 12px; font-weight: 700; color: #2563eb;
            width: 28px; text-align: right; flex-shrink: 0;
        }

        /* ============ AI 面试官质量评估卡 ============ */
        .ai-evaluator-card {
            margin-top: 16px;
            background: linear-gradient(135deg, #f8fafc, #eff6ff);
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 16px 18px;
        }
        .ai-eval-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .ai-eval-title {
            font-size: 15px; font-weight: 700; color: #1e3a8a;
            display: flex; align-items: center; gap: 6px;
        }
        .ai-eval-overall {
            display: flex; align-items: baseline; gap: 4px;
        }
        .ai-eval-overall .num {
            font-size: 28px; font-weight: 800; color: #1e40af;
            line-height: 1;
        }
        .ai-eval-overall .unit {
            font-size: 13px; color: #64748b;
        }
        .eval-dim-row {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 8px;
        }
        .eval-dim-row:last-child { margin-bottom: 0; }
        .eval-dim-label {
            font-size: 12px; color: #4b5563; flex-shrink: 0;
            width: 80px; text-align: right;
        }
        .eval-bar-bg {
            flex: 1; height: 6px; background: #e5e7eb;
            border-radius: 3px; overflow: hidden;
        }
        .eval-bar-fill {
            height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, #0ea5e9, #2563eb);
            transition: width 0.6s ease;
        }
        .eval-bar-fill.high { background: linear-gradient(90deg, #10b981, #059669); }
        .eval-bar-fill.mid { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .eval-bar-fill.low { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .eval-score {
            font-size: 12px; font-weight: 700;
            width: 30px; text-align: right; flex-shrink: 0;
        }
        .eval-score.high { color: #059669; }
        .eval-score.mid { color: #d97706; }
        .eval-score.low { color: #dc2626; }
        .eval-note {
            font-size: 11px; color: #94a3b8;
            margin-top: 10px; padding-top: 10px;
            border-top: 1px dashed #cbd5e1;
            line-height: 1.6;
        }
        .eval-note .row { display: flex; gap: 4px; margin-bottom: 2px; }

/* 从具体企业名 → 找到所属分组 → 取头像 */
function getCompanyAvatar(companyName) {
    if (!companyName) return { bg: '#6b7280', text: '？' };
    // 1. 先在静态 COMPANY_GROUPS 里找
    for (const group of COMPANY_GROUPS) {
        if (group.companies.includes(companyName)) {
            const g = COMPANY_AVATAR[group.name];
            if (g) return g;
        }
    }
    // 2. 关键词匹配兜底
    if (/华为/.test(companyName)) return { bg: '#dc2626', text: '华' };
    if (/中兴/.test(companyName)) return { bg: '#2563eb', text: '兴' };
    if (/大唐/.test(companyName)) return { bg: '#f97316', text: '大' };
    if (/爱立信/.test(companyName)) return { bg: '#7c3aed', text: '爱' };
    if (/诺基亚/.test(companyName)) return { bg: '#2563eb', text: '诺' };
    if (/烽火/.test(companyName)) return { bg: '#dc2626', text: '烽' };
    if (/海能达/.test(companyName)) return { bg: '#ea580c', text: '海' };
    if (/迈普/.test(companyName)) return { bg: '#0891b2', text: '迈' };
    if (/京信/.test(companyName)) return { bg: '#be123c', text: '京' };
    if (/紫光/.test(companyName)) return { bg: '#8b5cf6', text: '紫' };
    if (/普天/.test(companyName)) return { bg: '#4f46e5', text: '普' };
    if (/中电/.test(companyName) || /CETC/.test(companyName)) return { bg: '#0f766e', text: '电' };
    if (/移动/.test(companyName)) return COMPANY_AVATAR['运营商集团'];
    if (/电信/.test(companyName)) return { bg: '#15803d', text: '信' };
    if (/联通/.test(companyName)) return { bg: '#15803d', text: '联' };
    // 3. 默认灰色
    return { bg: '#6b7280', text: companyName.charAt(0) || '?' };
}

/* ==================== 状态切换 ==================== */
function switchState(stateName) {
    document.getElementById('stateConfig').style.display = stateName === 'config' ? 'block' : 'none';
    document.getElementById('stateChat').style.display = stateName === 'chat' ? 'flex' : 'none';
    document.getElementById('stateDone').style.display = stateName === 'done' ? 'flex' : 'none';
    // 更新品牌栏
    const br = document.getElementById('brandRight');
    const bb = document.getElementById('brandBack');
    if (stateName === 'config') {
        br.textContent = '学生端';
        bb.textContent = '← 返回'; bb.style.display = 'inline-block';
        bb.href = '/'; bb.onclick = null;
        closeHistoryDrawer();
    } else if (stateName === 'chat') {
        br.textContent = '学生端'; bb.style.display = 'none';
        closeHistoryDrawer();
    } else if (stateName === 'done') {
        br.textContent = '✅ 面试完成'; bb.style.display = 'inline-block';
        if (enteredFromHistory) {
            bb.textContent = '← 返回历史记录';
            bb.removeAttribute('href');
            bb.onclick = function(e) { e.preventDefault(); backToConfig(); };
        } else {
            bb.textContent = '← 返回';
            bb.href = '/'; bb.onclick = null;
        }
    }
}

function backToConfig() {
    enteredFromHistory = false;

/* ==================== 开始面试（SSE流式） ==================== */
async function startInterview() {
    if (isGenerating) return;

    let company = getCompanyValue() || '自定义企业';
    let position = getPositionValue() || '通信工程师';
    let interviewType = document.getElementById('typeSelect').value || '技术面';
    let difficulty = document.getElementById('difficultySelect').value || '中等';

    // 更新面试信息（空值时显示默认名称）
    document.getElementById('chatTitle').textContent = company + ' · ' + position;
    document.getElementById('chatSubtitle').textContent = interviewType + ' · ' + difficulty;

    // 重置状态
    studentReplyCount = 0;
    updateProgress();
    clearMessages();

    // 切换到聊天态
    switchState('chat');

    addTypingIndicator();
    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = true;
    isGenerating = true;

    try {
        const response = await fetch('/api/mock-interview/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                company: company, position: position,
                interview_type: interviewType, difficulty: difficulty
            })
        });
        if (!response.ok) throw new Error('请求失败: ' + response.status);

        removeTypingIndicator();
        const msgDiv = addMessage('', false);
        let fullText = '';
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split('\n\n');
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const dataStr = line.slice(6);
                    if (dataStr === '[DONE]') continue;
                    try {
                        const data = JSON.parse(dataStr);
                        if (data.interview_id) {
                            currentInterviewId = data.interview_id;
                            showChatInput();
                        } else if (data.content) {
                            fullText += data.content;
                            msgDiv.innerHTML = formatMessage(fullText);
                            scrollToBottom();
                        } else if (data.error) {
                            msgDiv.innerHTML = '<span style="color:#dc2626;">' + escapeHtml(data.error) + '</span>';
                        }
                    } catch(e) {}
                }
            }
        }
    } catch (error) {
        removeTypingIndicator();
        addMessage('面试启动失败，请稍后重试', false);
        console.error('开始面试失败:', error);
    } finally {
        isGenerating = false;
        startBtn.disabled = false;
    }
}

    if (!currentInterviewId || isGenerating) return;

    const input = document.getElementById('userInput');

        });
        if (!response.ok) throw new Error('请求失败: ' + response.status);

        removeTypingIndicator();
        const msgDiv = addMessage('', false);
        let fullText = '';
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split('\n\n');
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const dataStr = line.slice(6);
                    if (dataStr === '[DONE]') continue;
                    try {
                        const data = JSON.parse(dataStr);
                        if (data.content) {
                            fullText += data.content;
                            msgDiv.innerHTML = formatMessage(fullText);
                            scrollToBottom();
                        } else if (data.error) {
                            msgDiv.innerHTML = '<span style="color:#dc2626;">' + escapeHtml(data.error) + '</span>';
                        }
                    } catch(e) {}
                }
            }
        }
    } catch (error) {

async function endInterviewConfirmed() {
    if (!currentInterviewId || isGenerating) return;

    const savedId = currentInterviewId; // 先保存
    const reportDiv = document.getElementById('scoreContent');
    reportDiv.innerHTML = '<span style="color:#999;">正在生成评分报告...</span>';

    // 先填充对话回放（从当前 messagesArea）
    renderReplayFromCurrentMessages();

    // 先切换
    switchState('done');
    isGenerating = true;

    try {
        const response = await fetch('/api/mock-interview/end', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({interview_id: savedId})
        });

        if (!response.ok) throw new Error('请求失败: ' + response.status);

        let fullText = '';
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split('\n\n');
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const dataStr = line.slice(6);
                    if (dataStr === '[DONE]') continue;
                    try {
                        const data = JSON.parse(dataStr);
                        if (data.content) {
                            fullText += data.content;
                            // 边流式边尝试解析 JSON 报告
                            reportDiv.innerHTML = tryFormatScoreReport(fullText);
                        } else if (data.error) {
                            reportDiv.innerHTML = '<span style="color:#dc2626;">' + escapeHtml(data.error) + '</span>';
                        }
                    } catch(e) {}
                }
            }
        }

        // 流结束后再取一次详情
        try {
            const detailResp = await fetch('/api/mock-interview/records/' + savedId);
            const detail = await detailResp.json();
            if (detail.success && detail.record) {
                reportDiv.innerHTML = buildStructuredReport(detail.record);
            }
        } catch(e) {}

        document.getElementById('scoreActions').style.display = 'none';
    } catch (error) {
        reportDiv.innerHTML = '<span style="color:#dc2626;">评分生成失败，请稍后重试</span>';
        console.error('结束面试失败:', error);
    } finally {
        currentInterviewId = null;
        isGenerating = false;
        // 刷新 FAB 计数（面试结束后新增了一条记录）
        fetch('/api/mock-interview/records').then(r => r.json()).then(d => {
            updateFabCount((d.records || []).length);
        });
    }
}

/* ==================== 评分报告渲染 ==================== */
function tryFormatScoreReport(text) {
    // 尝试从流式文本里解析 JSON
    try {
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
            const r = JSON.parse(jsonMatch[0]);
            return buildScoreReportFromJson(r, text);
        }
    } catch(e) {}
    // 解析失败直接显示原始 markdown
    return formatMessage(text);
}

/* 能力维度 ID → 中文名称映射（与后端 COMPETENCE_AREAS 同步） */
const COMPETENCE_NAME_MAP = {
    communication_principle: '通信原理',
    rf_engineering: '射频工程',
    network_protocol: '网络协议',
    troubleshooting: '故障排查',
    digital_signal: '数字信号',
    modulation: '调制技术',
    coding: '编码技术',
    signal_system: '信号与系统',
    hardware: '硬件设计',
    communication: '沟通表达',
    'communication_principle ': '通信原理',
};

function buildStructuredReport(record) {
    let html = '';
    // ① 报告头部信息
    html += buildScoreMeta(record);
    // ② 大分数徽章
    if (record.score != null && record.score !== undefined) {
        html += `<div class="score-badge"><span>${escapeHtml(String(Math.round(record.score)))}</span></div>`;
    }
    // ③ 能力维度条形图
    html += buildCompetenceChart(record.competence_scores);
    // ④ 结构化报告块
    html += '<div class="structured-report">';
    if (record.strengths && record.strengths.length) {
        html += '<div class="s-block"><div class="s-title">✅ 优势</div><ul>' +
            record.strengths.map(s => `<li>${escapeHtml(s)}</li>`).join('') + '</ul></div>';
    }
    if (record.weaknesses && record.weaknesses.length) {
        html += '<div class="s-block"><div class="s-title">⚠️ 不足</div><ul>' +
            record.weaknesses.map(s => `<li>${escapeHtml(s)}</li>`).join('') + '</ul></div>';
    }
    if (record.suggestions && record.suggestions.length) {
        html += '<div class="s-block"><div class="s-title">💡 建议</div><ul>' +
            record.suggestions.map(s => `<li>${escapeHtml(s)}</li>`).join('') + '</ul></div>';
    }
    if (record.score_report) {
        let reportText = record.score_report;
        try { reportText = reportText.replace(/\{[\s\S]*\}/, '').trim(); } catch(e) {}
        if (reportText) {
            html += '<div class="s-block"><div class="s-title">📋 综合评语</div><p>' +
                formatMessage(reportText) + '</p></div>';
        }
    }
    html += '</div>';
    // ⑤ AI 面试官质量评估
    html += buildAiEvaluatorCard(record.ai_evaluator);
    return html;
}

function buildScoreReportFromJson(r, fallbackText) {
    let html = '';
    // ① 报告头部信息（从 fallbackText 可能拿不到完整 record，r 里如果没有就跳过）
    html += buildScoreMeta(r);
    // ② 大分数
    if (r.score != null) {
        html += `<div class="score-badge"><span>${escapeHtml(String(Math.round(r.score)))}</span></div>`;
    }
    // ③ 能力条形图
    html += buildCompetenceChart(r.competence_scores);
    // ④ 结构化块
    html += '<div class="structured-report">';
    if (r.strengths && r.strengths.length) {
        html += '<div class="s-block"><div class="s-title">✅ 优势</div><ul>' +
            r.strengths.map(s => `<li>${escapeHtml(s)}</li>`).join('') + '</ul></div>';
    }
    if (r.weaknesses && r.weaknesses.length) {
        html += '<div class="s-block"><div class="s-title">⚠️ 不足</div><ul>' +
            r.weaknesses.map(s => `<li>${escapeHtml(s)}</li>`).join('') + '</ul></div>';
    }
    if (r.suggestions && r.suggestions.length) {
        html += '<div class="s-block"><div class="s-title">💡 建议</div><ul>' +
            r.suggestions.map(s => `<li>${escapeHtml(s)}</li>`).join('') + '</ul></div>';
    }
    if (r.report) {
        html += '<div class="s-block"><div class="s-title">📋 综合评语</div><p>' +
            formatMessage(r.report) + '</p></div>';
    } else if (fallbackText) {
        html += '<div class="s-block"><div class="s-title">📋 综合评语</div><p>' +
            formatMessage(fallbackText) + '</p></div>';
    }
    html += '</div>';
    // ⑤ AI 面试官质量评估
    html += buildAiEvaluatorCard(r.ai_evaluator);
    return html;
}

/* ==================== 报告头部信息 ==================== */
function buildScoreMeta(r) {
    if (!r || (!r.target_company && !r.target_position)) return '';
    const avatar = getCompanyAvatar(r.target_company);
    const company = r.target_company || '';
    const position = r.target_position || '';
    const typeLabel = (r.interview_type || '技术面');
    const diffLabel = r.difficulty || '';
    const msgCount = (r.messages || []).length;
    const studentMsgs = (r.messages || []).filter(m => m.role === 'student').length;
    const date = r.started_at || r.completed_at || r.created_at
        ? (r.started_at || r.completed_at || r.created_at).replace('T', ' ').slice(0, 16)
        : (new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-').slice(0, 16));
    return `
        <div class="score-meta">
            <div class="sm-avatar" style="background:${avatar.bg}">${escapeHtml(avatar.text)}</div>
            <div class="sm-info">
                <div class="sm-company">${escapeHtml(company)}</div>
                <div class="sm-position">${escapeHtml(position)}</div>
                <div class="sm-tags">
                    <span class="sm-tag">${escapeHtml(typeLabel)}</span>
                    ${diffLabel ? `<span class="sm-tag">难度·${escapeHtml(diffLabel)}</span>` : ''}
                    <span class="sm-tag">${studentMsgs} 轮问答</span>
                </div>
            </div>
            <div class="sm-status">✓ 已完成</div>
        </div>`;
}

/* ==================== 能力维度条形图 ==================== */
function buildCompetenceChart(competenceScores) {
    if (!competenceScores || typeof competenceScores !== 'object') return '';
    const entries = Object.entries(competenceScores)
        .filter(([k, v]) => v != null && Number(v) > 0)
        .map(([k, v]) => ({ id: k, score: Number(v) }))
        .sort((a, b) => b.score - a.score);
    if (!entries.length) return '';
    const dims = entries.slice(0, 8);
    let rows = dims.map(d => {
        const label = COMPETENCE_NAME_MAP[d.id] || d.id;
        return `
            <div class="dim-row">
                <span class="dim-label">${escapeHtml(label)}</span>
                <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${d.score}%"></div></div>
                <span class="dim-score">${Math.round(d.score)}</span>
            </div>`;
    }).join('');
    return `
        <div class="competence-chart">
            <div class="chart-title">📈 能力维度得分</div>
            ${rows}
        </div>`;
}

/* ==================== AI 面试官质量评估卡 ==================== */
function buildAiEvaluatorCard(evaluator) {
    if (!evaluator || !evaluator.dimensions || !evaluator.dimensions.length) return '';
    const overall = evaluator.overall || 0;
    const overallCls = overall >= 80 ? 'high' : (overall >= 60 ? 'mid' : 'low');
    const dims = evaluator.dimensions.map(d => {
        const s = d.score;
        const cls = s >= 80 ? 'high' : (s >= 60 ? 'mid' : 'low');
        return `
            <div class="eval-dim-row">
                <span class="eval-dim-label" title="${escapeHtml(d.note || '')}">${escapeHtml(d.label)}</span>
                <div class="eval-bar-bg"><div class="eval-bar-fill ${cls}" style="width:${s}%"></div></div>
                <span class="eval-score ${cls}">${Math.round(s)}</span>
            </div>`;
    }).join('');
    // 每个维度的简短说明（前 2 个）
    const notes = evaluator.dimensions.slice(0, 2).map(d =>
        `<div class="row"><span class="tag">${escapeHtml(d.label)}</span><span class="txt">${escapeHtml(d.note || '')}</span></div>`
    ).join('');
    return `
        <div class="ai-evaluator-card">
            <div class="ai-eval-header">
                <div class="ai-eval-title">🤖 AI 面试官评估</div>
                <div class="ai-eval-overall">
                    <span class="num ${overallCls}">${overall}</span>
                    <span class="unit">/ 100</span>
                </div>
            </div>
            ${dims}
            ${notes ? `<div class="eval-note">${notes}</div>` : ''}
        </div>`;
}

/* ==================== 对话回放 ==================== */

        replayArea.innerHTML = '<div style="color:#9ca3af;text-align:center;padding:40px 0;font-size:13px;">暂无对话记录</div>';
        return;
    }
    let html = '';
    messages.forEach(msg => {

        const contentDiv = msg.querySelector('.message-content');
        const content = contentDiv ? contentDiv.innerHTML.replace(/^<div style="font-size:11px.*?<\/div>/, '') : '';

        html += `<div class="mini-msg ${isInterviewer ? 'interviewer' : 'student'}">` +
            `<span class="who">${who}</span><span class="content">${content}</span></div>`;

        replayArea.innerHTML = '<div style="color:#9ca3af;text-align:center;padding:40px 0;font-size:13px;">暂无对话记录</div>';

        }
    });
    replayArea.innerHTML = html;
}

    const messagesArea = document.getElementById('messagesArea');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message ' + (isUser ? 'user' : 'assistant');

    // 根据企业给面试官头像上色
    let avatarChar = isUser ? '我' : '面';
    let avatarBg = isUser ? '#f59e0b' : '#1e40af';
    if (!isUser) {
        const title = document.getElementById('chatTitle').textContent;
        const companyName = title.split(' · ')[0] || getCompanyValue();
        for (const g of COMPANY_GROUPS) {
            if (g.companies.includes(companyName)) {
                const info = COMPANY_AVATAR[g.name];
                if (info) { avatarBg = info.bg; avatarChar = info.text; }
                break;
            }
        }
        // 如果是华为/中兴等大厂，用其简称
        if (companyName.includes('华为')) avatarChar = '华';
        else if (companyName.includes('中兴')) avatarChar = '兴';
        else if (companyName.includes('爱立信')) avatarChar = '爱';
        else if (companyName.includes('诺基亚')) avatarChar = '诺';
        else if (companyName.includes('移动')) avatarChar = '移';
        else if (companyName.includes('电信')) avatarChar = '信';
        else if (companyName.includes('联通')) avatarChar = '联';
        else if (companyName.includes('大唐')) avatarChar = '唐';
        else if (companyName.includes('烽火')) avatarChar = '烽';
    }

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.style.background = avatarBg;
    avatar.textContent = avatarChar;

    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content';
    contentDiv.innerHTML = formatMessage(content);

    messageDiv.appendChild(avatar);
    messageDiv.appendChild(contentDiv);

    // 插入到输入区前面（chat-body 最后一个元素是 inputArea 父级）
    messagesArea.appendChild(messageDiv);
    document.getElementById('emptyState').style.display = 'none';
    scrollToBottom();
    return contentDiv;
}

function formatMessage(content) {
    if (!content) return '';
    let html = escapeHtml(content);
    html = html.replace(/```([\s\S]*?)```/g, function(m, p1) {
        return '<pre><code>' + p1.replace(/<br>/g, '\n') + '</code></pre>';
    });
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, function(m, p1) {
        return '<pre><code>' + p1.replace(/<br>/g, '\n') + '</code></pre>';
    });
    return html;
}

function addTypingIndicator() {
    const messagesArea = document.getElementById('messagesArea');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message assistant';
    messageDiv.id = 'typingIndicator';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.style.background = '#1e40af';
    avatar.textContent = '面';

    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content typing-indicator';
    contentDiv.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    messageDiv.appendChild(avatar);
    messageDiv.appendChild(contentDiv);
    messagesArea.appendChild(messageDiv);
    scrollToBottom();
    return messageDiv;
}

function removeTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
}

function clearMessages() {
    document.getElementById('messagesArea').innerHTML =
        '<div id="emptyState" class="empty-chat">' +
        '<div class="empty-chat-icon">🎯</div>' +
        '<div class="empty-chat-text">等待面试官开始...</div>' +
        '</div>';
}

function scrollToBottom() {
    const messagesArea = document.getElementById('messagesArea');
    messagesArea.scrollTop = messagesArea.scrollHeight;
}

function setInputDisabled(disabled) {
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    if (userInput) userInput.disabled = disabled;
    if (sendBtn) sendBtn.disabled = disabled;
}

function handleKeyDown(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

function autoResize() {
    const input = document.getElementById('userInput');
    if (!input) return;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

/* ==================== 历史记录 ==================== */
async function loadRecords() {
    try {
        const response = await fetch('/api/mock-interview/records');
        const data = await response.json();
        if (!data.success) { document.getElementById('historyList').innerHTML = '<div class="history-empty">加载失败</div>'; return; }
        renderRecords(data.records || []);
    } catch (error) {
        console.error('加载历史记录失败:', error);
        document.getElementById('historyList').innerHTML = '<div class="history-empty">加载失败</div>';
    }
}

function renderRecords(records) {
    const container = document.getElementById('historyList');
    if (!records.length) { container.innerHTML = '<div class="history-empty">暂无面试记录</div>'; return; }
    container.innerHTML = records.map(r => {
        const scoreHtml = (r.score != null && r.score !== undefined)
            ? '<span class="history-score">' + escapeHtml(String(r.score)) + '分</span>' : '';
        const date = r.started_at || r.completed_at || '';
        return `
            <div class="history-item" onclick="loadHistoryRecord('${escapeHtml(r.id)}')">
                <div class="history-item-row">
                    <span class="history-company">${escapeHtml(r.target_company || '未知')} · ${escapeHtml(r.target_position || '未知')}</span>
                    ${scoreHtml}
                </div>
                <div class="history-meta">
                    <span class="history-tag">${escapeHtml(r.interview_type || '')}</span>
                    <span class="history-tag">🔄 ${r.rounds || 0}轮</span>
                    <span class="history-date">${escapeHtml(date)}</span>
                </div>
            </div>`;
    }).join('');
}

async function loadHistoryRecord(id) {
    try {
        const response = await fetch('/api/mock-interview/records/' + id);
        const data = await response.json();
        if (!data.success) { alert('加载记录失败'); return; }
        const record = data.record;

        enteredFromHistory = true;
        // 切换到完成态
        switchState('done');

        // 填充回放
        renderReplayFromRecords(record.messages || []);

        // 填充评分
        const reportDiv = document.getElementById('scoreContent');
        if (record.score_report || record.score != null) {
            reportDiv.innerHTML = buildStructuredReport(record);
        } else {
            reportDiv.innerHTML = '<span style="color:#999;">本次面试暂无评分报告</span>';
        }
    } catch (error) {
        console.error('加载历史记录详情失败:', error);
        alert('加载记录失败');
    }
}

/* ==================== 重置 / 返回 ==================== */
function resetInterview() {
    currentInterviewId = null;
    studentReplyCount = 0;
    enteredFromHistory = false;
    document.getElementById('inputArea').style.display = 'none';
    clearMessages();
    updateProgress();
    switchState('config');
    // 启动成功后刷新 FAB 计数
    loadHistoryIntoDrawer();
}

function backToChat() {
    // 面试已结束后无法回到聊天，直接重置
    resetInterview();
}

/* ==================== 历史抽屉 ==================== */
function openHistoryDrawer() {
    document.getElementById('historyDrawer').classList.add('open');
    document.getElementById('drawerBackdrop').classList.add('show');
    document.getElementById('historyFab').classList.add('fab-open');
    document.getElementById('stateConfig').classList.add('drawer-open');
    loadHistoryIntoDrawer();
}
function closeHistoryDrawer() {
    document.getElementById('historyDrawer').classList.remove('open');
    document.getElementById('drawerBackdrop').classList.remove('show');
    document.getElementById('historyFab').classList.remove('fab-open');
    document.getElementById('stateConfig').classList.remove('drawer-open');
}
function toggleHistoryDrawer() {
    if (document.getElementById('historyDrawer').classList.contains('open')) {
        closeHistoryDrawer();
    } else {
        openHistoryDrawer();
    }
}
function updateFabCount(n) {
    document.getElementById('fabCount').textContent = n || 0;
}
async function loadHistoryIntoDrawer() {
    const listEl = document.getElementById('drawerList');
    const countEl = document.getElementById('drawerCount');
    listEl.innerHTML = '<div class="history-empty">加载中...</div>';
    try {
        const res = await fetch('/api/mock-interview/records');
        const data = await res.json();
        const records = data.records || [];
        lastHistoryRecords = records;
        updateFabCount(records.length);
        countEl.textContent = `（共 ${records.length} 次）`;
        if (records.length === 0) {
            listEl.innerHTML = '<div class="history-empty">还没有面试记录<br>开始第一场模拟面试吧！</div>';
            return;
        }
        listEl.innerHTML = records.map(r => renderDrawerItem(r)).join('');
    } catch (e) {
        listEl.innerHTML = '<div class="history-empty">加载失败，请重试</div>';
    }
}
function renderDrawerItem(r) {
    const avatar = getCompanyAvatar(r.target_company);
    const scoreClass = r.score >= 85 ? 'excellent' : (r.score >= 70 ? 'high' : 'low');
    const typeLabel = (r.interview_type || '技术面').replace('技术一面','技术一面').replace('技术二面','技术二面').replace('技术三面','技术三面');
    const diffLabel = r.difficulty || '中等';
    const date = r.created_at ? r.created_at.replace('T', ' ').slice(0, 16) : '';
    const selectedCls = (enteredFromHistory && r.selected) ? ' selected' : '';
    return `
        <div class="history-item${selectedCls}" onclick="selectDrawerItem('${escapeHtml(r.id)}')">
            <div class="history-item-row">
                <div class="hi-left">
                    <div class="hi-avatar" style="background:${avatar.bg}">${escapeHtml(avatar.text)}</div>
                    <div style="min-width:0;">
                        <div class="history-company">${escapeHtml(r.target_company || '')}</div>
                        <div class="history-position">${escapeHtml(r.target_position || '')}</div>
                    </div>
                </div>
                <div class="history-score ${scoreClass}">${r.score != null ? Math.round(r.score) : '--'}分</div>
            </div>
            <div class="history-meta">
                <span class="history-tag type">${escapeHtml(typeLabel)}</span>
                <span class="history-tag diff">${escapeHtml(diffLabel)}</span>
                <span class="history-date">${escapeHtml(date)}</span>
            </div>
        </div>`;
}
function selectDrawerItem(id) {
    closeHistoryDrawer();
    loadHistoryRecord(id);
}

/* ==================== 页面初始化 ==================== */
document.addEventListener('DOMContentLoaded', function() {
    initStaticConfig();
    fetch('/current-user').then(r => r.json()).then(u => {
        if (!u.authenticated) { window.location.href = '/login'; return; }
        // 启动时刷新 FAB 计数（不强制开抽屉）
        loadHistoryIntoDrawer().then(() => closeHistoryDrawer());
    }).catch(() => { window.location.href = '/login'; });
});
</script>
