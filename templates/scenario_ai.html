<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 自定义剧情 - 灵智尚人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #071521;
            --bg2: #0b2233;
            --panel: rgba(13, 33, 52, .92);
            --panel2: rgba(18, 43, 66, .96);
            --line: rgba(77, 216, 255, .16);
            --line2: rgba(77, 216, 255, .34);
            --cyan: #4dd8ff;
            --cyan2: #00c8ff;
            --text: #e6f3ff;
            --muted: #7ea6c6;
            --green: #4ade80;
            --gold: #ffd66b;
            --red: #ff6b6b;
            --radius: 12px;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
            background:
                radial-gradient(1100px 620px at 78% -12%, rgba(0, 160, 255, .16), transparent 62%),
                radial-gradient(760px 520px at 4% 104%, rgba(168, 85, 247, .08), transparent 60%),
                var(--bg);
        }

        /* ============ 左侧任务清单 ============ */
        .side {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--line);
            background: rgba(8, 24, 38, .72);
            backdrop-filter: blur(10px);
            min-height: 0;
        }

        .brand { padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }

        .brand a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            text-decoration: none;
            font-size: 12px;
            margin-bottom: 12px;
            transition: color .2s;
        }

        .brand a:hover { color: var(--cyan); }

        .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: .5px; line-height: 1.45; }
        .brand h1 span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .stat-row { display: flex; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }

        .stat {
            flex: 1;
            background: rgba(0, 200, 255, .05);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 9px 10px;
            text-align: center;
        }

        .stat b {
            display: block;
            font-size: 18px;
            color: var(--cyan);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stat span { font-size: 11px; color: var(--muted); }

        .task-list { flex: 1; overflow-y: auto; padding: 12px 12px 8px; min-height: 0; }
        .task-list::-webkit-scrollbar { width: 5px; }
        .task-list::-webkit-scrollbar-thumb { background: rgba(77, 216, 255, .22); border-radius: 3px; }

        .titem {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background .18s, border-color .18s;
        }

        .titem:hover:not(.locked) { background: rgba(77, 216, 255, .06); }
        .titem.active { background: rgba(77, 216, 255, .1); border-color: var(--line2); }
        .titem.locked { cursor: not-allowed; opacity: .42; }

        .tnum {
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 600;
            background: rgba(126, 166, 198, .16);
            color: var(--muted);
            margin-top: 1px;
        }

        .titem.active .tnum { background: var(--cyan); color: #062032; }
        .titem.done .tnum { background: rgba(74, 222, 128, .18); color: var(--green); }

        .tinfo { min-width: 0; flex: 1; }
        .tinfo b {
            display: block;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tinfo i { display: block; font-style: normal; font-size: 11px; color: var(--muted); margin-top: 3px; }

        .side-foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); }

        /* ============ 右侧主区 ============ */
        .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

        .top {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 28px;
            border-bottom: 1px solid var(--line);
            background: rgba(8, 24, 38, .55);
        }

        .top-title { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; min-width: 0; }
        .top-title small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 3px; }
        .top-title .tt-main { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw; }

        .ai-badge {
            flex: 0 0 auto;
            font-size: 10.5px;
            padding: 3px 9px;
            border-radius: 99px;
            background: rgba(168, 85, 247, .16);
            border: 1px solid rgba(192, 132, 252, .4);
            color: #d8b4fe;
            white-space: nowrap;
        }

        .bar {
            flex: 1;
            height: 6px;
            background: rgba(126, 166, 198, .16);
            border-radius: 99px;
            overflow: hidden;
            min-width: 80px;
        }

        .bar i {
            display: block;
            height: 100%;
            width: 0;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--cyan2), var(--green));
            transition: width .45s cubic-bezier(.2, .8, .2, 1);
        }

        .clock { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

        .body { flex: 1; overflow-y: auto; padding: 24px 28px 12px; min-height: 0; }
        .body::-webkit-scrollbar { width: 7px; }
        .body::-webkit-scrollbar-thumb { background: rgba(77, 216, 255, .2); border-radius: 4px; }

        .foot {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            border-top: 1px solid var(--line);
            background: rgba(8, 24, 38, .72);
        }

        .foot-tip { font-size: 12px; color: var(--muted); flex: 1; }
        .foot-tip.warn { color: var(--gold); }

        /* ============ 通用组件 ============ */
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 16px;
            max-width: 960px;
        }

        .step-tag {
            display: inline-block;
            font-size: 11px;
            color: var(--cyan);
            border: 1px solid var(--line2);
            border-radius: 99px;
            padding: 3px 11px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .task-desc {
            background: rgba(0, 200, 255, .045);
            border: 1px solid var(--line);
            border-left: 3px solid var(--cyan);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 13px;
            line-height: 1.95;
        }

        .task-desc b { color: var(--cyan); font-weight: 500; }

        .muted { color: var(--muted); }
        .small { font-size: 12px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 20px;
            border-radius: 8px;
            border: 1px solid var(--line2);
            background: rgba(77, 216, 255, .08);
            color: var(--cyan);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all .18s;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) { background: rgba(77, 216, 255, .16); border-color: var(--cyan); }
        .btn:disabled { opacity: .38; cursor: not-allowed; }

        .btn.primary {
            background: linear-gradient(135deg, #00a8e8, #00c8ff);
            border-color: transparent;
            color: #03202f;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(0, 180, 255, .22);
        }

        .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
        .btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
        .btn.ghost:hover:not(:disabled) { color: var(--cyan); border-color: var(--line2); background: rgba(77, 216, 255, .06); }
        .btn.sm { padding: 6px 12px; font-size: 12px; }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(4, 16, 26, .8);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color .18s;
            font-variant-numeric: tabular-nums;
        }

        textarea { resize: vertical; min-height: 74px; line-height: 1.7; }
        input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
        input::placeholder, textarea::placeholder { color: rgba(126, 166, 198, .5); }
        select option { background: #0b2233; }

        /* ============ 选项卡 ============ */
        .opt-intro { font-size: 13px; line-height: 1.9; margin-bottom: 16px; }
        .opt-intro b { color: var(--cyan); font-weight: 500; }

        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .opt-card {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 13px 14px;
            background: rgba(255, 255, 255, .02);
            cursor: pointer;
            transition: all .16s;
        }

        .opt-card:hover { border-color: var(--line2); background: rgba(77, 216, 255, .05); }
        .opt-card.selected { border-color: var(--cyan); background: rgba(77, 216, 255, .09); }
        .opt-card.revealed { cursor: default; }
        .opt-card.right { border-color: rgba(74, 222, 128, .5); background: rgba(74, 222, 128, .08); }
        .opt-card.wrong { border-color: rgba(255, 107, 107, .5); background: rgba(255, 107, 107, .08); }

        .opt-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
        .opt-sub { font-size: 11.5px; color: var(--muted); line-height: 1.65; }

        .opt-card.multi .opt-name::before { content: '◻ '; color: var(--muted); }
        .opt-card.multi.selected .opt-name::before { content: '☑ '; color: var(--cyan); }

        .quiz-no { font-size: 11px; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px; }

        .feedback-bar { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 12.5px; line-height: 1.85; }
        .feedback-bar.show { display: block; }
        .feedback-bar.good { background: rgba(74, 222, 128, .08); border: 1px solid rgba(74, 222, 128, .35); color: #c6f8d8; }
        .feedback-bar.bad { background: rgba(255, 107, 107, .08); border: 1px solid rgba(255, 107, 107, .35); color: #ffc9c9; }
        .feedback-bar b { font-weight: 600; }

        /* ============ 地图（选址） ============ */
        .map-wrap {
            position: relative;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            background:
                linear-gradient(rgba(77, 216, 255, .05) 1px, transparent 1px) 0 0 / 100% 34px,
                linear-gradient(90deg, rgba(77, 216, 255, .05) 1px, transparent 1px) 0 0 / 34px 100%,
                #061320;
            height: 300px;
        }

        .map-wrap svg { width: 100%; height: 100%; display: block; }

        .map-pin {
            position: absolute;
            transform: translate(-50%, -100%);
            font-size: 24px;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .55));
            pointer-events: none;
        }

        .site-wrap { display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; align-items: start; }
        .site-side { display: flex; flex-direction: column; gap: 10px; }
        .site-side .side-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

        .spot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .spot-btn {
            padding: 10px 8px;
            text-align: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, .02);
            font-size: 12.5px;
            cursor: pointer;
            transition: all .16s;
            font-family: inherit;
            color: var(--text);
        }

        .spot-btn:hover { border-color: var(--line2); }
        .spot-btn.active { border-color: var(--cyan); background: rgba(77, 216, 255, .1); color: var(--cyan); }
        .spot-btn.confirm { border-color: rgba(74, 222, 128, .45); color: var(--green); background: rgba(74, 222, 128, .07); }
        .spot-btn.ok-done { background: rgba(74, 222, 128, .16); }

        /* ============ 勘察表 ============ */
        .survey-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

        .survey-tab {
            padding: 7px 15px;
            border-radius: 8px;
            border: 1px solid var(--line);
            font-size: 12.5px;
            color: var(--muted);
            cursor: pointer;
            transition: all .16s;
            background: rgba(255, 255, 255, .02);
        }

        .survey-tab.active { background: rgba(77, 216, 255, .1); border-color: var(--line2); color: var(--cyan); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-item label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
        .form-row { display: flex; gap: 8px; }
        .form-row input { flex: 1; min-width: 0; }
        .form-row .btn { flex: 0 0 auto; }

        input.filled-auto { border-color: rgba(74, 222, 128, .45); }

        .survey-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }

        /* 测量设备弹窗 */
        .device-pop {
            position: fixed;
            left: 50%;
            top: 42%;
            transform: translate(-50%, -50%);
            width: 240px;
            background: var(--panel2);
            border: 1px solid var(--line2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            z-index: 80;
            box-shadow: 0 22px 60px rgba(0, 0, 0, .55);
        }

        .device-pop .dev-icon { font-size: 34px; margin-bottom: 8px; }
        .device-pop .dev-name { font-size: 12.5px; color: var(--cyan); margin-bottom: 12px; }
        .device-pop .dev-val { font-size: 13px; font-weight: 600; margin-top: 10px; min-height: 18px; }

        .scan-bar {
            height: 5px;
            border-radius: 99px;
            background: rgba(126, 166, 198, .16);
            overflow: hidden;
        }

        .scan-bar i {
            display: block;
            height: 100%;
            width: 40%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--cyan2), var(--green));
            animation: scanMove 1.1s linear infinite;
        }

        @keyframes scanMove {
            0% { margin-left: -40%; }
            100% { margin-left: 100%; }
        }

        /* 工程规划参考 */
        .plan-modal {
            position: fixed;
            inset: 0;
            background: rgba(3, 10, 18, .72);
            backdrop-filter: blur(5px);
            display: grid;
            place-items: center;
            z-index: 90;
        }

        .plan-card {
            width: min(430px, 92vw);
            max-height: 76vh;
            overflow-y: auto;
            background: var(--panel2);
            border: 1px solid var(--line2);
            border-radius: 14px;
            padding: 20px 22px;
        }

        .plan-card h4 { font-size: 14px; margin-bottom: 10px; color: var(--cyan); }
        .plan-row {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-size: 12.5px;
            padding: 7px 0;
            border-bottom: 1px dashed rgba(77, 216, 255, .13);
        }
        .plan-row .k { color: var(--muted); white-space: nowrap; }
        .plan-row .v { text-align: right; }
        .plan-close { text-align: center; margin-top: 16px; }

        /* ============ 方案设计 ============ */
        .design-result {
            display: none;
            margin-top: 16px;
            padding: 13px 15px;
            border-radius: 8px;
            background: rgba(74, 222, 128, .07);
            border: 1px solid rgba(74, 222, 128, .3);
            font-size: 12.5px;
            line-height: 1.9;
        }

        .design-result.show { display: block; }
        .design-result b { color: var(--cyan); }

        /* ============ AI 生成面板 ============ */
        .gen-mask {
            position: fixed;
            inset: 0;
            background: rgba(3, 10, 18, .78);
            backdrop-filter: blur(6px);
            display: none;
            place-items: center;
            z-index: 60;
        }

        .gen-mask.show { display: grid; }

        .gen-card {
            width: min(560px, 92vw);
            background: var(--panel2);
            border: 1px solid var(--line2);
            border-radius: 14px;
            padding: 26px 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
        }

        .gen-card h3 { font-size: 16px; margin-bottom: 6px; }
        .gen-card h3 em { font-style: normal; color: var(--cyan); }
        .gen-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; line-height: 1.75; }

        .gen-field { margin-bottom: 14px; }
        .gen-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }

        .gen-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

        .gen-tags span {
            font-size: 11.5px;
            padding: 5px 12px;
            border-radius: 99px;
            border: 1px solid var(--line);
            color: var(--muted);
            cursor: pointer;
            transition: all .16s;
        }

        .gen-tags span:hover { color: var(--cyan); border-color: var(--line2); background: rgba(77, 216, 255, .06); }

        .gen-btn { width: 100%; margin-top: 4px; }

        .gen-loading { display: none; text-align: center; padding: 28px 0 18px; }
        .gen-loading.show { display: block; }
        .gen-load-ic { font-size: 38px; animation: genFloat 2s ease-in-out infinite; }

        @keyframes genFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .gen-load-sub { font-size: 12.5px; color: var(--muted); margin-top: 14px; min-height: 18px; }
        .gen-load-time { font-size: 12px; color: var(--muted); margin-top: 8px; }
        .gen-load-time b { color: var(--cyan); }

        /* ============ 报告 ============ */
        .rep-head { text-align: center; padding: 22px 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
        .rep-head h2 { font-size: 19px; font-weight: 600; letter-spacing: 1px; }
        .rep-head p { font-size: 12px; color: var(--muted); margin-top: 8px; }

        .rep-score { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin-top: 14px; }
        .rep-score b { font-size: 42px; font-weight: 600; color: var(--cyan); font-variant-numeric: tabular-nums; }
        .rep-score span { font-size: 13px; color: var(--muted); }

        .rep-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 2px;
            border-bottom: 1px dashed rgba(77, 216, 255, .12);
            font-size: 12.5px;
        }

        .rep-row .rn { flex: 0 0 26px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .rep-row .rt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rep-row .rs { color: var(--cyan); font-variant-numeric: tabular-nums; }

        /* ============ 提示条 ============ */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 88px;
            transform: translate(-50%, 14px);
            background: rgba(8, 26, 40, .97);
            border: 1px solid var(--line2);
            border-radius: 9px;
            padding: 11px 20px;
            font-size: 13px;
            color: var(--text);
            opacity: 0;
            pointer-events: none;
            transition: all .25s;
            z-index: 99;
            max-width: 80vw;
            text-align: center;
        }

        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast.err { border-color: rgba(255, 107, 107, .5); color: #ffc9c9; }
        .toast.ok { border-color: rgba(74, 222, 128, .5); color: #c6f8d8; }

        @media (max-width: 980px) {
            .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .side { flex-direction: row; align-items: center; border-right: none; border-bottom: 1px solid var(--line); overflow-x: auto; }
            .brand, .stat-row, .side-foot { border: none; padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
            .brand h1 span { display: none; }
            .brand h1 { font-size: 14px; }
            .task-list { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; }
            .titem { margin-bottom: 0; white-space: nowrap; flex: 0 0 auto; }
            .tinfo i { display: none; }
            .site-wrap { grid-template-columns: 1fr; }
            .form-grid, .opt-grid { grid-template-columns: 1fr; }
            .body { padding: 16px; }
            .top, .foot { padding: 12px 16px; }
            .top-title .tt-main { max-width: 40vw; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="side">
        <div class="brand">
            <a href="/" target="_top">&#8592; 返回首页</a>
            <h1>AI 自定义剧情<span>AI SCENARIO CREATOR</span></h1>
        </div>
        <div class="stat-row">
            <div class="stat"><b id="statDone">0/0</b><span>任务完成</span></div>
            <div class="stat"><b id="statScore">0</b><span>实训得分</span></div>
        </div>
        <div class="task-list" id="taskList"></div>
        <div class="side-foot">
            <button class="btn sm" style="width:100%" onclick="showGenPanel()">✨ AI 生成新剧情</button>
            <button class="btn ghost sm" style="width:100%;margin-top:8px" onclick="resetAll()">重新开始实训</button>
        </div>
    </aside>

    <main class="main">
        <div class="top">
            <div class="top-title">
                <div>
                    <span class="tt-main" id="topTitle">加载中…</span>

/* ---------------- 状态与持久化 ---------------- */
let steps = [];
let S = null;          // { step, done:[], score:[] }
let topic = '';
let aiGenerated = false;

function normalizeSteps(arr) {
    arr.forEach(s => {
        if (s.type === 'quiz') {
            if (!Array.isArray(s.subSteps)) s.subSteps = [];
            s.heatmap = false;             // 通用引擎不做专属测试图可视化
            if (typeof s._qidx !== 'number') s._qidx = 0;
            if (!s._qlock) s._qlock = {};
            if (!s._scored) s._scored = {};
        }
        if (s.type === 'survey') {
            if (!Array.isArray(s.tabs) || !s.tabs.length) s.tabs = ['现场记录'];
            if (!Array.isArray(s.plan) || s.plan.length !== s.tabs.length) s.plan = s.tabs.map(() => []);
            (s.fields || []).forEach(f => {
                if (typeof f._val !== 'string') f._val = '';
                if (f._measured !== true) f._measured = false;
            });
        }
        if (s.type === 'siteselect') {
            (s.spots || []).forEach(sp => {
                if (typeof sp.x !== 'number') sp.x = 50;
                if (typeof sp.y !== 'number') sp.y = 50;
            });
        }
    });
    return arr;
}

function initState(n) { return { step: 0, done: new Array(n).fill(false), score: new Array(n).fill(0) }; }

function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ topic, aiGenerated, steps, S })); } catch (e) {}
}

function restore() {
    try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return false;
        const o = JSON.parse(raw);
        if (o && Array.isArray(o.steps) && o.steps.length) {
            topic = o.topic || '';
            aiGenerated = !!o.aiGenerated;
            steps = o.steps;
            S = o.S;
            if (!S || !Array.isArray(S.done) || S.done.length !== steps.length) S = initState(steps.length);
            return true;
        }
    } catch (e) {}
    return false;
}

function resetState(keepSteps) {
    if (!keepSteps) {
        topic = '';
        aiGenerated = false;
        steps = normalizeSteps(defaultSteps());
    }
    steps.forEach(s => {
        if (s.type === 'quiz') { s._qidx = 0; s._qlock = {}; s._scored = {}; }
        if (s.type === 'survey') (s.fields || []).forEach(f => { f._val = ''; f._measured = false; });
    });
    S = initState(steps.length);
    persist();
}

/* ---------------- 通用工具 ---------------- */
function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = 'toast'; }, 2400);
}

function unlocked(i) { return i === 0 || S.done[i - 1]; }
function allDone() { return S.done.length > 0 && S.done.every(Boolean); }

function calcTaskMax(step) {
    switch (step.type) {
        case 'quiz': return (step.subSteps || []).length;
        case 'siteselect': return 2;
        case 'survey': return (step.fields || []).filter(f => f.measure).length;
        case 'design': return (step.groups || []).length;
        default: return 0;
    }
}

function addScore(n) {
    if (!n) return;
    S.score[S.step] += n;
    document.getElementById('statScore').textContent = S.score.reduce((a, b) => a + b, 0);
    persist();
}

function go(i) {
    if (i < 0 || i >= steps.length) return;
    if (!unlocked(i)) { toast('请先完成上一个任务', 'err'); return; }
    S.step = i;
    persist();
    render();
    document.getElementById('body').scrollTop = 0;
}

function prevStep() { go(S.step - 1); }

function resetAll() {
    if (!confirm('确定要清空本剧本的实训记录并重新开始吗？（剧本内容保留）')) return;
    resetState(true);
    render();
    toast('已重置实训进度', 'ok');
}

/* ---------------- 成绩回传（接入能力画像） ---------------- */
const DIM_BY_TYPE = { quiz: 'troubleshooting', survey: 'equipment_operation',
                      siteselect: 'innovation', design: 'innovation', choice: 'teamwork' };
function submitScenarioResult() {
    if (S._reported) return;
    S._reported = true;
    persist();
    try {
        const details = steps.map((st, i) => {
            const mx = calcTaskMax(st);
            return { t: st.title || (TYPE_META[st.type] || {}).tag || st.type,
                     dim: DIM_BY_TYPE[st.type] || '', got: S.score[i] || 0, max: mx };
        }).filter(d => d.dim && d.max > 0);
        fetch('/api/scenario-result', { method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scene_id: 'ai_custom',
                scene_name: ((topic || 'AI 自定义剧情') + '（AI剧本）').slice(0, 60),
                score: S.score.reduce((a, b) => a + b, 0),
                score_max: steps.reduce((a, st) => a + calcTaskMax(st), 0), details }) }).catch(() => {});
    } catch (e) {}
}

/* ---------------- 渲染骨架 ---------------- */
function render() {
    renderList();
    renderBar();
    const body = document.getElementById('body');
    if (allDone()) {
        body.innerHTML = reportHtml();
        renderFoot();
        submitScenarioResult();
        return;
    }
    const step = steps[S.step];
    body.innerHTML = taskCardHtml(step);
    bindTask(step, body);
    renderFoot();
}

function renderList() {
    const box = document.getElementById('taskList');
    box.innerHTML = steps.map((st, i) => {
        const cls = ['titem'];
        if (i === S.step && !allDone()) cls.push('active');
        if (S.done[i]) cls.push('done');
        if (!unlocked(i)) cls.push('locked');
        const num = S.done[i] ? '&#10003;' : (i + 1);
        return `<div class="${cls.join(' ')}" onclick="go(${i})">
            <div class="tnum">${num}</div>
            <div class="tinfo"><b>${esc(st.title || TYPE_META[st.type].tag)}</b><i>${TYPE_META[st.type].tag}</i></div>
        </div>`;
    }).join('');
    document.getElementById('statDone').textContent = S.done.filter(Boolean).length + '/' + steps.length;
    document.getElementById('statScore').textContent = S.score.reduce((a, b) => a + b, 0);
}

function renderBar() {
    const doneCount = S.done.filter(Boolean).length;
    document.getElementById('barFill').style.width = Math.round(doneCount / steps.length * 100) + '%';
    document.getElementById('topTitle').textContent = topic || 'AI 自定义剧情';
    document.getElementById('aiBadge').style.display = aiGenerated ? '' : 'none';
    document.getElementById('topSub').textContent =
        allDone() ? '实训已完成，查看实训报告' : '第 ' + (S.step + 1) + ' / ' + steps.length + ' 项任务 · ' + TYPE_META[steps[S.step].type].tag;
}

function footBtnText(step) {
    switch (step.type) {
        case 'text': return step.nextText || '下一步';
        case 'quiz': {
            const last = step._qidx >= step.subSteps.length - 1;
            if (!step._qlock[step._qidx]) return step.subSteps[step._qidx].multi ? '提交本题' : '请先作答';
            return last ? '完成任务' : '下一题';
        }
        case 'design': return (step._designDone ? '完成任务' : '提交方案');
        case 'survey': return '提交勘察表';
        case 'siteselect': return '完成任务';
        case 'choice': return '提交选择';
        default: return '下一步';
    }
}

function renderFoot() {
    const tip = document.getElementById('footTip');
    const next = document.getElementById('btnNext');
    const prev = document.getElementById('btnPrev');
    if (allDone()) {
        next.disabled = true;
        next.textContent = '已完成';
        prev.disabled = false;
        tip.className = 'foot-tip';
        tip.textContent = '🎉 全部任务完成，实训报告已生成';
        return;
    }
    const step = steps[S.step];
    next.disabled = false;
    next.textContent = footBtnText(step);
    prev.disabled = S.step === 0;
    tip.className = 'foot-tip';
    const tips = {
        text: '阅读背景资料后继续',
        choice: '选择后提交，答错不扣分但会揭示解析',
        quiz: '每小题首次作答计分，答错也会揭示正确答案',
        siteselect: '点击候选位置查看分析，确认后计 2 分',
        survey: '🔍 字段可点击「测量」自动采集，每项 1 分',
        design: '全部决策完成后提交，每组 1 分'
    };
    tip.textContent = tips[step.type] || '';
}

function reportHtml() {
    const total = S.score.reduce((a, b) => a + b, 0);
    const max = steps.reduce((a, st) => a + calcTaskMax(st), 0);
    const rows = steps.map((st, i) => {
        const m = calcTaskMax(st);
        return `<div class="rep-row">
            <span class="rn">${i + 1}.</span>
            <span class="rt">${esc(st.title || TYPE_META[st.type].tag)}<span class="muted small">（${TYPE_META[st.type].tag}）</span></span>
            <span class="rs">${m ? S.score[i] + ' / ' + m + ' 分' : '不计分'}</span>
        </div>`;
    }).join('');
    return `<div class="card">
        <div class="rep-head">
            <h2>✨ ${esc(topic) || 'AI 自定义剧情'} · 实训报告</h2>
            <p>共 ${steps.length} 项任务${aiGenerated ? ' · 剧本由 AI 生成' : ''}</p>
            <div class="rep-score"><b>${total}</b><span>/ ${max} 分</span></div>
        </div>
        ${rows}
        <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap">
            <button class="btn" onclick="resetAll()">🔄 重新演练本剧本</button>
            <button class="btn primary" onclick="showGenPanel()">✨ AI 生成新剧情</button>
        </div>
    </div>`;
}

/* ---------------- 各题型渲染 ---------------- */
function taskCardHtml(step) {
    const tag = `<span class="step-tag">${TYPE_META[step.type].tag}</span>`;
    switch (step.type) {
        case 'text':
            return `<div class="card">${tag}<div class="task-desc">${step.content || ''}</div></div>`;
        case 'choice':
            return `<div class="card">${tag}
                <div class="opt-intro">${step.intro || ''}</div>
                <div class="opt-grid" id="optGrid">${(step.options || []).map((o, i) => optCardHtml(o, i, false)).join('')}</div>
                <div class="feedback-bar" id="optFb"></div>
            </div>`;
        case 'quiz': {
            const sub = step.subSteps[step._qidx] || { q: '', options: [] };
            return `<div class="card">${tag}
                <div class="quiz-no">研判题 ${step._qidx + 1} / ${step.subSteps.length}${sub.multi ? ' · 可多选' : ''}</div>
                <div class="opt-intro">${sub.q || ''}${sub.multi ? '<span style="color:#ffd66b;font-size:12px">（多选题，选完点「提交本题」）</span>' : ''}</div>
                <div class="opt-grid" id="optGrid">${(sub.options || []).map((o, i) => optCardHtml(o, i, !!sub.multi)).join('')}</div>
                <div class="feedback-bar" id="optFb"></div>
            </div>`;
        }
        case 'siteselect':
            return `<div class="card">${tag}
                <div class="opt-intro">${step.intro || ''}</div>
                <div class="site-wrap">
                    <div class="map-wrap">${cityMapSvg()}<div id="pinLayer"></div></div>
                    <div class="site-side">
                        <div class="side-label">候选位置（点击查看分析）</div>
                        <div class="spot-grid" id="spotGrid">${(step.spots || []).map((s, i) => `<button class="spot-btn" data-idx="${i}">${esc(s.name)}</button>`).join('')}</div>
                        <button class="spot-btn confirm" id="btnConfirmSite" style="display:none">✅ 确认选址（+2 分）</button>
                        <div class="feedback-bar" id="optFb"></div>
                    </div>
                </div>
            </div>`;
        case 'survey': {
            const tab = typeof step._tab === 'number' ? step._tab : (step._tab = 0);
            return `<div class="card">${tag}
                <div class="survey-head">
                    <div class="opt-intro" style="margin-bottom:0">${step.intro || ''}</div>
                    <button class="btn ghost sm" onclick="showPlan()">📋 工程规划</button>
                </div>
                <div class="survey-tabs">${step.tabs.map((t, i) => `<div class="survey-tab ${i === tab ? 'active' : ''}" data-tab="${i}">${i + 1} · ${esc(t)}</div>`).join('')}</div>
                <div class="form-grid" id="surveyForm"></div>
            </div>`;
        }
        case 'design':
            return `<div class="card">${tag}
                <div class="opt-intro">${step.intro || ''}</div>
                ${(step.groups || []).map((g, gi) => `
                    <div class="quiz-no">${gi + 1}. ${esc(g.q)}</div>
                    <div class="opt-grid design-g" data-g="${gi}" style="margin-bottom:14px">${(g.options || []).map((o, oi) => optCardHtml(typeof o === 'string' ? { name: o } : o, oi, false)).join('')}</div>
                `).join('')}
                <div class="design-result" id="designResult"></div>
            </div>`;
        default:
            return `<div class="card"><div class="task-desc">未知任务类型</div></div>`;
    }
}

function optCardHtml(o, i, multi) {
    return `<div class="opt-card ${multi ? 'multi' : ''}" data-idx="${i}">
        <div class="opt-name">${o.name}</div>
        ${o.sub ? `<div class="opt-sub">${o.sub}</div>` : ''}

/* ---- 事件绑定 ---- */
let choiceSel = -1;
let siteSel = -1;
let siteConfirmed = false;
let designSel = [];

function bindTask(step, body) {
    choiceSel = -1; siteSel = -1; siteConfirmed = false; designSel = [];
    switch (step.type) {
        case 'choice': {
            body.querySelectorAll('#optGrid .opt-card').forEach(card => {
                card.addEventListener('click', () => {
                    body.querySelectorAll('#optGrid .opt-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    choiceSel = parseInt(card.dataset.idx);
                    const o = step.options[choiceSel];
                    const fb = body.querySelector('#optFb');
                    fb.className = 'feedback-bar show ' + (o.good ? 'good' : 'bad');
                    fb.innerHTML = o.feedback || '';
                });
            });
            break;
        }
        case 'quiz': {
            const sub = step.subSteps[step._qidx];
            const grid = body.querySelector('#optGrid');
            grid.querySelectorAll('.opt-card').forEach(card => {
                card.addEventListener('click', () => {
                    if (step._qlock[step._qidx]) return;
                    const idx = parseInt(card.dataset.idx);
                    if (sub.multi) {
                        card.classList.toggle('selected');
                        quizSel = quizSel.includes(idx) ? quizSel.filter(x => x !== idx) : quizSel.concat(idx);
                    } else {
                        quizSel = [idx];
                        grid.querySelectorAll('.opt-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        revealQuiz(step, sub, body);
                    }
                });
            });
            if (step._qlock[step._qidx]) revealQuiz(step, sub, body);   // 恢复已判定小题
            break;
        }
        case 'siteselect': {
            const pinLayer = body.querySelector('#pinLayer');
            const fb = body.querySelector('#optFb');
            const confirmBtn = body.querySelector('#btnConfirmSite');
            body.querySelectorAll('#spotGrid .spot-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    siteSel = idx;
                    body.querySelectorAll('#spotGrid .spot-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const s = step.spots[idx];
                    pinLayer.innerHTML = `<div class="map-pin" style="left:${s.x}%;top:${s.y}%">📍</div>`;
                    fb.className = 'feedback-bar show ' + (s.ok ? 'good' : 'bad');
                    fb.innerHTML = s.feedback || '';
                    confirmBtn.style.display = s.ok ? '' : 'none';
                });
            });
            confirmBtn.addEventListener('click', () => {
                if (siteConfirmed) return;
                siteConfirmed = true;
                confirmBtn.classList.add('ok-done');
                confirmBtn.textContent = '✅ 已确认选址';
                const s = step.spots[siteSel];
                if (s.ok && !step._siteScored) { addScore(2); step._siteScored = true; }
                fb.innerHTML += `<div style="margin-top:6px;color:#5eff9b">已确认！点击「完成任务」继续。</div>`;
            });
            break;
        }
        case 'survey': {
            renderSurveyTab(step, body);
            body.querySelectorAll('.survey-tab').forEach(t => {
                t.addEventListener('click', () => {
                    collectSurveyVals(body, step);
                    step._tab = parseInt(t.dataset.tab);
                    body.querySelectorAll('.survey-tab').forEach(x => x.classList.remove('active'));
                    t.classList.add('active');
                    renderSurveyTab(step, body);
                });
            });
            break;
        }
        case 'design': {
            designSel = new Array((step.groups || []).length).fill(-1);
            if (step._designSel) designSel = step._designSel.slice();
            body.querySelectorAll('.design-g').forEach(grid => {
                const gi = parseInt(grid.dataset.g);
                grid.querySelectorAll('.opt-card').forEach(card => {
                    card.addEventListener('click', () => {
                        if (step._designDone) return;
                        grid.querySelectorAll('.opt-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        designSel[gi] = parseInt(card.dataset.idx);
                        step._designSel = designSel.slice();
                    });
                });
                // 恢复已选
                if (designSel[gi] >= 0) grid.querySelectorAll('.opt-card')[designSel[gi]].classList.add('selected');
            });
            if (step._designDone) revealDesign(step, body, true);
            break;
        }
    }
}

let quizSel = [];

function quizRequired(sub) {
    if (sub.multi) return Array.isArray(sub.required) ? sub.required : [sub.required];
    return [sub.correct];
}

function revealQuiz(step, sub, body) {
    const req = quizRequired(sub);
    const ok = sub.multi
        ? (quizSel.length === req.length && req.every(i => quizSel.includes(i)))
        : quizSel[0] === sub.correct;
    const grid = body.querySelector('#optGrid');
    grid.classList.add('revealed');
    grid.querySelectorAll('.opt-card').forEach(c => {
        const i = parseInt(c.dataset.idx);
        if (req.includes(i)) c.classList.add('right');
        else if (quizSel.includes(i)) c.classList.add('wrong');
    });
    const fb = body.querySelector('#optFb');
    fb.className = 'feedback-bar show ' + (ok ? 'good' : 'bad');
    fb.innerHTML = ok
        ? (sub.multi ? '✓ <b>全部选对</b>，点击按钮继续' : '✓ <b>回答正确</b>，点击按钮继续')
        : (sub.multi ? '✗ <b>选择不全或选入了无关项</b>，正确项已标绿，请阅读解析后继续'
                     : '✗ <b>回答不正确</b>，正确答案已标绿，请阅读解析后继续');
    if (!step._scored[step._qidx]) { if (ok) addScore(1); step._scored[step._qidx] = true; }
    step._qlock[step._qidx] = true;
    document.getElementById('btnNext').textContent = footBtnText(step);
    persist();
}

/* ---- 勘察表 ---- */
function renderSurveyTab(step, body) {
    const tab = typeof step._tab === 'number' ? step._tab : 0;
    const grid = body.querySelector('#surveyForm');
    if (!grid) return;
    grid.innerHTML = (step.fields || []).filter(f => (f.tab || 0) === tab).map(f => {
        const val = f._val || '';
        if (f.type === 'select') {
            return `<div class="form-item"><label>${esc(f.key)}</label><select data-key="${esc(f.key)}">${(f.opts || []).map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
        }
        const mBtn = f.measure ? `<button class="btn sm" data-key="${esc(f.key)}">🔍 测量</button>` : '';
        return `<div class="form-item"><label>${esc(f.key)}${f.measure ? ' 🔍' : ''}</label><div class="form-row"><input data-key="${esc(f.key)}" placeholder="${esc(f.ph || '')}" value="${esc(val)}">${mBtn}</div></div>`;
    }).join('');
    grid.querySelectorAll('input,select').forEach(el => {
        const handler = () => {
            const f = step.fields.find(x => x.key === el.dataset.key);
            if (f) f._val = el.value;
        };
        el.addEventListener('change', handler);
        el.addEventListener('input', handler);
    });
    grid.querySelectorAll('.form-row .btn').forEach(btn => btn.addEventListener('click', () => doMeasure(step, btn, body)));
}

function collectSurveyVals(body, step) {
    (body.querySelectorAll('#surveyForm input') || []).forEach(inp => {
        const f = (step.fields || []).find(x => x.key === inp.dataset.key);
        if (f) f._val = inp.value;
    });
    (body.querySelectorAll('#surveyForm select') || []).forEach(sel => {
        const f = (step.fields || []).find(x => x.key === sel.dataset.key);
        if (f) f._val = sel.value;
    });
}

function doMeasure(step, btn, body) {
    const f = (step.fields || []).find(x => x.key === btn.dataset.key);
    if (!f || !f.measure) return;
    const pop = document.createElement('div');
    pop.className = 'device-pop';
    pop.innerHTML = `<div class="dev-icon">${f.measure.icon || '📟'}</div><div class="dev-name">${esc(f.measure.name || '测量设备')} · 测量中</div><div class="scan-bar"><i></i></div><div class="dev-val">正在采集数据…</div>`;
    document.body.appendChild(pop);
    btn.disabled = true;
    setTimeout(() => {
        pop.querySelector('.dev-val').textContent = f.measure.value;
        const input = body.querySelector(`#surveyForm input[data-key="${CSS.escape(f.key)}"]`);
        if (input) { input.value = f.measure.value; input.classList.add('filled-auto'); }
        f._val = f.measure.value;
        if (!f._measured) { f._measured = true; addScore(1); }
        setTimeout(() => { pop.remove(); btn.disabled = false; btn.textContent = '✅ 已测'; }, 1000);
    }, 1400);
}

function showPlan() {
    const step = steps[S.step];
    if (!step || step.type !== 'survey') return;
    const modal = document.createElement('div');
    modal.className = 'plan-modal';
    modal.innerHTML = `<div class="plan-card"><h4>📋 工程规划（参考资料）</h4>
        ${(step.plan || []).map((rows, i) => `<div style="color:#4dd8ff;font-size:12px;margin:10px 0 4px">—— ${esc(step.tabs[i] || ('参考' + (i + 1)))} ——</div>` +
            (rows || []).map(r => `<div class="plan-row"><span class="k">${esc(r[0])}</span><span class="v">${r[1]}</span></div>`).join('')).join('')}
        <div class="plan-close"><button class="btn sm" onclick="this.closest('.plan-modal').remove()">关闭</button></div></div>`;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
}

/* ---- 方案设计 ---- */
function revealDesign(step, body, silent) {
    let got = 0;
    const rows = (step.groups || []).map((g, gi) => {
        const pick = o => (typeof o === 'string' ? o : (o && o.name) || '');
        const ok = designSel[gi] === g.correct;
        if (ok) got++;
        return `<div>· <b>${esc(g.q)}</b>：${esc(pick(g.options[designSel[gi]]))} ${ok ? '✅' : '❌（建议：' + esc(pick(g.options[g.correct])) + '）'}</div>`;
    }).join('');
    const res = body.querySelector('#designResult');
    res.innerHTML = rows + `<div style="margin-top:8px;color:#5eff9b">🎯 ${step.result || ''}</div>`;
    res.classList.add('show');
    body.querySelectorAll('.design-g').forEach(g => g.classList.add('revealed'));
    if (!silent && !step._designScored) { addScore(got); step._designScored = true; }
    step._designDone = true;
    document.getElementById('btnNext').textContent = footBtnText(step);
    persist();
}

/* ---------------- 提交 / 完成 ---------------- */
function submitTask() {
    const step = steps[S.step];
    if (!step || allDone()) return;
    const body = document.getElementById('body');
    switch (step.type) {
        case 'text':
            completeTask();
            break;
        case 'choice':
            if (choiceSel < 0) { toast('请先做出选择', 'err'); return; }
            completeTask();
            break;
        case 'quiz': {
            const sub = step.subSteps[step._qidx];
            if (!step._qlock[step._qidx]) {
                if (sub.multi) {
                    if (!quizSel.length) { toast('请先选择后再提交', 'err'); return; }
                    revealQuiz(step, sub, body);
                    return;
                }
                if (quizSel.length !== 1) { toast('请先作答', 'err'); return; }
                revealQuiz(step, sub, body);
                return;
            }
            if (step._qidx < step.subSteps.length - 1) {
                step._qidx++;
                quizSel = [];
                body.innerHTML = taskCardHtml(step);
                bindTask(step, body);
                document.getElementById('btnNext').textContent = footBtnText(step);
                body.scrollTop = 0;
                return;
            }
            completeTask();
            break;
        }
        case 'siteselect':
            if (!siteConfirmed) { toast('请查看选址分析并确认站址', 'err'); return; }
            completeTask();
            break;
        case 'survey': {
            collectSurveyVals(body, step);
            const unfilled = (step.fields || []).filter(f => f.type === 'input' && !(f._val || '').trim()).length;
            if (unfilled > 0 && !confirm(`还有 ${unfilled} 项未填写（可通过「工程规划」参考或点击「测量」获得），确认跳过继续吗？`)) return;
            completeTask();
            break;
        }
        case 'design':
            if (!step._designDone) {
                if (designSel.some(v => v < 0)) { toast(`请完成全部 ${step.groups.length} 项决策选择`, 'err'); return; }
                revealDesign(step, body);
                return;
            }
            completeTask();
            break;
        default:
            completeTask();
    }
}

function completeTask() {
    S.done[S.step] = true;
    persist();
    if (S.step >= steps.length - 1) {
        render();
        toast('🎉 实训全部完成！', 'ok');
    } else {
        go(S.step + 1);
        toast('任务完成，已解锁下一项', 'ok');
    }
}

/* ---------------- AI 生成 ---------------- */
let genTimer = null;

function showGenPanel() {
    document.getElementById('genMask').classList.add('show');
    document.getElementById('genForm').style.display = 'block';
    document.getElementById('genLoading').classList.remove('show');
    document.getElementById('genBtn').disabled = false;
}

function hideGenPanel() { document.getElementById('genMask').classList.remove('show'); }

function startGenLoading() {
    const lines = [
        '正在梳理「接报 → 研判 → 现场 → 处置 → 验收」工程全流程…',
        '正在编写告警研判与诊断推理题目…',
        '正在设计仪表实测数据与判定门限…',
        '正在布置误判陷阱与安全红线考点…',
        '正在生成处置方案、验收标准与复盘总结…'
    ];
    let sec = 0, li = 0;
    document.getElementById('genLoadSub').textContent = lines[0];
    document.getElementById('genLoadSec').textContent = '0';
    stopGenLoading();
    genTimer = setInterval(() => {
        sec++;
        document.getElementById('genLoadSec').textContent = sec;
        if (sec % 8 === 0) { li = (li + 1) % lines.length; document.getElementById('genLoadSub').textContent = lines[li]; }
    }, 1000);
}

function stopGenLoading() { if (genTimer) { clearInterval(genTimer); genTimer = null; } }

function backToGenForm() {
    stopGenLoading();
    document.getElementById('genForm').style.display = 'block';
    document.getElementById('genLoading').classList.remove('show');
    document.getElementById('genBtn').disabled = false;
}

async function generateScenario() {
    const t = document.getElementById('genTopic').value.trim();
    const q = document.getElementById('genQuestion').value.trim();
    if (!t) { toast('请输入场景主题', 'err'); return; }

    document.getElementById('genForm').style.display = 'none';
    document.getElementById('genLoading').classList.add('show');
    document.getElementById('genBtn').disabled = true;
    startGenLoading();

    // 前端 500 秒超时保护（略大于后端 480 秒墙钟）
    const ctrl = new AbortController();
    const timeoutId = setTimeout(() => ctrl.abort(), 500000);
    try {
        const resp = await fetch('/api/scenario/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ topic: t, question: q }),
            signal: ctrl.signal
        });
        clearTimeout(timeoutId);
        const data = await resp.json();
        if (!resp.ok) {
            toast('生成失败：' + (data.error || '未知错误'), 'err');
            backToGenForm();
            return;
        }
        stopGenLoading();
        hideGenPanel();
        topic = t;
        aiGenerated = true;
        steps = normalizeSteps(data.steps || []);
        S = initState(steps.length);
        persist();
        render();
        toast(`✨ AI 剧情已生成：共 ${steps.length} 项任务`, 'ok');
    } catch (e) {
        clearTimeout(timeoutId);
        const aborted = e.name === 'AbortError';
        toast(aborted ? '生成超时（已等待约8分钟），请重试一次' : '请求失败：' + e.message, 'err');
        backToGenForm();
    }
}

document.getElementById('genMask').addEventListener('click', function (ev) {
    if (ev.target === this && !document.getElementById('genLoading').classList.contains('show')) hideGenPanel();
});

/* ---------------- 时钟 ---------------- */
function updateClock() {
    const now = new Date();
    const p = n => String(n).padStart(2, '0');
    document.getElementById('clock').textContent =
        `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
}

/* ---------------- 初始化 ---------------- */
if (!restore()) resetState(false);
render();
updateClock();
setInterval(updateClock, 1000);
</script>
