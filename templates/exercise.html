<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动式练习 - 灵智尚人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .header h1 { color: #333; font-size: 24px; }
        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn.secondary { background: #e0e0e8; color: #333; }
        .btn.success { background: #43e97b; }
        .btn.danger { background: #f5576c; }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .knowledge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .knowledge-card {
            background: #f8f9fc;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .knowledge-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #667eea;
        }
        .knowledge-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .knowledge-meta {
            font-size: 12px;
            color: #666;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            background: #e0e0e8;
            border-radius: 6px;
            font-size: 11px;
            margin-right: 5px;
        }
        .tag.category-理论基础 { background: #4facfe; color: white; }
        .tag.category-调制技术 { background: #f5576c; color: white; }
        .tag.category-工程实践 { background: #43e97b; color: white; }

        .progress-bar {
            height: 8px;
            background: #e0e0e8;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.5s;
        }

        .question-container {
            margin-bottom: 25px;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .question-number {
            font-size: 14px;
            color: #666;
        }
        .question-type {
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 12px;
        }
        .question-type.choice { background: #4facfe; }
        .question-type.fill { background: #ffa94d; }
        .question-type.short { background: #43e97b; }

        .question-text {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
            padding: 0;
        }
        .option-item {
            padding: 15px;
            background: #f8f9fc;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .option-item:hover {
            background: #eef2ff;
            border-color: #667eea;
        }
        .option-item.selected {
            background: #eef2ff;
            border-color: #667eea;
        }
        .option-item.correct {
            background: #d3f9d8;
            border-color: #43e97b;
        }
        .option-item.wrong {
            background: #ffe0e0;
            border-color: #f5576c;
        }

        .fill-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e8;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .fill-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .short-textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e8;
            border-radius: 10px;
            font-size: 16px;
            min-height: 120px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        .short-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .feedback-box {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .feedback-box.show {
            display: block;
        }
        .feedback-box.success {
            background: #d3f9d8;
            border-left: 4px solid #43e97b;
        }
        .feedback-box.error {
            background: #ffe0e0;
            border-left: 4px solid #f5576c;
        }
        .feedback-title {
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feedback-text {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-box {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: #f8f9fc;
            border-radius: 10px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-buttons .btn {
            flex: 1;
            padding: 14px;
            font-size: 16px;
        }

        .hidden {
            display: none;
        }

        /* ===== 移动端适配（新增） ===== */
        @media (max-width: 768px) {
            body { padding: 8px !important; }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 16px 18px;
            }
            .header h1 { font-size: 20px; }
            .header > div { flex-wrap: wrap; }
            .card { padding: 16px; }
            .card-title { flex-wrap: wrap; gap: 8px; font-size: 16px; }
            .knowledge-grid { grid-template-columns: 1fr; }
            .stats-row { flex-wrap: wrap; gap: 10px; }
            .stat-box { flex: 1 1 40%; min-width: 0; padding: 12px; }
            .stat-value { font-size: 22px; }
            .action-buttons { flex-wrap: wrap; }
            .action-buttons .btn { flex: 1 1 auto; padding: 12px; font-size: 15px; }
            .question-header { flex-wrap: wrap; gap: 6px; }
            .question-text { font-size: 15px; }
            .option-item { padding: 12px; }
            .fill-input, .short-textarea { font-size: 15px; }
            .feedback-text { font-size: 13px; }
        }
        @media (max-width: 480px) {
            body { padding: 6px !important; }
            .header h1 { font-size: 18px; }
            .stat-box { flex: 1 1 100%; }
        }
    </style>
    <!-- 全局按钮美化 -->
    <link rel="stylesheet" href="/static/global_buttons.css">
<link rel="stylesheet" href="/static/global_pages.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 互动式练习</h1>
            <div>
                <a href="/" class="btn secondary" style="margin-right: 10px;">← 返回</a>
                <a href="/knowledge-graph-page" class="btn" style="background: #4facfe;">知识图谱</a>
            </div>
        </div>

        <div class="card" id="selectionCard">
            <div class="card-title">🎯 选择练习知识点</div>
            <div id="knowledgeList" class="knowledge-grid"></div>
        </div>

        <div class="card hidden" id="exerciseCard">
            <div class="card-title">
                <span>📚 当前练习：</span>
                <span id="currentKnowledge" style="color: #667eea;"></span>
                <span style="font-size: 11px; color: #5b6cff; background: rgba(91,108,255,0.1); border: 1px solid rgba(91,108,255,0.35); border-radius: 4px; padding: 2px 8px; margin-left: auto;">✨ AI 智能题库生成</span>
            </div>
            
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-value" id="totalQuestions">0</div>
                    <div class="stat-label">总题数</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="currentQuestion">0</div>
                    <div class="stat-label">当前题</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">正确</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="wrongCount">0</div>
                    <div class="stat-label">错误</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div id="questionContainer"></div>

            <div class="action-buttons">
                <button class="btn secondary" onclick="resetExercise()">重新开始</button>
                <button class="btn" onclick="nextQuestion()" id="nextBtn" disabled>下一题</button>
            </div>
        </div>

        <div class="card hidden" id="resultCard">
            <div class="card-title">🎉 练习完成！</div>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-value" id="finalCorrect">0</div>
                    <div class="stat-label">正确数</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="finalWrong">0</div>
                    <div class="stat-label">错误数</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="finalRate">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="finalGrade"></div>
                    <div class="stat-label">评级</div>
                </div>
            </div>
            <div class="action-buttons">
                <button class="btn" onclick="backToSelection()">选择其他知识点</button>
                <button class="btn success" onclick="resetExercise()">再来一次</button>
            </div>
        </div>
    </div>

    <script>
        let exercises = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let selectedKnowledge = '';

        async function loadKnowledgePoints() {
            try {
                const response = await fetch('/api/exercises/knowledge-points');
                const data = await response.json();
                if (data.success) {
                    const list = document.getElementById('knowledgeList');
                    list.innerHTML = data.knowledge_points.map(kp => `
                        <div class="knowledge-card" onclick="startExercise('${kp.name}')">
                            <div class="knowledge-name">${kp.name}</div>
                            <div class="knowledge-meta">
                                <span class="tag category-${kp.category}">${kp.category}</span>
                                <span class="tag">难度: ${'★'.repeat(kp.difficulty)}${'☆'.repeat(5 - kp.difficulty)}</span>
                            </div>
                            <div class="knowledge-meta" style="margin-top: 8px;">
                                📝 ${kp.exercise_count} 道练习题
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('加载知识点失败:', error);
            }
        }

        async function startExercise(knowledgePoint) {
            selectedKnowledge = knowledgePoint;
            document.getElementById('selectionCard').classList.add('hidden');
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('exerciseCard').classList.remove('hidden');
            
            document.getElementById('currentKnowledge').textContent = knowledgePoint;
            
            try {
                const response = await fetch('/api/exercises/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ knowledge_point: knowledgePoint, count: 5 })
                });
                const data = await response.json();
                
                if (data.success) {
                    exercises = data.exercises;
                    currentIndex = 0;
                    correctCount = 0;
                    wrongCount = 0;
                    updateStats();
                    renderQuestion();
                } else {
                    alert(data.error);
                    backToSelection();
                }
            } catch (error) {
                console.error('生成练习题失败:', error);
                alert('生成练习题失败，请重试');
            }
        }

        function renderQuestion() {
            const container = document.getElementById('questionContainer');
            const exercise = exercises[currentIndex];
            
            document.getElementById('nextBtn').disabled = true;
            
            let optionsHtml = '';
            let inputHtml = '';
            
            if (exercise.type === 'choice') {
                optionsHtml = `
                    <ul class="options-list">
                        ${exercise.options.map((opt, idx) => `
                            <li class="option-item" onclick="selectOption(this, '${opt.charAt(0)}')">
                                ${opt}
                            </li>
                        `).join('')}
                    </ul>
                `;
            } else if (exercise.type === 'fill') {
                inputHtml = `
                    <input type="text" class="fill-input" id="answerInput" placeholder="请输入答案..." onkeydown="handleEnter(event)">
                `;
            } else {
                inputHtml = `
                    <textarea class="short-textarea" id="answerInput" placeholder="请输入答案..."></textarea>
                `;
            }

            container.innerHTML = `
                <div class="question-container">
                    <div class="question-header">
                        <span class="question-number">第 ${currentIndex + 1}/${exercises.length} 题</span>
                        <span class="question-type ${exercise.type}">${getTypeName(exercise.type)}</span>
                    </div>
                    <div class="question-text">${exercise.question}</div>
                    ${optionsHtml}
                    ${inputHtml}
                    <button class="btn" style="margin-top: 15px;" onclick="submitAnswer()">提交答案</button>
                    <div class="feedback-box" id="feedbackBox"></div>
                </div>
            `;
        }

        function getTypeName(type) {
            const types = { 'choice': '选择题', 'fill': '填空题', 'short': '简答题' };
            return types[type] || type;
        }

        function selectOption(element, option) {
            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            
            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.classList.remove('show', 'success', 'error');
        }

        function handleEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                submitAnswer();
            }
        }

        async function submitAnswer() {
            const exercise = exercises[currentIndex];
            let studentAnswer = '';
            
            if (exercise.type === 'choice') {
                const selected = document.querySelector('.option-item.selected');
                if (!selected) {
                    alert('请选择一个选项');
                    return;
                }
                studentAnswer = selected.textContent.trim().charAt(0);
            } else {
                studentAnswer = document.getElementById('answerInput').value.trim();
                if (!studentAnswer) {
                    alert('请输入答案');
                    return;
                }
            }

            try {
                const response = await fetch('/api/exercises/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question_id: exercise.id, student_answer: studentAnswer })
                });
                const data = await response.json();
                
                if (data.success) {
                    showFeedback(data);
                    updateStats(data.is_correct);
                    document.getElementById('nextBtn').disabled = false;
                }
            } catch (error) {
                console.error('提交答案失败:', error);
            }
        }

        function showFeedback(data) {
            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.classList.add('show');
            
            if (data.is_correct) {
                feedbackBox.classList.remove('error');
                feedbackBox.classList.add('success');
                feedbackBox.innerHTML = `
                    <div class="feedback-title">✅ 回答正确！</div>
                    <div class="feedback-text">${data.analysis}</div>
                `;
                
                if (exercises[currentIndex].type === 'choice') {
                    document.querySelectorAll('.option-item').forEach(el => {
                        if (el.textContent.charAt(0) === data.correct_answer) {
                            el.classList.add('correct');
                        }
                    });
                }
            } else {
                feedbackBox.classList.remove('success');
                feedbackBox.classList.add('error');
                feedbackBox.innerHTML = `
                    <div class="feedback-title">❌ 回答错误</div>
                    <div class="feedback-text"><strong>正确答案：</strong>${data.correct_answer}</div>
                    <div class="feedback-text" style="margin-top: 10px;"><strong>解析：</strong>${data.analysis}</div>
                    <div style="margin-top:10px;display:inline-block;background:rgba(255,87,87,0.15);color:#ff5757;border:1px solid rgba(255,87,87,0.3);padding:4px 12px;border-radius:12px;font-size:12px;">📕 已自动记录到错题本</div>
                `;
                
                if (exercises[currentIndex].type === 'choice') {
                    document.querySelectorAll('.option-item').forEach(el => {
                        const opt = el.textContent.charAt(0);
                        if (opt === data.correct_answer) {
                            el.classList.add('correct');
                        } else if (el.classList.contains('selected')) {
                            el.classList.add('wrong');
                        }
                    });
                }
            }
        }

        function updateStats(isCorrect) {
            if (isCorrect !== undefined) {
                if (isCorrect) correctCount++;
                else wrongCount++;
            }
            
            document.getElementById('totalQuestions').textContent = exercises.length;
            document.getElementById('currentQuestion').textContent = currentIndex + 1;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            
            const progress = ((currentIndex + 1) / exercises.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
        }

        function nextQuestion() {
            if (currentIndex < exercises.length - 1) {
                currentIndex++;
                updateStats();
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('exerciseCard').classList.add('hidden');
            document.getElementById('resultCard').classList.remove('hidden');
            
            const total = exercises.length;
            const rate = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalWrong').textContent = wrongCount;
            document.getElementById('finalRate').textContent = `${rate}%`;
            
            let grade = '继续努力';
            let color = '#f5576c';
            if (rate >= 90) { grade = '优秀！'; color = '#43e97b'; }
            else if (rate >= 70) { grade = '良好'; color = '#4facfe'; }
            else if (rate >= 60) { grade = '及格'; color = '#ffa94d'; }
            
            const gradeEl = document.getElementById('finalGrade');
            gradeEl.textContent = grade;
            gradeEl.style.color = color;
        }

        function resetExercise() {
            if (selectedKnowledge) {
                startExercise(selectedKnowledge);
            }
        }

        function backToSelection() {
            document.getElementById('exerciseCard').classList.add('hidden');
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('selectionCard').classList.remove('hidden');
            selectedKnowledge = '';
        }

        loadKnowledgePoints();
    </script>

    <!-- 全局桌宠 Desktop Pet -->
    <link rel="stylesheet" href="/static/desktop_pet.css">
    <script src="/static/desktop_pet.js" defer></script>
</body>
</html>
