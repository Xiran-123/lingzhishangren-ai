<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧情演绎 - 灵智尚人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: #0a1a2e;
        }

        /* ============ 主舞台容器 ============ */
        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ============ 场景背景层 ============ */
        /* ============ 场景背景（实景感） ============ */
        .scene-bg {
            position: absolute;
            inset: 0;
            transition: opacity 1s ease, background 1s ease;
            z-index: 0;
        }

        /* 场景0：校园鸟瞰 - 晴朗蓝天 */
        .scene-bg[data-step="0"] {
            background:
                radial-gradient(ellipse at 50% 15%, #87CEEB 0%, rgba(135,206,235,0) 40%),
                radial-gradient(ellipse at 30% 85%, rgba(34,139,34,0.35) 0%, transparent 50%),
                linear-gradient(180deg, #4a90c8 0%, #6ba3d4 35%, #7fa5c8 55%, #5b8a6c 85%, #3d6b4f 100%);
        }
        /* 场景1：校园傍晚 - 夕阳 */
        .scene-bg[data-step="1"] {
            background:
                radial-gradient(ellipse at 70% 20%, #ff9944 0%, rgba(255,153,68,0) 45%),
                radial-gradient(ellipse at 50% 100%, rgba(80,60,100,0.4) 0%, transparent 50%),
                linear-gradient(180deg, #3a3d5e 0%, #6b4a6a 25%, #a56550 45%, #4a5a3a 80%, #2a3a28 100%);
        }
        /* 场景2：野外勘测 - 绿色田野 */
        .scene-bg[data-step="2"] {
            background:
                radial-gradient(ellipse at 50% 20%, rgba(150,200,255,0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(50,120,60,0.5) 0%, transparent 50%),
                linear-gradient(180deg, #7fb5d4 0%, #9bc4d8 30%, #a8cba0 60%, #4a7d3a 85%, #2d5a25 100%);
        }
        /* 场景3：参数查询 - 机房冷色调 */
        .scene-bg[data-step="3"] {
            background:
                radial-gradient(ellipse at 50% 30%, rgba(100,180,220,0.3) 0%, transparent 50%),
                linear-gradient(180deg, #1a2a3a 0%, #2a4a5a 40%, #1a3a4a 70%, #0f2030 100%);
        }
        /* 场景4：基站选址 - 黄金时刻 */
        .scene-bg[data-step="4"] {
            background:
                radial-gradient(ellipse at 80% 25%, #ffb347 0%, rgba(255,179,71,0) 50%),
                radial-gradient(ellipse at 20% 90%, rgba(60,80,100,0.4) 0%, transparent 50%),
                linear-gradient(180deg, #5a4a3a 0%, #8a6a4a 30%, #6a5a4a 55%, #3a4a3a 85%, #2a3a28 100%);
        }
        /* 场景5：勘察表填写 - 办公室内 */
        .scene-bg[data-step="5"] {
            background:
                radial-gradient(ellipse at 50% 30%, rgba(255,200,120,0.25) 0%, transparent 50%),
                linear-gradient(180deg, #2a2420 0%, #3a3028 50%, #2a2420 100%);
        }
        /* 场景6：基站设计 - 会议室 */
        .scene-bg[data-step="6"] {
            background:
                radial-gradient(ellipse at 50% 20%, rgba(255,180,100,0.2) 0%, transparent 50%),
                linear-gradient(180deg, #1a1820 0%, #2a2830 50%, #1a1820 100%);
        }
        /* 场景7+: 统一深色 */
        .scene-bg[data-step="7"],
        .scene-bg[data-step="8"],
        .scene-bg[data-step="9"] {
            background:
                radial-gradient(ellipse at 50% 30%, rgba(100,150,200,0.25) 0%, transparent 50%),
                linear-gradient(180deg, #0d1f35 0%, #2a4a6a 50%, #0d1f35 100%);
        }

        /* ============ SVG 装饰层 ============ */
        .scene-bg svg.decor {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.6;
        }

        /* ============ 遮罩层 ============ */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,10,30,0.3) 0%, rgba(0,10,30,0.5) 100%);
            z-index: 1;
        }

        /* ============ 顶部导航栏 ============ */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(10, 25, 50, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 200, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 10;
        }

        .top-bar .mode-selector {
            display: flex;
            gap: 8px;
        }
        .top-bar .mode-btn {
            padding: 6px 16px;
            background: rgba(0, 200, 255, 0.15);
            color: #a0e8ff;
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .top-bar .mode-btn:hover {
            background: rgba(0, 200, 255, 0.3);
            color: #fff;
        }
        .top-bar .mode-btn.active {
            background: rgba(0, 200, 255, 0.4);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 200, 255, 0.4);
        }

        .top-bar .title {
            color: #fff;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .top-bar .end-btn {
            padding: 8px 20px;
            background: rgba(255, 80, 80, 0.8);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .top-bar .end-btn:hover { background: rgba(255, 50, 50, 1); }

        /* ============ 主标题区 ============ */
        .main-header {
            position: absolute;
            top: 80px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }
        .main-header .deco {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .main-header .deco .line {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff);
        }
        .main-header .deco .line:last-child {
            background: linear-gradient(90deg, #00e5ff, transparent);
        }
        .main-header h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.5);
        }
        .main-header .clock {
            margin-top: 8px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-family: 'Consolas', monospace;
        }
        .main-header .clock span { color: #00e5ff; }

        /* ============ 右侧步骤指示器 ============ */
        .step-indicator {
            position: absolute;
            right: 32px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
        }
        .step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .step-item .label {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            text-align: right;
            min-width: 90px;
            transition: all 0.3s;
        }
        .step-item .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }
        .step-item.completed .dot {
            background: rgba(0, 200, 255, 0.3);
            border-color: rgba(0, 200, 255, 0.6);
            color: #a0e8ff;
        }
        .step-item.completed .label { color: rgba(0, 200, 255, 0.8); }
        .step-item.active .dot {
            background: linear-gradient(135deg, #00c8ff, #0077ff);
            border-color: #00e5ff;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.6), 0 0 40px rgba(0, 200, 255, 0.3);
            transform: scale(1.15);
        }
        .step-item.active .dot::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.4);
            animation: pulse 2s infinite;
        }
        .step-item.active .label {
            color: #fff;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0; }
        }

        /* 步骤连接线 */
        .step-connector {
            position: absolute;
            right: 47px;
            width: 2px;
            height: 16px;
            background: rgba(255,255,255,0.1);
        }
        .step-connector.active {
            background: linear-gradient(180deg, rgba(0, 200, 255, 0.6), rgba(255,255,255,0.1));
        }

        /* ============ 剧情对话面板 ============ */
        .dialog-panel {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            width: min(680px, 70vw);
            z-index: 15;
            animation: fadeInUp 0.8s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%, -30px); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        .dialog-box {
            background: linear-gradient(135deg, rgba(10, 35, 65, 0.85) 0%, rgba(15, 25, 55, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-radius: 16px;
            padding: 40px 44px 32px;
            box-shadow: 0 8px 40px rgba(0, 100, 200, 0.3),
                        inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
        }
        .dialog-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20px;
            right: 20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff, transparent);
        }
        /* 角装饰 */
        .dialog-box .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: rgba(0, 229, 255, 0.6);
            border-style: solid;
        }
        .dialog-box .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .dialog-box .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        .dialog-box .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
        .dialog-box .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

        .dialog-title {
            text-align: center;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.4);
        }

        .dialog-content {
            color: rgba(255,255,255,0.85);
            font-size: 15px;
            line-height: 1.9;
            margin-bottom: 28px;
            text-align: justify;
        }

        .dialog-actions {
            text-align: center;
        }
        .btn-next {
            padding: 12px 48px;
            background: linear-gradient(135deg, #0080ff 0%, #00c8ff 100%);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 150, 255, 0.4);
        }
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 150, 255, 0.6);
        }
        .btn-next:active { transform: translateY(0); }

        .btn-skip {
            margin-left: 12px;
            padding: 12px 28px;
            background: transparent;
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-skip:hover {
            color: rgba(255,255,255,0.8);
            border-color: rgba(255,255,255,0.4);
        }

        /* ============ 进度条 ============ */
        .progress-bar {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        .progress-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transition: all 0.3s;
        }
        .progress-bar .dot.active {
            background: #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
            width: 24px;
            border-radius: 4px;
        }
        .progress-bar .dot.completed {
            background: rgba(0, 229, 255, 0.5);
        }

        /* ============ 场景切换过渡 ============ */
        .scene-bg.fade-out { opacity: 0; }

        /* ============ 结束画面 ============ */
        .end-screen {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(0, 10, 30, 0.9);
            backdrop-filter: blur(10px);
        }
        .end-screen.show { display: flex; }
        .end-card {
            background: linear-gradient(135deg, rgba(0, 50, 100, 0.9), rgba(0, 20, 60, 0.95));
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 20px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.3);
        }
        .end-card h2 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 12px;
            letter-spacing: 4px;
        }
        .end-card p {
            color: rgba(255,255,255,0.7);
            font-size: 15px;
            margin-bottom: 28px;
        }
        .end-card .btn-back {
            padding: 12px 36px;
            background: linear-gradient(135deg, #0080ff, #00c8ff);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            cursor: pointer;
            margin: 6px;
        }
        .end-card .btn-secondary {
            padding: 12px 36px;
            background: transparent;
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            font-size: 14px;
            cursor: pointer;
            margin: 6px;
        }
        /* ================= 交互实训组件 ================= */
        .dialog-panel.wide { width: min(940px, 92vw); }

        .dialog-content {
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .dialog-content::-webkit-scrollbar { width: 5px; }
        .dialog-content::-webkit-scrollbar-thumb { background: rgba(0, 190, 255, 0.35); border-radius: 3px; }

        .score-badge {
            background: rgba(0, 190, 255, 0.08);
            border: 1px solid rgba(0, 200, 255, 0.35);
            border-radius: 12px;
            padding: 14px 30px;
            margin: 6px auto 12px;
            display: inline-block;
        }
        .score-num { font-size: 34px; font-weight: 800; color: #4dd8ff; font-family: Consolas, monospace; }
        .score-num span { font-size: 16px; color: rgba(190, 220, 255, 0.6); }
        .score-stars { font-size: 20px; margin: 4px 0; }
        .score-cmt { color: #ffd66b; font-size: 14px; margin-top: 2px; }

        .opt-intro {
            color: rgba(190, 220, 255, 0.85);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .opt-intro b { color: #4dd8ff; }
        .opt-step-label {
            border-left: 3px solid #4dd8ff;
            padding-left: 8px;
            color: #4dd8ff;
            font-size: 15px;
            font-weight: 700;
            margin: 6px 0 12px;
        }
        .opt-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 14px;
        }
        .opt-card {
            background: rgba(20, 60, 120, 0.45);
            border: 1px solid rgba(0, 190, 255, 0.35);
            border-radius: 8px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.18s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .opt-card:hover { background: rgba(30, 90, 170, 0.55); border-color: rgba(0, 220, 255, 0.7); transform: translateY(-1px); }
        .opt-card.selected {
            background: linear-gradient(135deg, #1e4fd8, #1a3fb8);
            border-color: #4dd8ff;
            box-shadow: 0 0 16px rgba(0, 180, 255, 0.45);
        }
        .opt-card.multi.selected { background: linear-gradient(135deg, #0e7a4a, #0c6a40); }
        .opt-name { color: #fff; font-size: 14px; font-weight: 700; }
        .opt-sub { color: rgba(170, 210, 255, 0.65); font-size: 12px; margin-top: 3px; }

        .feedback-bar {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(0, 190, 255, 0.3);
            background: rgba(10, 40, 90, 0.6);
            color: #cfe6ff;
            font-size: 13.5px;
            line-height: 1.75;
            display: none;
            animation: fadeInUp 0.4s ease;
        }
        .feedback-bar.show { display: block; }
        .feedback-bar.good { border-color: rgba(40, 220, 130, 0.6); background: rgba(8, 70, 45, 0.65); }
        .feedback-bar.bad { border-color: rgba(255, 150, 60, 0.55); background: rgba(90, 45, 8, 0.6); }

        /* 选址场景 */
        .site-wrap { display: flex; gap: 14px; align-items: stretch; }
        .site-map {
            flex: 1.4;
            border: 1px solid rgba(0, 190, 255, 0.35);
            border-radius: 10px;
            background: rgba(6, 24, 56, 0.8);
            overflow: hidden;
            position: relative;
        }
        .site-side { flex: 1; display: flex; flex-direction: column; }
        .spot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .spot-btn {
            padding: 11px 0;
            text-align: center;
            color: #cfe9ff;
            font-size: 13px;
            font-weight: 600;
            background: rgba(20, 60, 120, 0.5);
            border: 1px solid rgba(0, 190, 255, 0.4);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.18s;
        }
        .spot-btn:hover { border-color: #4dd8ff; box-shadow: 0 0 12px rgba(0, 190, 255, 0.4); }
        .spot-btn.active { background: linear-gradient(135deg, #1e4fd8, #1a3fb8); color: #fff; }
        .spot-btn.ok { background: linear-gradient(135deg, #0e9a5a, #0b7a46); }
        .site-side .feedback-bar { flex: 1; }
        .map-pin {
            position: absolute;
            transform: translate(-50%, -100%);
            font-size: 26px;
            filter: drop-shadow(0 0 8px rgba(255, 230, 0, 0.8));
            animation: pinBounce 0.5s ease;
            pointer-events: none;
        }
        @keyframes pinBounce { 0% { transform: translate(-50%, -180%); } 100% { transform: translate(-50%, -100%); } }

        /* 勘察表 */
        .survey-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .survey-tab {
            flex: 1;
            padding: 9px 0;
            text-align: center;
            font-size: 13px;
            color: rgba(180, 215, 255, 0.7);
            background: rgba(20, 60, 120, 0.35);
            border: 1px solid rgba(0, 190, 255, 0.25);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.18s;
        }
        .survey-tab.active { color: #fff; background: linear-gradient(135deg, #1e4fd8, #1a3fb8); border-color: #4dd8ff; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
        .form-item label { display: block; color: rgba(170, 210, 255, 0.75); font-size: 12px; margin-bottom: 4px; }
        .form-row { display: flex; gap: 6px; align-items: center; }
        .form-item input, .form-item select {
            flex: 1;
            width: 100%;
            background: rgba(8, 30, 70, 0.8);
            border: 1px solid rgba(0, 190, 255, 0.35);
            border-radius: 6px;
            color: #e8f4ff;
            padding: 8px 10px;
            font-size: 13px;
            outline: none;
            transition: border 0.2s;
        }
        .form-item input:focus, .form-item select:focus { border-color: #4dd8ff; box-shadow: 0 0 8px rgba(0, 190, 255, 0.3); }
        .form-item input.filled-auto { border-color: rgba(40, 220, 130, 0.7); }
        .measure-btn {
            white-space: nowrap;
            padding: 7px 12px;
            font-size: 12px;
            color: #4dd8ff;
            background: rgba(0, 120, 200, 0.2);
            border: 1px solid rgba(0, 190, 255, 0.5);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.18s;
        }
        .measure-btn:hover { background: rgba(0, 150, 255, 0.35); color: #fff; }
        .measure-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 测量设备模拟面板 */
        .device-pop {
            position: fixed;
            right: 26px;
            top: 50%;
            transform: translateY(-50%);
            width: 190px;
            background: rgba(6, 22, 50, 0.95);
            border: 1px solid rgba(0, 200, 255, 0.5);
            border-radius: 14px;
            padding: 14px;
            z-index: 1300;
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.35);
            text-align: center;
            animation: fadeInUp 0.3s ease;
        }
        .device-pop .dev-icon { font-size: 44px; }
        .device-pop .dev-name { color: #9fd4ff; font-size: 12px; margin: 6px 0 10px; }
        .scan-bar {

            justify-content: center;

            if (hint) hint.style.display = mode === 'explore' ? '' : 'none';

        // ============ 渲染步骤指示器 ============
        function renderStepIndicator() {
            const container = document.getElementById('stepIndicator');
            const connectorHtml = [];
            let html = '';
            steps.forEach((step, i) => {
                html += `
                    <div class="step-item ${i === 0 ? 'active' : ''}" data-index="${i}">
                        <span class="label">${step.label}</span>
                        <div class="dot">${i + 1}</div>
                    </div>
                `;
                if (i < steps.length - 1) {
                    html += `<div class="step-connector" data-idx="${i}"></div>`;
                }
            });
            container.innerHTML = html;

            // 绑定点击事件
            container.querySelectorAll('.step-item').forEach(item => {
                item.addEventListener('click', () => {
                    const idx = parseInt(item.dataset.index);
                    if (mode === 'explore' || idx <= currentStep) {
                        // 自由探索模式下允许跳步，跳过状态重置
                        if (mode === 'explore') {
                            // 跳步时只切换显示，不重置状态
                            currentStep = idx;
                            goToStep(idx);
                        } else {
                            goToStep(idx);
                        }
                    }
                });
            });
        }

        // ============ 渲染进度条 ============
        function renderProgressBar() {
            const bar = document.getElementById('progressBar');
            let html = '';
            steps.forEach((_, i) => {
                html += `<div class="dot" data-idx="${i}"></div>`;
            });
            bar.innerHTML = html;
        }

        // ============ 跳转到指定步骤 ============
        function goToStep(index) {
            currentStep = index;
            const step = steps[index];

            // 更新场景背景
            const bg = document.getElementById('sceneBg');
            bg.classList.add('fade-out');
            setTimeout(() => {
                bg.setAttribute('data-step', index);
                bg.classList.remove('fade-out');
            }, 400);

            // 更新步骤指示器
            document.querySelectorAll('.step-item').forEach(item => {
                const idx = parseInt(item.dataset.index);
                item.classList.remove('active', 'completed');
                if (idx === index) item.classList.add('active');
                else if (idx < index) item.classList.add('completed');
            });

            // 更新连接线
            document.querySelectorAll('.step-connector').forEach(conn => {
                const idx = parseInt(conn.dataset.idx);
                conn.classList.toggle('active', idx < index);
            });

            // 更新进度条
            document.querySelectorAll('#progressBar .dot').forEach(dot => {
                const idx = parseInt(dot.dataset.idx);
                dot.classList.remove('active', 'completed');
                if (idx === index) dot.classList.add('active');
                else if (idx < index) dot.classList.add('completed');
            });

            // 更新对话面板
            const panel = document.getElementById('dialogPanel');
            panel.style.animation = 'none';
            void panel.offsetWidth;
            panel.style.animation = 'fadeInUp 0.6s ease';

            document.getElementById('dialogTitle').textContent = step.title;
            document.getElementById('sceneTitle').textContent = step.label;
            renderStepContent(step);
            updateNextBtn(step);
            document.getElementById('btnSkip').style.display = (step.type === 'text') ? '' : 'none';
        }

        function addScore(n) { score += n; }

            const content = document.getElementById('dialogContent');
            const panel = document.getElementById('dialogPanel');
            const interactive = ['choice', 'quiz', 'siteselect', 'survey', 'design'].includes(step.type);
            panel.classList.toggle('wide', interactive);
            switch (step.type) {
                case 'text': content.innerHTML = `<div style="line-height:2.05">${step.content}</div>`; break;
                case 'choice': renderChoice(step, content); break;
                case 'quiz': renderQuiz(step, content); break;
                case 'siteselect': renderSite(step, content); break;
                case 'survey': renderSurvey(step, content); break;
                case 'design': renderDesign(step, content); break;
            }
        }

        function updateNextBtn(step) {
            const btn = document.getElementById('btnNext');
            if (step.type === 'quiz') btn.textContent = mapShown ? '下一步' : (quizIdx === step.subSteps.length - 1 ? '查看信号热力图' : '下一步');

            else btn.textContent = step.nextText || '下一步';
        }

                ${o.sub ? `<div class="opt-sub">${o.sub}</div>` : ''}

                card.addEventListener('click', () => {
                    container.querySelectorAll('.opt-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    onPick(parseInt(card.dataset.idx));
                });
            });
        }

        /* ---- 岗位选择 ---- */
        function renderChoice(step, content) {
            choiceSel = -1;
            content.innerHTML = `
                <div class="opt-intro">${step.intro}</div>
                <div class="opt-grid" id="choiceGrid">${step.options.map((o, i) => optCardHtml(o, i, false)).join('')}</div>
                <div class="feedback-bar" id="choiceFb"></div>`;
            bindSingleSel(content.querySelector('#choiceGrid'), (idx) => {
                choiceSel = idx;
                const o = step.options[idx];
                const fb = document.getElementById('choiceFb');
                fb.className = 'feedback-bar show ' + (o.good ? 'good' : 'bad');
                fb.innerHTML = o.feedback;
            });
        }

        /* ---- 站点摸测（分步选择） ---- */
        function renderQuiz(step, content) {
            if (mapShown) { renderHeatmap(content); return; }
            const sub = step.subSteps[quizIdx];
            quizSel = [];
            content.innerHTML = `
                <div class="opt-intro">${sub.q}${sub.multi ? '<span style="color:#ffd66b;font-size:12px">（可多选）</span>' : ''}</div>
                <div class="opt-grid" id="quizGrid">${sub.options.map((o, i) => optCardHtml(o, i, sub.multi)).join('')}</div>
                <div class="feedback-bar" id="quizFb"></div>`;
            content.querySelectorAll('#quizGrid .opt-card').forEach(card => {
                card.addEventListener('click', () => {
                    const idx = parseInt(card.dataset.idx);
                    if (sub.multi) {
                        card.classList.toggle('selected');
                        quizSel = quizSel.includes(idx) ? quizSel.filter(x => x !== idx) : quizSel.concat(idx);
                    } else {
                        content.querySelectorAll('.opt-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        quizSel = [idx];
                    }
                });
            });
        }

        /* ---- 信号热力图 ---- */
        function renderHeatmap(content) {
            const legend = `
                <div class="heat-legend">
                    <div style="color:#8fc7ff;font-weight:700;margin-bottom:2px">RSRP(dBm):</div>
                    <div class="li"><span class="sw" style="background:#e03131"></span>[-140,-115]</div>
                    <div class="li"><span class="sw" style="background:#f59f00"></span>(-115,-105]</div>
                    <div class="li"><span class="sw" style="background:#ffe066"></span>(-105,-95]</div>
                    <div class="li"><span class="sw" style="background:#51cf66"></span>(-95,-75]</div>
                    <div class="li"><span class="sw" style="background:#2f9e44"></span>(-75,+∞)</div>
                </div>`;
            const B = (x, y, w, h, label, fs = 11) =>
                `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#e9ecef" stroke="#adb5bd"/>
                 <text x="${x + w / 2}" y="${y + h / 2 + 4}" text-anchor="middle" font-size="${fs}" fill="#495057">${label}</text></g>`;
            const R = (x1, y1, x2, y2, color) =>
                `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="7" stroke-linecap="round"/>`;
            content.innerHTML = `
                <div class="opt-step-label">第五步：室外信号强度测试结果</div>
                <div style="display:flex;gap:12px;align-items:stretch">
                    <svg viewBox="0 0 560 300" style="flex:1;background:#f8f9fa;border-radius:8px;min-height:250px">
                        ${R(40, 70, 520, 70, '#e03131')}
                        ${R(150, 20, 150, 280, '#e03131')}
                        ${R(300, 20, 300, 280, '#f59f00')}
                        ${R(40, 170, 520, 170, '#ffe066')}
                        ${R(430, 130, 430, 280, '#51cf66')}
                        ${B(50, 25, 80, 32, '教学楼1')}
                        ${B(190, 25, 80, 32, '教学楼2')}
                        ${B(330, 25, 80, 32, '实验楼', 10)}
                        ${B(50, 95, 80, 32, '宿舍1', 10)}
                        ${B(190, 95, 90, 32, '校医院', 10)}
                        ${B(330, 95, 80, 32, '图书馆', 10)}
                        ${B(50, 195, 80, 32, '男生宿舍', 10)}
                        ${B(190, 195, 90, 32, '女生宿舍', 10)}
                        ${B(330, 195, 80, 32, '食堂', 10)}
                        ${B(50, 240, 80, 32, '操场1', 10)}
                        ${B(190, 240, 90, 32, '操场2', 10)}
                        <g opacity="0.85">
                            <circle cx="465" cy="90" r="26" fill="none" stroke="#2f9e44" stroke-width="2"/>
                            <circle cx="465" cy="90" r="14" fill="rgba(47,158,68,0.35)"/>
                            <text x="465" y="94" text-anchor="middle" font-size="10" fill="#2b8a3e">基站</text>
                        </g>
                    </svg>
                    ${legend}
                </div>
                <div class="feedback-bar show" style="margin-top:10px">
                    📡 <b>测试结论：</b>校园主干道以 <b style="color:#ff8787">弱覆盖（红/橙）</b>为主，宿舍区与食堂周边 <b style="color:#ffe066">中等覆盖（黄）</b>，仅现有站址周边小范围为良好覆盖。需新建 5G 基站补盲——请进入下一步完成选址。
                </div>`;
        }

        /* ---- 基站选址 ---- */
        function siteMapSvg() {
            const bld = (x, y, w, h, f) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${f}" stroke="rgba(0,60,110,0.5)"/>`;
            return `<svg viewBox="0 0 420 260" style="width:100%;height:100%;display:block">
                <defs>
                    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#2e7d32"/><stop offset="100%" stop-color="#1b5e20"/>
                    </linearGradient>
                </defs>
                <rect width="420" height="260" fill="url(#grass)"/>
                <rect x="0" y="0" width="420" height="260" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
                ${bld(30, 30, 90, 50, '#8d6e63')}${bld(140, 25, 110, 55, '#a1887f')}${bld(280, 30, 100, 50, '#8d6e63')}
                ${bld(35, 120, 80, 45, '#bcaaa4')}${bld(150, 115, 100, 50, '#a1887f')}${bld(290, 120, 90, 45, '#8d6e63')}
                <ellipse cx="60" cy="215" rx="40" ry="20" fill="#66bb6a" stroke="rgba(255,255,255,0.3)"/>
                <text x="60" y="219" text-anchor="middle" font-size="10" fill="#e8f5e9">操场</text>
                <ellipse cx="350" cy="218" rx="42" ry="20" fill="#66bb6a" stroke="rgba(255,255,255,0.3)"/>
                <text x="350" y="222" text-anchor="middle" font-size="10" fill="#e8f5e9">运动场</text>
                <line x1="0" y1="95" x2="420" y2="95" stroke="#eceff1" stroke-width="10" opacity="0.85"/>
                <line x1="0" y1="185" x2="420" y2="185" stroke="#eceff1" stroke-width="10" opacity="0.85"/>
                <line x1="120" y1="0" x2="120" y2="260" stroke="#eceff1" stroke-width="9" opacity="0.85"/>
                <line x1="265" y1="0" x2="265" y2="260" stroke="#eceff1" stroke-width="9" opacity="0.85"/>
                <g opacity="0.9"><polygon points="392,20 398,42 386,42" fill="#ff8f00"/><line x1="392" y1="42" x2="392" y2="62" stroke="#5d4037" stroke-width="3"/><line x1="384" y1="48" x2="400" y2="48" stroke="#5d4037" stroke-width="2"/></g>
                <text x="392" y="76" text-anchor="middle" font-size="9" fill="#fff59d">高压电塔</text>
                <g transform="translate(210,130)"><circle r="9" fill="#ff5252" opacity="0.9"/><circle r="16" fill="none" stroke="#ff5252" opacity="0.5"/><circle r="24" fill="none" stroke="#ff5252" opacity="0.25"/></g>
            </svg>`;
        }
        function renderSite(step, content) {
            siteSel = -1; siteConfirmed = false;
            content.innerHTML = `
                <div class="opt-intro">${step.intro}</div>
                <div class="site-wrap">
                    <div class="site-map">${siteMapSvg()}<div id="pinLayer"></div></div>
                    <div class="site-side">
                        <div class="opt-step-label" style="margin-top:0">候选位置</div>
                        <div class="spot-grid" id="spotGrid">${step.spots.map((s, i) => `<div class="spot-btn" data-idx="${i}">${s.name}</div>`).join('')}</div>
                        <div class="spot-btn" id="btnConfirmSite" style="visibility:hidden;background:linear-gradient(135deg,#0e9a5a,#0b7a46);border-color:#51cf66">✅ 选址确认</div>
                        <div class="feedback-bar" id="siteFb"></div>
                    </div>
                </div>`;
            const pinLayer = content.querySelector('#pinLayer');
            const fb = content.querySelector('#siteFb');
            const confirmBtn = content.querySelector('#btnConfirmSite');
            content.querySelectorAll('#spotGrid .spot-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    siteSel = idx;
                    content.querySelectorAll('#spotGrid .spot-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const s = step.spots[idx];
                    pinLayer.innerHTML = `<div class="map-pin" style="left:${s.x}%;top:${s.y}%">📍</div>`;
                    fb.className = 'feedback-bar show ' + (s.ok ? 'good' : 'bad');
                    fb.innerHTML = s.feedback;
                    confirmBtn.style.visibility = s.ok ? 'visible' : 'hidden';
                    if (!s.ok) { confirmBtn.textContent = '✅ 选址确认'; }
                });
            });
            confirmBtn.addEventListener('click', () => {
                siteConfirmed = true;
                confirmBtn.classList.add('ok');
                confirmBtn.textContent = '✅ 已确认选址';
                const s = step.spots[siteSel];
                if (s.ok && !step._scored) { addScore(2); step._scored = true; }
                fb.innerHTML += `<div style="margin-top:6px;color:#5eff9b">已确认站址！点击"下一步"进入基站勘察表填写。</div>`;
            });
        }

        /* ---- 勘察表填写 ---- */
        function renderSurvey(step, content) {
            content.innerHTML = `
                <div class="opt-intro" style="font-size:12.5px;margin-bottom:8px">${step.intro}</div>
                <button class="plan-fab" onclick="showPlan()">工程规划</button>
                <div class="survey-tabs">${step.tabs.map((t, i) => `<div class="survey-tab ${i === surveyTab ? 'active' : ''}" data-tab="${i}">${i + 1} ${t}</div>`).join('')}</div>
                <div class="form-grid" id="surveyForm"></div>`;
            renderSurveyTab(step, content);
            content.querySelectorAll('.survey-tab').forEach(t => {
                t.addEventListener('click', () => {
                    collectSurveyVals(content, step);
                    surveyTab = parseInt(t.dataset.tab);
                    content.querySelectorAll('.survey-tab').forEach(x => x.classList.remove('active'));
                    t.classList.add('active');
                    renderSurveyTab(step, content);
                });
            });
        }
        function renderSurveyTab(step, content) {
            const grid = content.querySelector('#surveyForm');
            grid.innerHTML = step.fields.filter(f => f.tab === surveyTab).map(f => {
                const val = f._val || '';
                if (f.type === 'select') {
                    return `<div class="form-item"><label>${f.key}</label><select data-key="${f.key}">${f.opts.map(o => `<option ${o === val ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
                }
                const mBtn = f.measure ? `<button class="measure-btn" data-key="${f.key}">🔍 测量</button>` : '';
                return `<div class="form-item"><label>${f.key}${f.measure ? ' 🔍' : ''}</label><div class="form-row"><input data-key="${f.key}" placeholder="${f.ph || ''}" value="${val}">${mBtn}</div></div>`;
            }).join('');
            grid.querySelectorAll('input,select').forEach(el => {
                el.addEventListener('change', () => {
                    const f = step.fields.find(x => x.key === el.dataset.key);
                    if (f) f._val = el.value;
                });
                el.addEventListener('input', () => {
                    const f = step.fields.find(x => x.key === el.dataset.key);
                    if (f) f._val = el.value;
                });
            });
            grid.querySelectorAll('.measure-btn').forEach(btn => btn.addEventListener('click', () => doMeasure(step, btn)));
        }
        function collectSurveyVals(content, step) {
            content.querySelectorAll('#surveyForm input').forEach(inp => {
                const f = step.fields.find(x => x.key === inp.dataset.key);
                if (f) f._val = inp.value;
            });
            content.querySelectorAll('#surveyForm select').forEach(sel => {
                const f = step.fields.find(x => x.key === sel.dataset.key);
                if (f) f._val = sel.value;
            });
        }
        function doMeasure(step, btn) {
            const f = step.fields.find(x => x.key === btn.dataset.key);
            const pop = document.createElement('div');
            pop.className = 'device-pop';
            pop.innerHTML = `<div class="dev-icon">${f.measure.icon}</div><div class="dev-name">${f.measure.name} · 测量中</div><div class="scan-bar"><i></i></div><div class="dev-val">正在采集数据…</div>`;
            document.body.appendChild(pop);
            btn.disabled = true;
            setTimeout(() => {
                pop.querySelector('.dev-val').textContent = f.measure.value;
                const input = document.querySelector(`#surveyForm input[data-key="${f.key}"]`);
                if (input) { input.value = f.measure.value; input.classList.add('filled-auto'); }
                f._val = f.measure.value;
                if (!surveyMeasured.has(f.key)) { surveyMeasured.add(f.key); addScore(1); }
                setTimeout(() => { pop.remove(); btn.disabled = false; btn.textContent = '✅ 已测'; }, 1100);
            }, 1500);
        }
        function showPlan() {
            const step = steps[currentStep];
            const modal = document.createElement('div');
            modal.className = 'plan-modal';
            modal.innerHTML = `<div class="plan-card"><h4>📋 工程规划（参考资料）</h4>
                ${step.plan.map((rows, i) => `<div style="color:#4dd8ff;font-size:12px;margin:8px 0 2px">—— ${step.tabs[i]} ——</div>` +
                    rows.map(r => `<div class="plan-row"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('')).join('')}
                <div class="plan-close"><button class="measure-btn" onclick="this.closest('.plan-modal').remove()">关闭</button></div></div>`;
            document.querySelector('#dialogPanel .dialog-box').appendChild(modal);
        }
        function countUnfilled(step) {
            return step.fields.filter(f => f.type === 'input' && !(f._val || '').trim()).length;
        }

        /* ---- 基站设计 ---- */
        function renderDesign(step, content) {
            designSel = [-1, -1, -1, -1];
            designDone = false;
            content.innerHTML = `<div class="opt-intro">${step.intro}</div>` +
                step.groups.map((g, gi) => `
                    <div class="opt-step-label">${gi + 1}. ${g.q}</div>
                    <div class="opt-grid design-g" data-g="${gi}" style="grid-template-columns:repeat(3,1fr)">${g.options.map((o, oi) => optCardHtml(o, oi, false)).join('')}</div>
                `).join('') +
                `<div class="design-result" id="designResult"></div>`;
            content.querySelectorAll('.design-g').forEach(grid => {
                bindSingleSel(grid, (idx) => { designSel[parseInt(grid.dataset.g)] = idx; });
            });
        }
        function submitDesign(step) {
            let got = 0;
            const rows = step.groups.map((g, gi) => {
                const ok = designSel[gi] === g.correct;
                if (ok) got++;
                return `<div>· <b>${g.q}</b>：${g.options[designSel[gi]]} ${ok ? '✅' : '❌（建议：' + g.options[g.correct] + '）'}</div>`;
            }).join('');
            addScore(got);
            designDone = true;
            step._scored = true;
            const res = document.getElementById('designResult');
            res.innerHTML = rows + `<div style="margin-top:8px;color:#5eff9b">🎯 ${step.result}</div>`;
            res.classList.add('show');
            updateNextBtn(step);
        }

        // ============ 下一步（按步骤类型校验） ============
        function nextStep() {
            const step = steps[currentStep];
            const content = document.getElementById('dialogContent');
            switch (step.type) {
                case 'choice':
                    if (choiceSel < 0) { alert('请先选择一个岗位角色'); return; }
                    break;
                case 'quiz': {
                    if (mapShown) break;
                    const sub = step.subSteps[quizIdx];
                    if (!sub.multi && quizSel.length !== 1) { alert('请先完成选择'); return; }
                    if (sub.multi) {
                        if (!quizSel.includes(sub.required)) { alert('网络测试离不开测试软件，请选择"测试软件"！'); return; }
                    }
                    if (!step._scored) step._scored = [];
                    if (!step._scored[quizIdx]) {
                        if (sub.multi) { if (quizSel.includes(sub.required)) addScore(1); }
                        else if (quizSel[0] === sub.correct) addScore(1);
                        step._scored[quizIdx] = true;
                    }
                    if (quizIdx < step.subSteps.length - 1) {
                        quizIdx++;
                        renderQuiz(step, content);
                        updateNextBtn(step);
                        return;
                    }
                    if (!mapShown) {
                        mapShown = true;
                        renderHeatmap(content);
                        updateNextBtn(step);
                        return;
                    }
                    break;
                }
                case 'siteselect':
                    if (!siteConfirmed) { alert('请查看各位置选址分析，确认理想站址后继续'); return; }
                    break;
                case 'survey': {
                    collectSurveyVals(content, step);
                    const unfilled = countUnfilled(step);
                    if (unfilled > 0 && !confirm(`还有 ${unfilled} 项未填写（可通过"工程规划"参考或设备测量获得），确认跳过继续吗？`)) return;
                    break;
                }
                case 'design':
                    if (!designDone) {
                        if (designSel.some(v => v < 0)) { alert('请完成全部 4 项设计选择'); return; }
                        submitDesign(step);
                        return;
                    }
                    break;
            }
            if (currentStep < steps.length - 1) {
                goToStep(currentStep + 1);
            } else {
                showEndScreen();
            }
        }

        // ============ 跳过对话 ============
        function skipDialog() {
            nextStep();
        }

        // ============ 显示结束画面 ============
        function showEndScreen() {
            const pct = scoreMax ? Math.round(score / scoreMax * 100) : 100;
            const stars = pct >= 90 ? 5 : pct >= 75 ? 4 : pct >= 60 ? 3 : pct >= 40 ? 2 : 1;
            const comment = pct >= 90 ? '优秀！你就是王牌勘察工程师！' :
                pct >= 75 ? '良好！离专家只差一点点！' :
                pct >= 60 ? '合格！继续加油！' : '再接再厉，回看流程再来一次！';
            document.getElementById('scoreBox').innerHTML = `
                <div class="score-num">${score}<span> / ${scoreMax}</span></div>
                <div class="score-stars">${'⭐'.repeat(stars)}${'☆'.repeat(5 - stars)}</div>
                <div class="score-cmt">${comment}</div>`;
            document.getElementById('endScreen').classList.add('show');
        }

        // ============ 重新开始 ============
        function restart() {
            score = 0; quizIdx = 0; quizSel = []; quizDone = false; mapShown = false;
            choiceSel = -1; siteSel = -1; siteConfirmed = false; surveyTab = 0;
            surveyMeasured = new Set(); designSel = [-1, -1, -1, -1]; designDone = false;
            steps.forEach(s => { s._scored = undefined; s.fields && s.fields.forEach(f => f._val = ''); });
            document.getElementById('endScreen').classList.remove('show');
            goToStep(0);
        }

        // ============ 返回主菜单 ============
        function goBack() {
            window.location.href = '/';
        }

        // ============ 时钟 ============
        function updateClock() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('clockDate').textContent =
                `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
            document.getElementById('clockTime').textContent =
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }

        // ============ AI生成实训 ============
        function showGenPanel() {
            document.getElementById('genMask').classList.add('show');
            document.getElementById('genForm').style.display = 'block';
            document.getElementById('genLoading').classList.remove('show');
            document.getElementById('genBtn').disabled = false;
        }
        function hideGenPanel() {
            document.getElementById('genMask').classList.remove('show');
        }
        async function generateScenario() {
            const topic = document.getElementById('genTopic').value.trim();
            const question = document.getElementById('genQuestion').value.trim();
            if (!topic) { alert('请输入场景主题'); return; }

            // 切换到加载状态
            document.getElementById('genForm').style.display = 'none';
            document.getElementById('genLoading').classList.add('show');
            document.getElementById('genBtn').disabled = true;

            try {
                const resp = await fetch('/api/scenario/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, question })
                });
                const data = await resp.json();
                if (!resp.ok) {
                    alert('生成失败：' + (data.error || '未知错误'));
                    document.getElementById('genForm').style.display = 'block';
                    document.getElementById('genLoading').classList.remove('show');
                    document.getElementById('genBtn').disabled = false;
                    return;
                }
                // 成功：替换steps并重新初始化
                hideGenPanel();
                loadNewScenario(data.steps, data.scoreMax, topic);
            } catch (e) {
                alert('请求失败：' + e.message);
                document.getElementById('genForm').style.display = 'block';
                document.getElementById('genLoading').classList.remove('show');
                document.getElementById('genBtn').disabled = false;
            }
        }

        function loadNewScenario(newSteps, newScoreMax, topic) {
            // 重置所有状态
            currentStep = 0; score = 0; quizIdx = 0; quizSel = []; quizDone = false; mapShown = false;
            choiceSel = -1; siteSel = -1; siteConfirmed = false; surveyTab = 0;
            surveyMeasured = new Set(); designSel = [-1, -1, -1, -1]; designDone = false;

            // 替换steps数据和满分
            steps = newSteps;
            scoreMax = newScoreMax || 12;
            steps.forEach(s => { s._scored = undefined; s.fields && s.fields.forEach(f => f._val = ''); });

            // 更新页面标题
            const titleEl = document.getElementById('sceneTitle');
            if (titleEl) titleEl.textContent = topic + ' · 虚拟仿真实训';
            const topTitle = document.querySelector('.top-bar .title');
            if (topTitle) topTitle.textContent = topic + ' 虚拟仿真实训平台';

            // 隐藏结束画面
            document.getElementById('endScreen').classList.remove('show');
            // 显示AI生成内容标识（合规要求）
            const genBadge = document.getElementById('aiGenBadge');
            if (genBadge) genBadge.style.display = 'block';
            // 重新初始化
            init();
        }

        // 启动
        init();
    </script>
