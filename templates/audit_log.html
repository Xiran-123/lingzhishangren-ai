<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全与操作审计 · 灵智尚人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e9f2 100%);
            min-height: 100vh; padding: 20px; color: #1f2937;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
            color: #fff; padding: 24px 32px; border-radius: 16px; margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(35, 37, 38, 0.3);
        }
        .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
        .header h1 { font-size: 26px; margin-bottom: 6px; }
        .header p { opacity: 0.85; font-size: 14px; line-height: 1.6; }
        .back-btn {
            padding: 10px 20px; background: rgba(255,255,255,0.18); border: none; border-radius: 10px;
            color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 18px; }
        .stat-card { background: rgba(255,255,255,0.14); padding: 14px 18px; border-radius: 12px; }
        .stat-label { font-size: 12px; opacity: 0.85; margin-bottom: 6px; }
        .stat-value { font-size: 23px; font-weight: 700; }
        .stat-value.small { font-size: 14px; font-weight: 600; }

        .panel { background: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(31,41,55,0.06); }
        .panel-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

        .btn { padding: 9px 16px; border: none; border-radius: 9px; font-size: 13px; cursor: pointer; background: #414345; color: #fff; }
        .btn:hover { opacity: .88; }
        .btn.ghost { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }
        input[type="text"], select {
            padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px;
            font-family: inherit; background: #fff; color: #1f2937;
        }
        #keywordInput { min-width: 200px; }

        .banner { padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
        .banner.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .banner.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            font-size: 12px; padding: 5px 11px; border-radius: 20px; background: #f3f4f6;
            color: #374151; border: 1px solid #e5e7eb; cursor: pointer; user-select: none;
        }
        .chip.active { background: #414345; color: #fff; border-color: #414345; }

        table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
        th { font-size: 12px; color: #6b7280; font-weight: 600; background: #fafbfc; position: sticky; top: 0; }
        tr:hover td { background: #fafbfd; }
        .mono { font-family: 'Consolas', 'Monaco', monospace; }
        .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #eef2ff; color: #4338ca; font-weight: 600; white-space: nowrap; }
        .badge.danger { background: #fee2e2; color: #b91c1c; }
        .badge.neutral { background: #f3f4f6; color: #4b5563; }
        .role { font-size: 11px; color: #6b7280; }
        .diff { font-size: 11px; font-family: 'Consolas', 'Monaco', monospace; color: #6b7280; max-width: 300px; word-break: break-all; }
        .diff .from { color: #b91c1c; }
        .diff .to { color: #047857; }
        .empty { text-align: center; color: #9ca3af; font-size: 13px; padding: 28px 10px; }
        .table-wrap { max-height: 560px; overflow-y: auto; border: 1px solid #eef0f3; border-radius: 10px; }
        .toast {
            position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
            background: #1f2937; color: #fff; padding: 11px 20px; border-radius: 10px;
            font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 9999;
        }
        .toast.show { opacity: .95; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-top">
            <div>
                <h1>🛡 安全与操作审计</h1>
                <p>凭据一律哈希落盘、高危操作全程留痕：谁在什么时间、从哪个 IP、对哪个对象做了什么改动，都可追溯。</p>
            </div>
            <a href="/" class="back-btn">← 返回首页</a>
        </div>
        <div class="stats-row">
            <div class="stat-card"><div class="stat-label">凭据存储</div><div class="stat-value small" id="stCred">–</div></div>
            <div class="stat-card"><div class="stat-label">教师账号</div><div class="stat-value" id="stTeachers">–</div></div>
            <div class="stat-card"><div class="stat-label">审计记录总数</div><div class="stat-value" id="stTotal">–</div></div>
            <div class="stat-card"><div class="stat-label">日志体积</div><div class="stat-value" id="stSize">–</div></div>
            <div class="stat-card"><div class="stat-label">最近一次操作</div><div class="stat-value small" id="stLast">–</div></div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">🔐 合规状态</div>
        <div id="credBanner"></div>
        <div class="chips" id="actionChips" style="margin-top:6px;"></div>
    </div>

    <div class="panel">
        <div class="panel-title">📜 操作审计日志</div>
        <div class="row">
            <select id="actionSelect"><option value="">全部操作类型</option></select>
            <input type="text" id="keywordInput" placeholder="按对象 / 详情 / 操作人搜索">
            <select id="limitSelect">
                <option value="50">最近 50 条</option>
                <option value="100" selected>最近 100 条</option>
                <option value="300">最近 300 条</option>
                <option value="500">最近 500 条</option>
            </select>
            <button class="btn" id="searchBtn">查询</button>
            <button class="btn ghost" id="resetBtn">重置</button>
        </div>
        <div class="row" style="margin-top:10px;font-size:12px;color:#6b7280;" id="resultHint"></div>
        <div class="table-wrap" style="margin-top:10px;">
            <table>
                <thead>
                <tr>
                    <th style="width:150px;">时间</th>
                    <th style="width:110px;">操作</th>
                    <th style="width:100px;">操作人</th>
                    <th style="width:110px;">来源 IP</th>
                    <th style="width:160px;">对象</th>
                    <th>详情 / 改动</th>
                </tr>
                </thead>
                <tbody id="auditBody">
                <tr><td colspan="6" class="empty">加载中…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
    const $ = (id) => document.getElementById(id);

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    let toastTimer = null;
    function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    let ALL_ACTIONS = [];

    function renderSummary(d) {
        const cred = d.credential || {};
        const audit = d.audit || {};
        $('stCred').textContent = cred.hashed ? '✅ 已全部哈希化' : '⚠️ 存在明文';
        $('stTeachers').textContent = cred.teachers || 0;
        $('stTotal').textContent = (audit.total || 0).toLocaleString();
        $('stSize').textContent = (audit.size_kb || 0) + ' KB';
        $('stLast').textContent = audit.last_ts || '暂无';

        const b = $('credBanner');
        if (cred.hashed) {
            b.className = 'banner ok';
            b.innerHTML = '✅ 密码采用 <b>pbkdf2:sha256 + 随机盐</b> 哈希存储（' + esc(cred.file) + '），' +
                '明文密码不再落盘。迁移时间：' + esc(cred.migrated_at || cred.created_at || '–');
        } else {
            b.className = 'banner warn';
            b.innerHTML = '⚠️ 仍有未哈希条目：' + esc((cred.plain_left || []).join('、'));
        }

        ALL_ACTIONS = d.actions || [];
        const sel = $('actionSelect');
        sel.innerHTML = '<option value="">全部操作类型</option>' +
            ALL_ACTIONS.map(a => '<option value="' + esc(a.action) + '">' + esc(a.label) + '</option>').join('');

        const counts = {};
        (audit.by_action || []).forEach(x => { counts[x.action] = x.count; });
        $('actionChips').innerHTML = (audit.by_action || []).slice(0, 12).map(x =>
            '<span class="chip" data-action="' + esc(x.action) + '">' + esc(x.label) + ' ' + x.count + '</span>'
        ).join('') || '<span style="font-size:12px;color:#9ca3af;">暂无审计记录</span>';
        $('actionChips').querySelectorAll('.chip').forEach(c => {
            c.addEventListener('click', () => {
                $('actionSelect').value = c.dataset.action;
                loadAudit();
            });
        });
    }

    function renderDiff(rec) {
        if (rec.before === undefined && rec.after === undefined) return '';
        const f = (o) => o === undefined ? '—' : esc(JSON.stringify(o));
        return '<div class="diff"><span class="from">' + f(rec.before) +
            '</span> → <span class="to">' + f(rec.after) + '</span></div>';
    }

    function renderRecords(records) {
        const body = $('auditBody');
        if (!records || !records.length) {
            body.innerHTML = '<tr><td colspan="6" class="empty">没有符合条件的审计记录</td></tr>';
            return;
        }
        body.innerHTML = records.map(r => {
            const danger = r.action === 'login_failed';
            const cls = danger ? 'badge danger' : (r.action === 'login' ? 'badge neutral' : 'badge');
            return '<tr>' +
                '<td class="mono">' + esc(r.ts) + '</td>' +
                '<td><span class="' + cls + '">' + esc(r.action_label || r.action) + '</span></td>' +
                '<td>' + esc(r.actor || '—') + '<div class="role">' + esc(r.role || '') + '</div></td>' +
                '<td class="mono">' + esc(r.ip || '—') + '</td>' +
                '<td>' + esc(r.target || '—') + '</td>' +
                '<td>' + esc(r.detail || '') + renderDiff(r) + '</td>' +
                '</tr>';
        }).join('');
    }

    async function loadSummary() {
        try {
            const r = await fetch('/api/security/summary');
            const d = await r.json();
            if (!d.success) { toast(d.error || '概览获取失败'); return; }
            renderSummary(d);
        } catch (e) { toast('概览获取失败：' + e.message); }
    }

    async function loadAudit() {
        const params = new URLSearchParams({
            limit: $('limitSelect').value,
            action: $('actionSelect').value,
            keyword: $('keywordInput').value.trim()
        });
        $('auditBody').innerHTML = '<tr><td colspan="6" class="empty">查询中…</td></tr>';
        try {
            const r = await fetch('/api/security/audit?' + params.toString());
            const d = await r.json();
            if (!d.success) {
                $('auditBody').innerHTML = '<tr><td colspan="6" class="empty">' + esc(d.error || '查询失败') + '</td></tr>';
                toast(d.error || '查询失败');
                return;
            }
            renderRecords(d.records);
            $('resultHint').textContent = '共返回 ' + d.total + ' 条记录' +
                ($('actionSelect').value ? '（操作类型：' + $('actionSelect').value + '）' : '') +
                ($('keywordInput').value.trim() ? '（关键词：' + $('keywordInput').value.trim() + '）' : '');
        } catch (e) {
            $('auditBody').innerHTML = '<tr><td colspan="6" class="empty">请求失败</td></tr>';
            toast('查询请求失败：' + e.message);
        }
    }

    $('searchBtn').addEventListener('click', loadAudit);
    $('keywordInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadAudit(); });
    $('actionSelect').addEventListener('change', loadAudit);
    $('limitSelect').addEventListener('change', loadAudit);
    $('resetBtn').addEventListener('click', () => {
        $('actionSelect').value = '';
        $('keywordInput').value = '';
        $('limitSelect').value = '100';
        loadAudit();
    });

    loadSummary();
    loadAudit();
</script>
</body>
</html>
