<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧情演绎 - 灵智尚人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-1: #0a1838; --bg-2: #0d1f45; --bg-3: #1a2d6a;
            --accent: #667eea; --accent-2: #764ba2; --cyan: #00c8ff;
            --glass: rgba(255,255,255,0.06); --glass-border: rgba(255,255,255,0.12);
            --text: #e0ecff; --text-dim: #8fa3c7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            min-height: 100vh; color: var(--text); overflow: hidden;
        }
        /* 粒子背景 */
        .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-particles span { position: absolute; display: block; border-radius: 50%; background: rgba(0,200,255,0.7); box-shadow: 0 0 6px rgba(0,200,255,0.8); animation: bgFloat linear infinite; }
        @keyframes bgFloat { 0%{transform:translateY(0) translateX(0);opacity:0;} 10%{opacity:0.9;} 90%{opacity:0.7;} 100%{transform:translateY(-120vh) translateX(30px);opacity:0;} }
        .bg-particles span:nth-child(1){left:10%;top:80%;width:3px;height:3px;animation-duration:14s;}
        .bg-particles span:nth-child(2){left:30%;top:25%;width:4px;height:4px;animation-duration:16s;animation-delay:-5s;}
        .bg-particles span:nth-child(3){left:60%;top:60%;width:3px;height:3px;animation-duration:17s;animation-delay:-6s;}
        .bg-particles span:nth-child(4){left:85%;top:40%;width:2px;height:2px;animation-duration:13s;animation-delay:-3s;}

        .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; position: relative; z-index: 1; }

        /* 顶部导航 */
        .top-nav {
            background: linear-gradient(135deg, #0a1a4a 0%, #0e2a60 100%);
            color: white; padding: 12px 20px; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid rgba(0,200,255,0.2); position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .top-nav::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,200,255,0.6), transparent); }
        .nav-logo { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .nav-logo span { background: linear-gradient(135deg, var(--cyan), #4d94ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-tag { padding: 4px 10px; background: rgba(255,255,255,0.1); border-radius: 6px; font-size: 12px; }
        .nav-spacer { flex: 1; }
        .nav-btn { padding: 6px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #e0ecff; font-size: 13px; cursor: pointer; transition: all 0.25s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .nav-btn:hover { background: rgba(255,255,255,0.18); box-shadow: 0 2px 8px rgba(102,126,234,0.3); }
        .nav-btn svg { display: block; }
        .nav-btn-danger { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.4); color: #f87171; }
        .nav-btn-danger:hover { background: rgba(239,68,68,0.22); box-shadow: 0 2px 8px rgba(239,68,68,0.3); }
        .nav-btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; font-weight: 500; }
        .nav-btn-primary:hover { box-shadow: 0 2px 10px rgba(102,126,234,0.5); transform: translateY(-1px); }

        .main { display: grid; grid-template-columns: 300px 1fr; overflow: hidden; }

        /* 左侧场景栏 */
        .sidebar {
            background: var(--glass); backdrop-filter: blur(16px);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .sidebar-head { padding: 14px 16px; border-bottom: 1px solid var(--glass-border); }
        .sidebar-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .sidebar-actions { display: flex; gap: 6px; }
        .mini-btn { flex: 1; padding: 6px; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); border-radius: 6px; color: var(--text); font-size: 11px; cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none; }
        .mini-btn:hover { border-color: var(--cyan); color: var(--cyan); }

        .sidebar-body { flex: 1; overflow-y: auto; padding: 12px; }
        .sidebar-body::-webkit-scrollbar { width: 4px; }
        .sidebar-body::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 2px; }

        /* 沉浸式入口 */
        .immersive-entry {
            background: linear-gradient(135deg, rgba(0,128,255,0.15) 0%, rgba(0,200,255,0.1) 100%);
            border: 1px solid rgba(0,150,255,0.4); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
        }
        .immersive-entry .title { font-size: 12px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .immersive-entry .badge { background: linear-gradient(135deg,#0080ff,#00c8ff); color:#fff; padding:1px 6px; border-radius:3px; font-size:10px; }
        .immersive-entry .desc { font-size: 11px; color: var(--text-dim); line-height: 1.4; margin-bottom: 6px; }
        .immersive-entry .go { display: block; text-align: center; padding: 6px; background: linear-gradient(135deg, #0080ff, #00c8ff); color: #fff; border-radius: 16px; font-size: 11px; font-weight: 600; text-decoration: none; }

        /* 自定义场景折叠区 */
        .custom-section {
            background: linear-gradient(135deg, rgba(102,126,234,0.12) 0%, rgba(118,75,162,0.12) 100%);
            border: 1.5px dashed rgba(102,126,234,0.5); border-radius: 10px; padding: 12px; margin-bottom: 14px;
        }
        .custom-title { font-size: 13px; font-weight: 600; color: var(--cyan); margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .custom-body { display: none; }
        .custom-section.open .custom-body { display: block; }
        .input-group { margin-bottom: 8px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
        .input-group input, .input-group textarea { width: 100%; padding: 7px 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 6px; color: var(--text); font-size: 12px; font-family: inherit; }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: var(--cyan); }
        .input-group textarea { resize: vertical; min-height: 50px; }
        .start-custom-btn { width: 100%; padding: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .start-custom-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(102,126,234,0.4); }
        .start-custom-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* 场景卡片 */
        .scenario-card {
            background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 10px;
            padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.25s;
        }
        .scenario-card:hover { border-color: var(--cyan); transform: translateX(3px); background: rgba(0,200,255,0.05); }
        .scenario-card.active { border-color: var(--accent); background: linear-gradient(135deg, rgba(102,126,234,0.18) 0%, rgba(118,75,162,0.18) 100%); box-shadow: 0 2px 12px rgba(102,126,234,0.3); }
        .scenario-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .scenario-title { font-size: 13px; font-weight: 600; }
        .difficulty-badge { padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; }
        .difficulty-badge.simple { background: rgba(46,125,50,0.25); color: #66bb6a; }
        .difficulty-badge.medium { background: rgba(239,108,0,0.25); color: #ffa726; }
        .difficulty-badge.hard { background: rgba(198,40,40,0.25); color: #ef5350; }
        .scenario-description { font-size: 11px; color: var(--text-dim); line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .scenario-tasks { background: rgba(0,0,0,0.15); padding: 6px 8px; border-radius: 6px; }
        .task-item { font-size: 11px; color: var(--text-dim); padding: 2px 0; display: flex; align-items: center; gap: 5px; }
        .task-item::before { content: '▸'; color: var(--cyan); }

        /* 右侧聊天区 */
        .chat-panel { display: flex; flex-direction: column; overflow: hidden; margin: 12px; border-radius: 16px; background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: 0 8px 40px rgba(0,0,0,0.3); }

        /* 场景信息条 */
        .scenario-info-bar { background: rgba(0,0,0,0.2); padding: 10px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--glass-border); }
        .scenario-info-bar .label { font-size: 11px; color: var(--text-dim); }
        .scenario-info-bar .name { font-size: 14px; font-weight: 600; color: var(--cyan); }
        .scenario-info-bar .tasks { font-size: 11px; color: var(--text-dim); margin-left: auto; }

        .chat-header { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: white; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
        .chat-icon { width: 36px; height: 36px; border-radius: 10px; overflow: hidden; }
        .chat-icon img { width: 100%; height: 100%; object-fit: contain; }
        .chat-title { font-size: 16px; font-weight: 600; }
        .chat-subtitle { font-size: 11px; opacity: 0.85; }

        .messages-area { flex: 1; overflow-y: auto; padding: 20px; background: rgba(0,0,0,0.15); }
        .message { margin-bottom: 18px; display: flex; gap: 10px; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        .message.user { flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .message.user .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; }
        .message.assistant .avatar { background: transparent; padding: 0; box-shadow: none; }
        .message.assistant .avatar img { width: 100%; height: 100%; object-fit: contain; }
        .message-content { max-width: 70%; padding: 12px 16px; border-radius: 14px; line-height: 1.6; word-wrap: break-word; }
        .message.user .message-content { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-top-right-radius: 4px; }
        .message.assistant .message-content { background: rgba(255,255,255,0.08); color: var(--text); border-top-left-radius: 4px; border: 1px solid var(--glass-border); }
        .message-content pre { background: #0a0e1a; color: #e8e8e8; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace; font-size: 13px; }
        .message-content code { font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace; }

        .typing-dots { display: flex; gap: 5px; }
        .typing-dots span { width: 7px; height: 7px; background: var(--cyan); border-radius: 50%; animation: bounce 1.4s infinite; }
        .typing-dots span:nth-child(2){animation-delay:.2s;} .typing-dots span:nth-child(3){animation-delay:.4s;}
        @keyframes bounce { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-6px);} }

        .input-area { padding: 14px 20px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--glass-border); display: flex; gap: 10px; align-items: flex-end; }
        .image-preview { max-width: 60px; max-height: 60px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); display: none; }
        .image-preview.show { display: block; cursor: pointer; }
        .upload-btn { padding: 10px 12px; background: rgba(255,255,255,0.08); border: none; border-radius: 10px; font-size: 16px; cursor: pointer; color: var(--text); transition: all 0.2s; }
        .upload-btn:hover { background: rgba(255,255,255,0.15); }
        .upload-btn svg { display: block; }
        .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .upload-menu-wrap { position: relative; }
        .upload-menu { position: absolute; bottom: calc(100% + 8px); left: 0; min-width: 132px; background: #1a2440; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 6px; display: none; flex-direction: column; gap: 2px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
        .upload-menu.show { display: flex; }
        .upload-menu button { display: flex; align-items: center; gap: 8px; background: transparent; border: none; color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; text-align: left; white-space: nowrap; }
        .upload-menu button:hover { background: rgba(102,126,234,0.18); }
        .input-box { flex: 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.06); border-radius: 10px; }
        .input-box textarea { width: 100%; padding: 12px 14px; border: none; background: transparent; color: var(--text); font-size: 14px; resize: none; max-height: 120px; outline: none; font-family: inherit; border-radius: 10px; }
        .input-box textarea::placeholder { color: var(--text-dim); }
        .send-btn { padding: 12px 24px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .send-btn:hover:not(:disabled) { box-shadow: 0 4px 12px rgba(102,126,234,0.4); transform: translateY(-1px); }
        .send-btn:active { transform: translateY(0); }
        .send-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .empty-chat { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); text-align: center; }
        .empty-chat-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.6; }
        .empty-chat-text { font-size: 16px; }

        @media (max-width: 900px) { .main { grid-template-columns: 1fr; } .sidebar { display: none; } }
    </style>
    <link rel="stylesheet" href="/static/global_buttons.css">
    <link rel="stylesheet" href="/static/global_pages.css">
</head>
<body>
    <div class="bg-particles"><span></span><span></span><span></span><span></span></div>

    <div class="app">
        <nav class="top-nav">
            <div class="nav-logo"><span>灵智尚人</span></div>
            <span class="nav-tag">剧情演绎</span>
            <div class="nav-spacer"></div>
            <button class="nav-btn nav-btn-danger" onclick="clearChatHistory()"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4 h12"/><path d="M5.5 4 V2.5 h5 V4"/><rect x="3" y="4" width="10" height="11" rx="1.5"/><line x1="6" y1="7.5" x2="6" y2="12"/><line x1="10" y1="7.5" x2="10" y2="12"/></svg>清除记录</button>
            <button class="nav-btn" onclick="doLogout()"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2 H3.5 a1.5 1.5 0 0 0 -1.5 1.5 v9 a1.5 1.5 0 0 0 1.5 1.5 H9"/><path d="M12 5 L15.5 8 L12 11"/><line x1="6.5" y1="8" x2="15" y2="8"/></svg>退出登录</button>
            <a href="/" target="_top" class="nav-btn nav-btn-primary"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 L4 8 L10 13"/><line x1="4.5" y1="8" x2="15" y2="8"/></svg>返回首页</a>
        </nav>

        <div class="main">
            <!-- 左侧场景栏 -->
            <aside class="sidebar">
                <div class="sidebar-head">
                    <div class="sidebar-title">🎬 场景列表</div>
                    <div class="sidebar-actions">
                        <button class="mini-btn" onclick="document.getElementById('customSection').classList.toggle('open')">+ 自定义</button>
                        <a class="mini-btn" href="/scenario-demo">沉浸版</a>
                    </div>
                </div>
                <div class="sidebar-body">
                    <!-- 沉浸式剧情入口 -->
                    <div class="immersive-entry">
                        <div class="title"><span class="badge">NEW</span> 沉浸式剧情演绎</div>
                        <div class="desc">全屏场景 + 步骤引导 + 毛玻璃剧情面板，效果更逼真。</div>
                        <a href="/scenario-demo" class="go">立即体验 →</a>
                    </div>

                    <!-- 自定义场景 -->
                    <div class="custom-section" id="customSection">
                        <div class="custom-title" onclick="document.getElementById('customSection').classList.toggle('open')">✏️ 创建自定义场景 <span>▼</span></div>
                        <div class="custom-body">
                            <div class="input-group"><label>场景标题</label><input type="text" id="customTitle" placeholder="例如：数据中心网络运维工程师"></div>
                            <div class="input-group"><label>场景描述</label><textarea id="customDescription" placeholder="描述你想体验的工作场景，例如：你是一名数据中心的网络运维工程师，今天负责排查服务器连接中断的问题..."></textarea></div>
                            <div class="input-group"><label>预期任务（每行一个，可选）</label><textarea id="customTasks" placeholder="1. 检查网络设备状态&#10;2. 分析网络拓扑&#10;3. 提出解决方案"></textarea></div>
                            <button class="start-custom-btn" onclick="startCustomScenario()">🚀 开始自定义场景</button>
                        </div>
                    </div>

                    <div id="scenariosList">
                        <div class="empty-chat"><div class="empty-chat-icon">📖</div><div class="empty-chat-text">加载中...</div></div>
                    </div>
                </div>
            </aside>

            <!-- 右侧聊天 -->
            <section class="chat-panel">
                <div class="scenario-info-bar">
                    <span class="label">当前场景：</span>
                    <span class="name" id="currentScenarioName">未选择</span>
                    <span class="tasks" id="currentTasks"></span>
                </div>
                <div class="chat-header">
                    <div class="chat-icon"><img src="/static/avatar_t4_gradient.svg" alt="AI"></div>
                    <div><div class="chat-title">灵智尚人</div><div class="chat-subtitle">职业导师</div></div>
                </div>
                <div class="messages-area" id="messagesArea">
                    <div class="empty-chat" id="emptyState"><div class="empty-chat-icon">🎯</div><div class="empty-chat-text">从左侧选择一个剧情开始吧！</div></div>
                </div>
                <div class="input-area" id="inputArea" style="display: none;">
                    <img id="imagePreview" class="image-preview" src="" alt="预览">
                    <input type="file" id="imageUpload" style="display: none;" accept="image/*">
                    <input type="file" id="fileTextUpload" style="display: none;" accept=".txt,.md,.csv,.json,.log,text/plain">
                    <div class="upload-menu-wrap">
                        <button class="upload-btn" id="uploadPlusBtn" type="button" title="上传"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg></button>
                        <div class="upload-menu" id="uploadMenu">
                            <button type="button" data-act="image"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2.5" width="14" height="11" rx="2"/><circle cx="5" cy="6.5" r="1.4"/><path d="M1.5 11.5 L5.5 8 L8 10.5 L11 7.5 L14.5 11"/></svg>上传图片</button>
                            <button type="button" data-act="file"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.5 h6 l3 3 v10 h-9 z"/><path d="M9.5 1.5 v3 h3"/></svg>上传文件</button>
                        </div>
                    </div>
                    <div class="input-box"><textarea id="userInput" placeholder="请输入...（按Enter发送，Shift+Enter换行）" rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize()"></textarea></div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
                </div>
            </section>
        </div>
    </div>

    <script>
        let selectedScenario = null;
        let isGenerating = false;
        let chatHistory = [];
        let scenarioRequestSeq = 0;
        let selectedImage = null;
        let imageUpload = document.getElementById('imageUpload');
        let imagePreview = document.getElementById('imagePreview');

        // 本地存储：每位工程师（场景）各自保存独立对话，切换工程师即新建/打开其对话
        const STORAGE_PREFIX = 'lingzhi_scenario_conv_';
        const CURRENT_SCENARIO_KEY = 'lingzhi_scenario_current';
        function storageKeyFor(scenarioId) {
            return STORAGE_PREFIX + (scenarioId === undefined || scenarioId === null || scenarioId === '' ? 'default' : scenarioId);
        }

        // 图片上传处理
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (!file.type.startsWith('image/')) {
                    alert('请选择图片文件！');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedImage = event.target.result;
                    imagePreview.src = selectedImage;
                    imagePreview.style.display = 'block';
                    imagePreview.classList.add('show');
                };
                reader.readAsDataURL(file);
            }
        });

        // 删除已选图片
        imagePreview.addEventListener('click', function() {
            if (selectedImage) {
                if (confirm('确定要删除这张图片吗？')) {
                    selectedImage = null;
                    imageUpload.value = '';
                    imagePreview.src = '';
                    imagePreview.style.display = 'none';
                    imagePreview.classList.remove('show');
                }
            }
        });

        // 上传菜单（+ 按钮）：图片 / 文本文件
        (function() {
            const plusBtn = document.getElementById('uploadPlusBtn');
            const uploadMenu = document.getElementById('uploadMenu');
            const fileTextUpload = document.getElementById('fileTextUpload');
            if (!plusBtn || !uploadMenu || !fileTextUpload) return;
            plusBtn.addEventListener('click', function(e) { e.stopPropagation(); uploadMenu.classList.toggle('show'); });
            uploadMenu.addEventListener('click', function(e) { e.stopPropagation(); });
            document.addEventListener('click', function() { uploadMenu.classList.remove('show'); });
            uploadMenu.querySelector('[data-act="image"]').addEventListener('click', function() {
                uploadMenu.classList.remove('show');
                document.getElementById('imageUpload').click();
            });
            uploadMenu.querySelector('[data-act="file"]').addEventListener('click', function() {
                uploadMenu.classList.remove('show');
                fileTextUpload.click();
            });
            fileTextUpload.addEventListener('change', function() {
                const f = this.files[0];
                if (!f) return;
                if (f.size > 200 * 1024) { alert('文件过大，仅支持 200KB 以内的文本文件'); this.value = ''; return; }
                const reader = new FileReader();
                reader.onload = function() {
                    const ta = document.getElementById('userInput');
                    ta.value = (ta.value ? ta.value + '\n' : '') + '【文件：' + f.name + '】\n' + reader.result;
                    if (typeof autoResize === 'function') autoResize();
                    ta.focus();
                };
                reader.readAsText(f);
                this.value = '';
            });
        })();

        // 保存当前工程师的聊天记录
        function saveChatHistory() {
            if (!selectedScenario) return;
            try {
                localStorage.setItem(storageKeyFor(selectedScenario.id), JSON.stringify(chatHistory));
            } catch (e) {
                console.error('保存聊天记录失败:', e);
            }
        }

        // 读取指定工程师的聊天记录
        function loadChatHistoryFor(scenarioId) {
            try {
                const saved = localStorage.getItem(storageKeyFor(scenarioId));
                chatHistory = saved ? JSON.parse(saved) : [];
            } catch (e) {
                console.error('加载聊天记录失败:', e);
                chatHistory = [];
            }
        }

        // 清空对话区渲染（保留空状态占位）
        function resetChatView() {
            const messagesArea = document.getElementById('messagesArea');
            Array.from(messagesArea.children).forEach(el => {
                if (el.id !== 'emptyState') el.remove();
            });
            document.getElementById('emptyState').style.display = '';
        }

        // 渲染聊天记录
        function renderChatHistory() {
            resetChatView();
            if (chatHistory.length === 0) return;
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('inputArea').style.display = 'flex';
            chatHistory.forEach(msg => appendMessageEl(msg));
        }

        // 生成当前场景的欢迎语
        function buildWelcomeMessage() {
            let welcomeMessage = `欢迎来到【${selectedScenario.title}】！\n\n${selectedScenario.description}`;
            const tasks = selectedScenario.tasks || [];
            if (tasks.length > 0) {
                welcomeMessage += `\n\n你的目标：\n${tasks.map((task, i) => `${i + 1}. ${task}`).join('\n')}`;
            }
            welcomeMessage += '\n\n让我们开始吧！你可以先告诉我你的想法。';
            return welcomeMessage;
        }

        // 切换工程师：自动新建/打开该工程师的独立对话
        function startConversation() {
            localStorage.setItem(CURRENT_SCENARIO_KEY, JSON.stringify(selectedScenario));
            chatHistory = [];
            updateInfoBar();
            document.getElementById('inputArea').style.display = 'flex';
            loadChatHistoryFor(selectedScenario.id);
            if (chatHistory.length > 0) {
                // 该工程师已有历史对话：恢复原对话
                renderChatHistory();
            } else {
                // 新对话：仅显示欢迎语
                resetChatView();
                document.getElementById('emptyState').style.display = 'none';
                addMessage(buildWelcomeMessage(), false);
            }
        }

        // 清除当前工程师的聊天记录（不影响其他工程师）
        function clearChatHistory() {
            if (!selectedScenario) {
                alert('请先从左侧选择一个工程师！');
                return;
            }
            if (confirm(`确定要清除【${selectedScenario.title}】的聊天记录吗？`)) {
                chatHistory = [];
                localStorage.removeItem(storageKeyFor(selectedScenario.id));
                resetChatView();
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('inputArea').style.display = 'flex';
                addMessage(buildWelcomeMessage(), false);
            }
        }

        // 退出登录
        function doLogout() {
            if (confirm('确定要退出登录吗？')) {
                fetch('/logout', { method: 'POST' })
                    .then(() => { window.location.href = '/'; })
                    .catch(() => { window.location.href = '/'; });
            }
        }

        // 更新场景信息条
        function updateInfoBar() {
            if (selectedScenario) {
                document.getElementById('currentScenarioName').textContent = selectedScenario.title;
                const tasks = selectedScenario.tasks || [];
                document.getElementById('currentTasks').textContent = tasks.length + ' 个目标';
            }
        }

        // 加载场景列表
        async function loadScenarios() {
            try {
                const response = await fetch('/scenarios');
                const data = await response.json();
                const list = data.scenarios || [];
                renderScenarios(list);
                return list;
            } catch (error) {
                console.error('加载场景失败:', error);
                document.getElementById('scenariosList').innerHTML = `
                    <div class="empty-chat">
                        <div class="empty-chat-icon">❌</div>
                        <div class="empty-chat-text">加载失败</div>
                    </div>
                `;
                return [];
            }
        }

        // 渲染场景列表
        function renderScenarios(scenarios) {
            const container = document.getElementById('scenariosList');
            if (scenarios.length === 0) {
                container.innerHTML = `
                    <div class="empty-chat">
                        <div class="empty-chat-icon">📭</div>
                        <div class="empty-chat-text">暂无剧情</div>
                    </div>
                `;
                return;
            }
            container.innerHTML = scenarios.map(scenario => `
                <div class="scenario-card" data-id="${scenario.id}" onclick="selectScenario(${scenario.id})">
                    <div class="scenario-header">
                        <div class="scenario-title">${scenario.title}</div>
                        <span class="difficulty-badge ${getDifficultyClass(scenario.difficulty)}">${scenario.difficulty}</span>
                    </div>
                    <div class="scenario-description">${scenario.description}</div>
                    <div class="scenario-tasks">
                        ${scenario.tasks.map(task => `<div class="task-item">${task}</div>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 获取难度对应的样式类
        function getDifficultyClass(difficulty) {
            if (difficulty === '简单') return 'simple';
            if (difficulty === '中等') return 'medium';
            return 'hard';
        }

        // 开始自定义场景
        async function startCustomScenario() {
            const title = document.getElementById('customTitle').value.trim();
            const description = document.getElementById('customDescription').value.trim();
            const tasksText = document.getElementById('customTasks').value.trim();
            if (!title) { alert('请输入场景标题！'); return; }
            if (!description) { alert('请输入场景描述！'); return; }
            const tasks = tasksText.split('\n').filter(task => task.trim()).map(task => task.trim());
            const customScenario = {
                id: 'custom_' + Date.now(),
                title: title,
                description: description,
                tasks: tasks.length > 0 ? tasks : ['探索这个场景', '提出你的想法'],
                is_custom: true
            };
            document.querySelectorAll('.scenario-card').forEach(card => { card.classList.remove('active'); });
            selectedScenario = customScenario;
            startConversation();
        }

        // 选择场景：切换工程师时自动新建/打开该工程师的独立对话
        async function selectScenario(scenarioId) {
            // 重复点击当前工程师：保持当前对话不变
            if (selectedScenario && String(selectedScenario.id) === String(scenarioId)) {
                document.querySelectorAll('.scenario-card').forEach(card => { card.classList.remove('active'); });
                const current = document.querySelector(`.scenario-card[data-id="${scenarioId}"]`);
                if (current) current.classList.add('active');
                return;
            }
            document.querySelectorAll('.scenario-card').forEach(card => { card.classList.remove('active'); });
            const card = document.querySelector(`.scenario-card[data-id="${scenarioId}"]`);
            if (card) card.classList.add('active');
            const requestSeq = ++scenarioRequestSeq;
            try {
                const response = await fetch('/start-scenario', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scenario_id: scenarioId })
                });
                const data = await response.json();
                if (data.success && requestSeq === scenarioRequestSeq) {
                    selectedScenario = data.scenario;
                    startConversation();
                }
            } catch (error) {
                console.error('开始场景失败:', error);
            }
        }

        // 添加消息（写入历史并渲染）
        function addMessage(content, isUser, imageBase64 = null) {
            chatHistory.push({
                content: content,
                isUser: isUser,
                image: imageBase64,
                timestamp: Date.now()
            });
            saveChatHistory();
            return appendMessageEl({ content: content, isUser: isUser, image: imageBase64 });
        }

        // 仅渲染单条消息（不写入历史，用于恢复历史对话）
        function appendMessageEl(msg) {
            const content = msg.content;
            const isUser = msg.isUser;
            const imageBase64 = msg.image;
            const messagesArea = document.getElementById('messagesArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (isUser ? 'user' : 'assistant');
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            if (isUser) {
                avatar.textContent = '👤';
                avatar.style.background = 'linear-gradient(135deg, var(--accent), var(--accent-2))';
                avatar.style.color = 'white';
            } else {
                const img = document.createElement('img');
                img.src = '/static/avatar_t4_gradient.svg';
                img.alt = 'AI';
                avatar.appendChild(img);
            }
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            let htmlContent = formatMessage(content);
            if (imageBase64) {
                htmlContent = `<img src="data:image/png;base64,${imageBase64}" alt="图片" style="max-width: 100%; border-radius: 8px; margin-bottom: 10px;">` + htmlContent;
            }
            const aiGenTag = isUser ? '' : '<div class="ai-gen-tag" style="font-size:11px;color:#8fa3c7;margin-bottom:4px;">✨ AI 生成内容</div>';
            contentDiv.innerHTML = aiGenTag + htmlContent;

            // AI消息操作按钮（追问/复制）
            if (!isUser && content) {
                const actionsDiv = document.createElement('div');
                actionsDiv.style.display = 'flex';
                actionsDiv.style.gap = '8px';
                actionsDiv.style.marginTop = '12px';
                actionsDiv.style.opacity = '0';
                actionsDiv.style.transition = 'opacity 0.2s';
                const followBtn = document.createElement('button');
                followBtn.style.padding = '6px 14px';
                followBtn.style.background = 'rgba(255,255,255,0.1)';
                followBtn.style.border = '1px solid rgba(255,255,255,0.15)';
                followBtn.style.borderRadius = '16px';
                followBtn.style.fontSize = '13px';
                followBtn.style.cursor = 'pointer';
                followBtn.style.color = '#8fa3c7';
                followBtn.style.transition = 'all 0.2s';
                followBtn.innerHTML = '🔄 追问';
                followBtn.onclick = function() {
                    const userInput = document.getElementById('userInput');
                    userInput.value = `针对你的回答，我想追问：${content.substring(0, 50)}...`;
                    userInput.style.height = 'auto';
                    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
                    userInput.focus();
                    userInput.scrollTop = userInput.scrollHeight;
                };
                followBtn.addEventListener('mouseenter', () => { followBtn.style.background = 'linear-gradient(135deg, #667eea, #764ba2)'; followBtn.style.color = 'white'; followBtn.style.border = 'none'; });
                followBtn.addEventListener('mouseleave', () => { followBtn.style.background = 'rgba(255,255,255,0.1)'; followBtn.style.color = '#8fa3c7'; followBtn.style.border = '1px solid rgba(255,255,255,0.15)'; });

                const copyBtn = document.createElement('button');
                copyBtn.style.padding = '6px 14px';
                copyBtn.style.background = 'rgba(255,255,255,0.1)';
                copyBtn.style.border = '1px solid rgba(255,255,255,0.15)';
                copyBtn.style.borderRadius = '16px';
                copyBtn.style.fontSize = '13px';
                copyBtn.style.cursor = 'pointer';
                copyBtn.style.color = '#8fa3c7';
                copyBtn.style.transition = 'all 0.2s';
                copyBtn.innerHTML = '📋 复制';
                copyBtn.onclick = function() {
                    const done = () => { copyBtn.innerHTML = '✓ 已复制'; setTimeout(() => { copyBtn.innerHTML = '📋 复制'; }, 2000); };
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(content).then(done);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = content; ta.style.position = 'fixed'; ta.style.opacity = '0';
                        document.body.appendChild(ta); ta.select();
                        try { document.execCommand('copy'); } catch (e) {}
                        document.body.removeChild(ta); done();
                    }
                };
                copyBtn.addEventListener('mouseenter', () => { copyBtn.style.background = 'linear-gradient(135deg, #667eea, #764ba2)'; copyBtn.style.color = 'white'; copyBtn.style.border = 'none'; });
                copyBtn.addEventListener('mouseleave', () => { copyBtn.style.background = 'rgba(255,255,255,0.1)'; copyBtn.style.color = '#8fa3c7'; copyBtn.style.border = '1px solid rgba(255,255,255,0.15)'; });

                actionsDiv.appendChild(followBtn);
                actionsDiv.appendChild(copyBtn);
                contentDiv.appendChild(actionsDiv);
                messageDiv.addEventListener('mouseenter', () => { actionsDiv.style.opacity = '1'; });
                messageDiv.addEventListener('mouseleave', () => { actionsDiv.style.opacity = '0'; });
            }
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesArea.appendChild(messageDiv);
            scrollToBottom();
            return contentDiv;
        }

        // 格式化消息
        function formatMessage(content) {
            return content
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/\n/g, '<br>');
        }

        // 添加打字指示器
        function addTypingIndicator() {
            const messagesArea = document.getElementById('messagesArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'typingIndicator';
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            const img = document.createElement('img');
            img.src = '/static/avatar_t4_gradient.svg';
            img.alt = 'AI';
            avatar.appendChild(img);
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content typing-indicator';
            contentDiv.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesArea.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        // 移除打字指示器
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // 滚动到底部
        function scrollToBottom() {
            const messagesArea = document.getElementById('messagesArea');
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // 发送消息
        async function sendMessage() {
            if (isGenerating) return;
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message && !selectedImage) {
                addMessage('请描述这张图片', true, selectedImage);
            } else if (!message) {
                return;
            } else {
                addMessage(message, true, selectedImage);
            }
            input.value = '';
            input.style.height = 'auto';
            selectedImage = null;
            imagePreview.src = '';
            imagePreview.style.display = 'none';
            imagePreview.classList.remove('show');
            imageUpload.value = '';
            setInputDisabled(true);
            addTypingIndicator();
            isGenerating = true;
            try {
                const requestBody = {
                    message: message,
                    image: selectedImage,
                    is_scenario: true,
                    stream: true
                };
                if (selectedScenario) {
                    requestBody.scenario_info = {
                        title: selectedScenario.title,
                        description: selectedScenario.description,
                        tasks: selectedScenario.tasks || []
                    };
                }
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                if (!response.ok) throw new Error('请求失败');
                removeTypingIndicator();
                const messageContentDiv = addMessage('', false);
                const aiMsgIndex = chatHistory.length - 1;
                let _streamRaw = '';
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.content) {
                                    _streamRaw += data.content;
                                    messageContentDiv.innerHTML = '<div class="ai-gen-tag" style="font-size:11px;color:#8fa3c7;margin-bottom:4px;">✨ AI 生成内容</div>' + formatMessage(_streamRaw);
                                    scrollToBottom();
                                } else if (data.error) {
                                    messageContentDiv.innerHTML = '<div class="ai-gen-tag" style="font-size:11px;color:#8fa3c7;margin-bottom:4px;">✨ AI 生成内容</div>' + data.error;
                                }
                            } catch (e) {}
                        }
                    }
                }
                // 把流式回复写回当前工程师的对话记录，切换回来时可完整恢复
                if (_streamRaw) {
                    chatHistory[aiMsgIndex].content = _streamRaw;
                } else {
                    chatHistory.splice(aiMsgIndex, 1);
                }
                saveChatHistory();
            } catch (error) {
                removeTypingIndicator();
                addMessage('请求出错，请稍后重试', false);
            } finally {
                isGenerating = false;
                setInputDisabled(false);
                input.focus();
            }
        }

        // 设置输入框禁用状态
        function setInputDisabled(disabled) {
            document.getElementById('userInput').disabled = disabled;
            document.getElementById('sendBtn').disabled = disabled;
            const _up = document.getElementById('uploadPlusBtn');
            if (_up) { _up.disabled = disabled; if (disabled) document.getElementById('uploadMenu').classList.remove('show'); }
        }

        // 处理键盘事件
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 自动调整输入框高度
        function autoResize() {
            const input = document.getElementById('userInput');
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        }

        // 恢复上次选择的工程师及其对话
        async function restoreLastConversation(scenarios) {
            try {
                const raw = localStorage.getItem(CURRENT_SCENARIO_KEY);
                if (!raw) return;
                const savedScenario = JSON.parse(raw);
                const builtin = scenarios.find(s => String(s.id) === String(savedScenario.id));
                if (builtin) {
                    selectScenario(builtin.id);
                } else if (savedScenario.is_custom && savedScenario.title) {
                    selectedScenario = savedScenario;
                    startConversation();
                } else {
                    localStorage.removeItem(CURRENT_SCENARIO_KEY);
                }
            } catch (e) {
                console.error('恢复上次对话失败:', e);
            }
        }

        // 初始化
        (async function initScenarioPage() {
            const scenarios = await loadScenarios();
            await restoreLastConversation(scenarios);
        })();
    </script>
