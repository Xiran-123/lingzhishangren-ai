<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5G簇优化验证 - 灵智尚人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #071521;
            --bg2: #0b2233;
            --panel: rgba(13, 33, 52, .92);
            --panel2: rgba(18, 43, 66, .96);
            --line: rgba(77, 216, 255, .16);
            --line2: rgba(77, 216, 255, .34);
            --cyan: #4dd8ff;
            --cyan2: #00c8ff;
            --text: #e6f3ff;
            --muted: #7ea6c6;
            --green: #4ade80;
            --gold: #ffd66b;
            --red: #ff6b6b;
            --radius: 12px;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
            background:
                radial-gradient(1100px 620px at 78% -12%, rgba(0, 160, 255, .16), transparent 62%),
                radial-gradient(760px 520px at 4% 104%, rgba(0, 200, 190, .1), transparent 60%),
                var(--bg);
        }

        /* ============ 左侧任务清单 ============ */
        .side {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--line);
            background: rgba(8, 24, 38, .72);
            backdrop-filter: blur(10px);
            min-height: 0;
        }

        .brand {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--line);
        }

        .brand a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            text-decoration: none;
            font-size: 12px;
            margin-bottom: 12px;
            transition: color .2s;
        }

        .brand a:hover { color: var(--cyan); }

        .brand h1 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: .5px;
            line-height: 1.45;
        }

        .brand h1 span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .stat-row {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--line);
        }

        .stat {
            flex: 1;
            background: rgba(0, 200, 255, .05);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 9px 10px;
            text-align: center;
        }

        .stat b {
            display: block;
            font-size: 18px;
            color: var(--cyan);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stat span { font-size: 11px; color: var(--muted); }

        .task-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 8px;
            min-height: 0;
        }

        .task-list::-webkit-scrollbar { width: 5px; }
        .task-list::-webkit-scrollbar-thumb { background: rgba(77, 216, 255, .22); border-radius: 3px; }

        .titem {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background .18s, border-color .18s;
        }

        .titem:hover:not(.locked) { background: rgba(77, 216, 255, .06); }

        .titem.active {
            background: rgba(77, 216, 255, .1);
            border-color: var(--line2);
        }

        .titem.locked { cursor: not-allowed; opacity: .42; }

        .tnum {
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 600;
            background: rgba(126, 166, 198, .16);
            color: var(--muted);
            margin-top: 1px;
        }

        .titem.active .tnum { background: var(--cyan); color: #062032; }
        .titem.done .tnum { background: rgba(74, 222, 128, .18); color: var(--green); }

        .tinfo { min-width: 0; flex: 1; }
        .tinfo b {
            display: block;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tinfo i {
            display: block;
            font-style: normal;
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px;
        }

        .side-foot {
            padding: 12px 16px 16px;
            border-top: 1px solid var(--line);
        }

        /* ============ 右侧主区 ============ */
        .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

        .top {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 28px;
            border-bottom: 1px solid var(--line);
            background: rgba(8, 24, 38, .55);
        }

        .top-title { font-size: 14px; font-weight: 500; }
        .top-title small {
            display: block;
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
            margin-top: 3px;
        }

        .bar {
            flex: 1;
            height: 6px;
            background: rgba(126, 166, 198, .16);
            border-radius: 99px;
            overflow: hidden;
            min-width: 80px;
        }

        .bar i {
            display: block;
            height: 100%;
            width: 0;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--cyan2), var(--green));
            transition: width .45s cubic-bezier(.2, .8, .2, 1);
        }

        .clock {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px 12px;
            min-height: 0;
        }

        .body::-webkit-scrollbar { width: 7px; }
        .body::-webkit-scrollbar-thumb { background: rgba(77, 216, 255, .2); border-radius: 4px; }

        .foot {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            border-top: 1px solid var(--line);
            background: rgba(8, 24, 38, .72);
        }

        .foot-tip { font-size: 12px; color: var(--muted); flex: 1; }
        .foot-tip.warn { color: var(--gold); }

        /* ============ 通用组件 ============ */
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 16px;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .card-head h2 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .3px;
        }

        .card-head h2 em {
            font-style: normal;
            color: var(--cyan);
            margin-right: 8px;
        }

        .muted { color: var(--muted); }
        .small { font-size: 12px; }

        .task-desc {
            background: rgba(0, 200, 255, .045);
            border: 1px solid var(--line);
            border-left: 3px solid var(--cyan);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 18px;
            font-size: 13px;
            line-height: 1.85;
        }

        .task-desc p { margin-bottom: 6px; }
        .task-desc p:last-child { margin-bottom: 0; }
        .task-desc b { color: var(--cyan); font-weight: 500; }

        .kv {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
            gap: 10px;
        }

        .kv-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 13px;
            background: rgba(255, 255, 255, .025);
            border: 1px solid rgba(77, 216, 255, .1);
            border-radius: 8px;
            font-size: 13px;
        }

        .kv-item span { color: var(--muted); white-space: nowrap; }
        .kv-item b { font-weight: 500; font-variant-numeric: tabular-nums; }
        .kv-item.ok { border-color: rgba(74, 222, 128, .4); background: rgba(74, 222, 128, .06); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 20px;
            border-radius: 8px;
            border: 1px solid var(--line2);
            background: rgba(77, 216, 255, .08);
            color: var(--cyan);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all .18s;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) { background: rgba(77, 216, 255, .16); border-color: var(--cyan); }
        .btn:disabled { opacity: .38; cursor: not-allowed; }

        .btn.primary {
            background: linear-gradient(135deg, #00a8e8, #00c8ff);
            border-color: transparent;
            color: #03202f;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(0, 180, 255, .22);
        }

        .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
        .btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
        .btn.ghost:hover:not(:disabled) { color: var(--cyan); border-color: var(--line2); background: rgba(77, 216, 255, .06); }
        .btn.sm { padding: 6px 12px; font-size: 12px; }

        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(4, 16, 26, .8);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color .18s;
            font-variant-numeric: tabular-nums;
        }

        input:focus, select:focus { border-color: var(--cyan); }
        input::placeholder { color: rgba(126, 166, 198, .5); }
        select option { background: #0b2233; }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

        /* ============ 设备卡片 ============ */
        .dev-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

        .dev {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, .02);
            cursor: pointer;
            transition: all .18s;
        }

        .dev:hover { border-color: var(--line2); background: rgba(77, 216, 255, .05); }
        .dev.open { border-color: var(--line2); background: rgba(77, 216, 255, .07); }

        .dev-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .dev-name { font-size: 13px; font-weight: 500; }

        .dot {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--green);
        }

        .dot i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        .dot.bad { color: var(--red); }
        .dot.bad i { background: var(--red); box-shadow: 0 0 8px var(--red); }

        .dev-body {
            display: none;
            border-top: 1px dashed rgba(77, 216, 255, .16);
            margin-top: 10px;
            padding-top: 10px;
        }

        .dev.open .dev-body { display: block; }

        .dev-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 4px 0;
            color: var(--muted);
        }

        .dev-row b { color: var(--text); font-weight: 500; }

        /* ============ 告警列表 ============ */
        .alarm {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid rgba(77, 216, 255, .1);
            background: rgba(255, 255, 255, .02);
            margin-bottom: 8px;
            font-size: 12.5px;
        }

        .alarm.active { border-color: rgba(255, 107, 107, .38); background: rgba(255, 107, 107, .07); }

        .alarm-time { color: var(--muted); font-variant-numeric: tabular-nums; }
        .alarm-name { flex: 1; }
        .alarm-state { font-size: 11px; color: var(--green); }
        .alarm.active .alarm-state { color: var(--red); }

        /* ============ 工具清单 ============ */
        .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

        .tool {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: rgba(255, 255, 255, .02);
            cursor: pointer;
            transition: all .16s;
            font-size: 13px;
        }

        .tool:hover { border-color: var(--line2); }

        .tool.on {
            border-color: rgba(74, 222, 128, .45);
            background: rgba(74, 222, 128, .07);
        }

        .tick {
            flex: 0 0 18px;
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 1.5px solid rgba(126, 166, 198, .45);
            display: grid;
            place-items: center;
            font-size: 11px;
            color: transparent;
            transition: all .16s;
        }

        .tool.on .tick {
            background: var(--green);
            border-color: var(--green);
            color: #052b16;
            font-weight: 700;
        }

        /* 待确认（参数已核对完，但尚未勾选阅读确认） */
        .tool.ready {
            border-color: rgba(77, 216, 255, .55);
            background: rgba(77, 216, 255, .06);
            animation: readyPulse 1.9s ease-in-out infinite;
        }

        .tool.ready .tick { border-color: var(--cyan); }

        .tool.locked { opacity: .5; }

        @keyframes readyPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(77, 216, 255, 0); }
            50% { box-shadow: 0 0 0 3px rgba(77, 216, 255, .12); }
        }

        /* 错误选型 */
        .tool.bad {
            border-color: rgba(255, 107, 107, .55);
            background: rgba(255, 107, 107, .08);
        }

        .tool.bad .tick {
            background: var(--red);
            border-color: var(--red);
            color: #2b0505;
            font-weight: 700;
        }

        .sel-tip {
            font-size: 12px;
            line-height: 1.7;
            color: var(--muted);
            background: rgba(77, 216, 255, .05);
            border-left: 3px solid rgba(77, 216, 255, .35);
            border-radius: 6px;
            padding: 9px 12px;
            margin-bottom: 12px;
        }

        .sel-err {
            font-size: 12px;
            line-height: 1.7;
            color: #ffc9c9;
            background: rgba(255, 107, 107, .09);
            border: 1px solid rgba(255, 107, 107, .35);
            border-radius: 6px;
            padding: 9px 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sel-err b { color: var(--red); }

        .sel-err .pen {
            margin-left: auto;
            font-weight: 700;
            color: var(--red);
            white-space: nowrap;
        }

        /* ============ 地图 ============ */
        .map-wrap {
            position: relative;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            background:
                linear-gradient(rgba(77, 216, 255, .05) 1px, transparent 1px) 0 0 / 100% 34px,
                linear-gradient(90deg, rgba(77, 216, 255, .05) 1px, transparent 1px) 0 0 / 34px 100%,
                #061320;
            height: 260px;
        }

        .map-svg { width: 100%; height: 100%; display: block; }

        .route-line {
            stroke: var(--cyan);
            stroke-width: 2.5;
            fill: none;
            stroke-dasharray: 8 6;
            stroke-dashoffset: 420;
            transition: stroke-dashoffset 1.4s ease;
        }

        .route-line.show { stroke-dashoffset: 0; }

        .map-meta {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: rgba(4, 16, 26, .88);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 11.5px;
            color: var(--muted);
            line-height: 1.7;
        }

        .map-meta b { color: var(--cyan); }

        /* ============ 数据表 ============ */
        table.dt {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
        }

        table.dt th {
            text-align: left;
            font-weight: 500;
            color: var(--muted);
            font-size: 11.5px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        table.dt td {
            padding: 7px 10px;
            border-bottom: 1px solid rgba(77, 216, 255, .07);
            vertical-align: middle;
        }

        table.dt tr:last-child td { border-bottom: none; }

        table.dt input {
            padding: 7px 9px;
            font-size: 12.5px;
            text-align: right;
        }

        .pass { color: var(--green); }
        .fail { color: var(--red); }
        .wait { color: var(--muted); }

        /* ============ 切换信令 ============ */
        .sig {
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 12px;
            line-height: 2;
            background: rgba(4, 16, 26, .75);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--muted);
            max-height: 168px;
            overflow-y: auto;
        }

        .sig div { opacity: 0; animation: fadeIn .3s forwards; }
        .sig div b { color: var(--cyan); font-weight: 500; }
        .sig div.ok { color: var(--green); }

        @keyframes fadeIn { to { opacity: 1; } }

        /* ============ 报告 ============ */
        .rep-head {
            text-align: center;
            padding: 22px 0 16px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 18px;
        }

        .rep-head h2 { font-size: 19px; font-weight: 600; letter-spacing: 1px; }
        .rep-head p { font-size: 12px; color: var(--muted); margin-top: 8px; }

        .rep-score {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            margin-top: 14px;
        }

        .rep-score b {
            font-size: 42px;
            font-weight: 600;
            color: var(--cyan);
            font-variant-numeric: tabular-nums;
        }

        .rep-score span { font-size: 13px; color: var(--muted); }

        .rep-block { margin-bottom: 20px; }

        .rep-block h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--cyan);
            margin-bottom: 10px;
            padding-left: 9px;
            border-left: 3px solid var(--cyan);
        }

        /* ============ 提示条 ============ */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 88px;
            transform: translate(-50%, 14px);
            background: rgba(8, 26, 40, .97);
            border: 1px solid var(--line2);
            border-radius: 9px;
            padding: 11px 20px;
            font-size: 13px;
            color: var(--text);
            opacity: 0;
            pointer-events: none;
            transition: all .25s;
            z-index: 99;
            max-width: 80vw;
            text-align: center;
        }

        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast.err { border-color: rgba(255, 107, 107, .5); color: #ffc9c9; }
        .toast.ok { border-color: rgba(74, 222, 128, .5); color: #c6f8d8; }

        .empty { text-align: center; padding: 40px 0; color: var(--muted); font-size: 13px; }

        @media (max-width: 980px) {
            .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .side { flex-direction: row; align-items: center; border-right: none; border-bottom: 1px solid var(--line); overflow-x: auto; }
            .brand, .stat-row, .side-foot { border: none; padding: 12px 16px; }
            .brand h1 span { display: none; }
            .task-list { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; }
            .titem { margin-bottom: 0; white-space: nowrap; }
            .tinfo i { display: none; }
            .grid3, .dev-grid { grid-template-columns: 1fr; }
            .grid2 { grid-template-columns: 1fr; }
            .body { padding: 16px; }
            .top, .foot { padding: 12px 16px; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="side">
        <div class="brand">
            <a href="/">&#8592; 返回首页</a>
            <h1>5G 簇优化验证<span>CLUSTER OPTIMIZATION</span></h1>
        </div>
        <div class="stat-row">
            <div class="stat"><b id="statDone">0/10</b><span>任务完成</span></div>
            <div class="stat"><b id="statScore">0</b><span>实训得分</span></div>
        </div>
        <div class="task-list" id="taskList"></div>
        <div class="side-foot">
            <button class="btn ghost sm" style="width:100%" onclick="resetAll()">重新开始实训</button>
        </div>
    </aside>

    <main class="main">
        <div class="top">
            <div class="top-title">
                石家庄市某区 · 簇2
                <small id="topSub">簇优化任务清单</small>
            </div>
            <div class="bar"><i id="barFill"></i></div>
            <div class="clock" id="clock"></div>
        </div>
        <div class="body" id="body"></div>
        <div class="foot">
            <div class="foot-tip" id="footTip"></div>
            <button class="btn ghost" id="btnPrev" onclick="prevStep()">上一任务</button>
            <button class="btn primary" id="btnNext" onclick="submitTask()">提交并解锁下一任务</button>
        </div>
    </main>
</div>
<div class="toast" id="toast"></div>

<link rel="stylesheet" href="/static/desktop_pet.css">
<script src="/static/desktop_pet.js" defer></script>

<script>
/* =========================================================
   5G 簇优化（簇2）实训 —— 十步任务状态机
   ========================================================= */

const CLUSTER = {
    name: '石家庄市某区 · 簇2',
    id: 'CLU-2-SJZ',
    type: '车载 DT 路测（夜间）',
    window: '2026-10-20 22:47:52 ~ 2026-10-21 06:47:52',
    owner: '王工（网络优化中心）',
    ticket: 'CLU-2-SJZ-20261020',
    lng: 114.5149,
    lat: 38.0428,
    sites: 12
};

const KPI = { rsrp: -93, sinr: -3, ratio: 90, dl: 500, ul: 40, access: 98, drop: 4, ho: 95 };

const TASKS = [
    { t: '接收簇优化任务通知', s: '核对工单要素' },
    { t: '任务工单解读，明确验证项', s: '覆盖 · 业务 · 协同' },
    { t: '核对路测设备清单', s: 'DT 硬件清点' },

];

const KEY = 'lsr_cluster_v1';
const N = TASKS.length;

const DEFAULT = () => ({
    step: 0,
    done: new Array(N).fill(false),
    score: new Array(N).fill(0),
    d: {
        t1: { checked: [], agreed: false },
        t2: { read: [], quiz: null },
        t3: { ue: '', nb: '', aux: [] },
        t4: { st: {} , gps: false },
        t5: { picked: [] },
        t6: { driver: '', lng: '', lat: '', routed: false },
        t7: { hazards: [], weather: '', ppe: false },
        t8: { pts: new Array(8).fill(null), access: '', drop: '', ho: '' },
        t9: { checked: [], logs: '' },
        t10: { exported: false }
    }
});

let S = load();

function load() {
    try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return DEFAULT();
        const o = JSON.parse(raw);
        const base = DEFAULT();
        const m = Object.assign(base, o, { d: Object.assign(base.d, o.d || {}) });
        m.d.t1 = Object.assign({ checked: [], agreed: false }, m.d.t1 || {});
        m.d.t2 = Object.assign({ read: [], quiz: null }, m.d.t2 || {});
        m.d.t3 = Object.assign({ ue: '', nb: '', aux: [] }, m.d.t3 || {});
        m.d.t4 = Object.assign({ st: {}, gps: false }, m.d.t4 || {});
        m.d.t5 = Object.assign({ picked: [] }, m.d.t5 || {});
        m.d.t6 = Object.assign({ driver: '', lng: '', lat: '', routed: false }, m.d.t6 || {});
        m.d.t7 = Object.assign({ hazards: [], weather: '', ppe: false }, m.d.t7 || {});
        m.d.t8 = Object.assign({ pts: new Array(8).fill(null), access: '', drop: '', ho: '' }, m.d.t8 || {});
        m.d.t9 = Object.assign({ checked: [], logs: '' }, m.d.t9 || {});
        m.d.t10 = Object.assign({ exported: false }, m.d.t10 || {});
        if (!Array.isArray(m.done) || m.done.length !== N) m.done = new Array(N).fill(false);
        if (!Array.isArray(m.score) || m.score.length !== N) m.score = new Array(N).fill(0);
        return m;
    } catch (e) { return DEFAULT(); }
}

function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

/* ---------------- 通用工具 ---------------- */
function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = 'toast'; }, 2600);
}

function unlocked(i) { return i === 0 || S.done[i - 1]; }

function go(step) {
    if (step < 0 || step > N - 1) return;
    if (!unlocked(step)) { toast('请先完成上一个任务', 'err'); return; }
    S.step = step;
    save();
    render();
    document.getElementById('body').scrollTop = 0;
}

function prevStep() { go(S.step - 1); }

function resetAll() {
    if (!confirm('确定要清空本次簇优化实训的全部记录并重新开始吗？')) return;
    S = DEFAULT();
    save();
    render();
    toast('已重置实训进度', 'ok');
}

function head(title, desc) {
    return `<div class="task-desc"><h3 style="font-size:14px;margin-bottom:8px;color:var(--cyan);font-weight:600">${title}</h3>${desc}</div>`;
}

function rerender() {
    document.getElementById('body').innerHTML = renderTask(S.step);
    renderList();
    renderBar();
    bindTask(S.step);
}

/* ---------------- 渲染 ---------------- */
function render() {
    renderList();
    renderBar();
    document.getElementById('body').innerHTML = renderTask(S.step);
    bindTask(S.step);
    renderFoot();
}

function renderList() {
    const box = document.getElementById('taskList');
    box.innerHTML = TASKS.map((tk, i) => {
        const cls = ['titem'];
        if (i === S.step) cls.push('active');
        if (S.done[i]) cls.push('done');
        if (!unlocked(i)) cls.push('locked');
        const num = S.done[i] ? '&#10003;' : (i + 1);
        return `<div class="${cls.join(' ')}" onclick="go(${i})">
            <div class="tnum">${num}</div>
            <div class="tinfo"><b>${esc(tk.t)}</b><i>${esc(tk.s)}</i></div>
        </div>`;
    }).join('');

    document.getElementById('statDone').textContent = S.done.filter(Boolean).length + '/' + N;
    document.getElementById('statScore').textContent = S.score.reduce((a, b) => a + b, 0);
}

function renderBar() {
    const doneCount = S.done.filter(Boolean).length;
    document.getElementById('barFill').style.width = Math.round(doneCount / N * 100) + '%';
    document.getElementById('topSub').textContent =
        S.done[N - 1] ? '实训已完成，可导出报告' : '第 ' + (S.step + 1) + ' / ' + N + ' 项任务 · ' + TASKS[S.step].t;
}

function renderFoot() {
    const tip = document.getElementById('footTip');
    const next = document.getElementById('btnNext');
    const prev = document.getElementById('btnPrev');
    prev.disabled = S.step === 0;
    tip.className = 'foot-tip';
    if (S.done[S.step]) {
        tip.textContent = '本任务已完成';
        tip.classList.add('pass');
        next.textContent = S.step === N - 1 ? '重新生成报告' : '进入下一任务';
    } else {
        tip.textContent = '完成判定条件后即可提交';
        next.textContent = S.step === N - 1 ? '生成并导出报告' : '提交并解锁下一任务';
    }
    next.disabled = false;
}

function renderTask(i) {
    switch (i) {
        case 0: return t1();
        case 1: return t2();
        case 2: return t3();
        case 3: return t4();
        case 4: return t5();
        case 5: return t6();
        case 6: return t7();
        case 7: return t8();
        case 8: return t9();
        case 9: return t10();
    }
    return '';
}

function bindTask(i) {
    if (i === 8) {
        const a = document.getElementById('logNum');
        if (a) a.value = S.d.t9.logs || '';
        const b = document.getElementById('accIn');
        if (b) b.value = S.d.t8.access || '';
        const c = document.getElementById('dropIn');
        if (c) c.value = S.d.t8.drop || '';
        const e = document.getElementById('hoIn');
        if (e) e.value = S.d.t8.ho || '';
    }
    if (i === 2) {
        const u = document.getElementById('ueIn');
        if (u) u.value = S.d.t3.ue || '';
        const nb = document.getElementById('nbIn');
        if (nb) nb.value = S.d.t3.nb || '';
    }
    if (i === 5) {
        ['lngIn', 'latIn'].forEach((id, k) => {
            const el = document.getElementById(id);
            if (el) el.value = k === 0 ? (S.d.t6.lng || '') : (S.d.t6.lat || '');
        });
    }
}

function t1check(k) {
    const arr = S.d.t1.checked || [];

    rerender();
}

function t1agree() {
    if ((S.d.t1.checked || []).length < T1_KEYS.length) {
        toast('请先完成全部 6 项工单要素核对', 'err');
        return;
    }
    S.d.t1.agreed = !S.d.t1.agreed;
    save();
    rerender();
}

   任务 2：任务工单解读，明确验证项
   ========================================================= */
const MODULES = [
    {
        k: 'cover', ic: '📶', name: '覆盖性能验证',
        desc: '采集 SS-RSRP、SS-SINR 采样指标，评估簇内弱覆盖与干扰分布',

    {

        desc: '上下行吞吐率、接入成功率、无线掉线率',
        kpi: `下行 ≥ ${KPI.dl} Mbps，上行 ≥ ${KPI.ul} Mbps，接入成功率 ≥ ${KPI.access}%，掉线率 ≤ ${KPI.drop}%`
    },
    {
        k: '协同', ic: '🔗', name: '4/5G 协同验证',
        desc: '5G 锚点优先驻留、邻区关系优化、切换成功率',
        kpi: `5G 切换成功率 ≥ ${KPI.ho}%，锚点驻留符合策略`
    }
];

const QUIZ = {
    q: '本次簇优化的 SS-SINR 验收门限是多少？',
    opts: ['≥ -3 dB', '≥ 0 dB', '≥ 3 dB'],
    a: 0,
    why: '工单明确 SS-SINR ≥ -3 dB 的采样占比需达到 90% 以上，混淆项是常见的好点门限。'
};

function t2() {
    const read = S.d.t2.read || [];
    const quiz = S.d.t2.quiz;

    const cards = MODULES.map(m => {
        const on = read.indexOf(m.k) >= 0;
        return `<div class="card" style="margin-bottom:12px">
            <div class="card-head"><h2><em>${m.ic}</em>${m.name}</h2>
                <button class="btn sm ${on ? '' : 'ghost'}" onclick="t2read('${m.k}')">${on ? '已解读' : '标记已解读'}</button></div>
            <p class="small muted" style="line-height:1.8">${m.desc}</p>
            <p class="small" style="margin-top:8px;color:var(--gold)">验收标准：${m.kpi}</p>
        </div>`;
    }).join('');

    const opts = QUIZ.opts.map((o, i) => {
        const sel = quiz === i;
        const cls = sel ? (i === QUIZ.a ? 'on' : 'bad') : '';
        return `<div class="tool ${cls}" onclick="t2quiz(${i})"><span class="tick">&#10003;</span><span>${o}</span></div>`;
    }).join('');

    const hint = quiz !== null && quiz !== QUIZ.a
        ? `<div class="sel-err"><b>判断有误：</b>${QUIZ.why}</div>`
        : (quiz === QUIZ.a ? `<div class="sel-tip" style="border-left-color:rgba(74,222,128,.6)">回答正确：SS-SINR 门限为 ≥ -3 dB。</div>` : '');

    return head('任务 2 · 任务工单解读，明确验证项',
        `<p><b>任务描述：</b>解读本次簇优化三大验证模块，熟悉全部 KPI 验收标准。</p>

        <p class="small" style="margin-bottom:10px">${QUIZ.q}</p>
        <div class="tool-grid" style="grid-template-columns:repeat(3,1fr)">${opts}</div>
        ${hint}
    </div>`;
}

function t2read(k) {

}

function t2quiz(i) {

    save();

}

const SELF = [
    { k: 'rf', n: '终端射频功能', d: '发射功率、驻波、频段支持' },

                : `<button class="btn sm ghost" onclick="t4run('${it.k}')">开始自检</button>`);

            <b class="small muted" style="flex:1;margin:0 12px">${it.d}</b>

    const gpsTip = st.gps === 'fail'
        ? `<div class="sel-err"><b>GPS 未定位：</b>搜星数量 0，无法生成轨迹点位。请点击「重新搜星」重试。</div>`

const POINTS = [

function t8() {

        sinr: Math.round((p.base[1] + jit(3)) * 10) / 10,

        ul: Math.round(28 + Math.random() * 26)

    save();
    rerender();
}

function kpiSummary() {
    const pts = S.d.t8.pts || [];
    const got = pts.filter(Boolean);
    const coverN = got.filter(x => x.rsrp >= KPI.rsrp && x.sinr >= KPI.sinr).length;
    const coverRate = got.length ? (coverN / got.length * 100) : 0;
    const acc = parseFloat(S.d.t8.access), drop = parseFloat(S.d.t8.drop), ho = parseFloat(S.d.t8.ho);
    const row = (n, v, ok, std) => `<tr>
        <td class="muted">${n}</td><td>${v}</td><td class="muted">${std}</td>
        <td>${ok == null ? '<span class="small wait">未填报</span>' : (ok ? '<span class="small pass">达标</span>' : '<span class="small fail">不达标</span>')}</td></tr>`;

    return `<table class="dt">
        <thead><tr><th>指标</th><th>实测</th><th>门限</th><th>判定</th></tr></thead>
        <tbody>
            ${row('覆盖达标率（RSRP/SINR 双门限）', got.length ? coverRate.toFixed(1) + '%' : '--', got.length ? coverRate >= KPI.ratio : null, '≥ ' + KPI.ratio + '%')}
            ${row('RRC 接入成功率', isFinite(acc) ? acc + '%' : '--', isFinite(acc) ? acc >= KPI.access : null, '≥ ' + KPI.access + '%')}
            ${row('无线掉线率', isFinite(drop) ? drop + '%' : '--', isFinite(drop) ? drop <= KPI.drop : null, '≤ ' + KPI.drop + '%')}
            ${row('5G 切换成功率', isFinite(ho) ? ho + '%' : '--', isFinite(ho) ? ho >= KPI.ho : null, '≥ ' + KPI.ho + '%')}
        </tbody></table>`;
}

/* ---------------- 提交与计分 ---------------- */
function submitTask() {
    const i = S.step;

    if (i === 9) { exportReport(); return; }
    if (S.done[i]) { go(i + 1); return; }

    let sc = 0, msg = '';

    if (i === 0) {
        if ((S.d.t1.checked || []).length < T1_KEYS.length) { toast('请先完成全部 6 项工单要素核对', 'err'); return; }
        if (!S.d.t1.agreed) { toast('请先点击下方「已阅读任务通知」确认框完成阅读确认', 'err'); return; }
        sc = 10; msg = '工单已接收，要素核对完成，得 10 分';
    }

    if (i === 1) {
        const d = S.d.t2;
        if ((d.read || []).length < MODULES.length) { toast('请先完成三大验证模块的解读', 'err'); return; }
        if (d.quiz === null) { toast('请完成门限判断题', 'err'); return; }
        if (d.quiz !== QUIZ.a) { toast('判断有误：SS-SINR 门限为 ≥ -3 dB，请重新选择', 'err'); return; }
        sc = 10; msg = '验证项解读完成，KPI 门限掌握正确，得 10 分';
    }

    if (i === 2) {
        const d = S.d.t3;
        if (parseInt(d.ue, 10) !== 4) { toast('5G 测试终端数量应为 4 台', 'err'); return; }
        if (parseInt(d.nb, 10) !== 1) { toast('路测分析笔记本数量应为 1 台', 'err'); return; }
        if ((d.aux || []).length < AUX.length) { toast('辅助外设还有未勾选项', 'err'); return; }
        sc = 10; msg = '设备清单核对无误，得 10 分';
    }

    if (i === 3) {
        const st = S.d.t4.st || {};
        if (!SELF.every(x => st[x.k] === 'ok')) { toast('仍有自检项未通过，请先处理异常', 'err'); return; }
        sc = 10; msg = '设备自检全部通过，得 10 分';
    }

    if (i === 4) {
        if ((S.d.t5.picked || []).length < KIT.length) { toast('资料与安全用品尚未备齐', 'err'); return; }
        sc = 10; msg = '资料与安全用品齐备，得 10 分';
    }

    if (i === 5) {
        const d = S.d.t6;
        if (!d.routed) { toast('请先生成导航路线', 'err'); return; }
        if (!d.driver) { toast('请选择随车司机', 'err'); return; }
        sc = 10; msg = '路线规划完成，得 10 分';
    }

    if (i === 6) {
        const d = S.d.t7;
        const hz = d.hazards || [];
        const wrong = hz.filter(x => FAKE_HAZARDS.indexOf(x) >= 0);
        if (wrong.length) { toast('存在误判：' + wrong.join('、') + ' 不属于本次外场风险源', 'err'); return; }
        const miss = HAZARDS.filter(x => hz.indexOf(x) < 0);
        if (miss.length) { toast('仍有危险源未识别：' + miss.join('、'), 'err'); return; }
        if (!d.weather) { toast('请判断当前天气是否满足作业条件', 'err'); return; }
        if (d.weather !== WEATHERS[0]) { toast('天气判断有误：当前为晴，满足作业条件', 'err'); return; }
        if (!d.ppe) { toast('请确认防护用品已穿戴', 'err'); return; }
        sc = 10; msg = '安全风险评估完成，得 10 分';
    }

    if (i === 7) {
        const d = S.d.t8;
        const done = (d.pts || []).filter(Boolean).length;
        if (done < POINTS.length) { toast('还有 ' + (POINTS.length - done) + ' 个采样点未采集', 'err'); return; }
        const acc = parseFloat(d.access), dr = parseFloat(d.drop), ho = parseFloat(d.ho);
        if (!isFinite(acc) || !isFinite(dr) || !isFinite(ho)) { toast('请填写完整的簇级 KPI 指标', 'err'); return; }
        const got = d.pts;
        const okN = got.filter(x => x.rsrp >= KPI.rsrp && x.sinr >= KPI.sinr).length;
        const coverRate = okN / got.length * 100;
        let s = 20;
        if (coverRate < KPI.ratio) s -= 8;
        if (acc < KPI.access) s -= 4;
        if (dr > KPI.drop) s -= 4;
        if (ho < KPI.ho) s -= 4;
        sc = Math.max(0, s);
        msg = `路测完成，覆盖率 ${coverRate.toFixed(0)}%，得 ${sc} 分`;
    }

    if (i === 8) {
        const d = S.d.t9;
        if ((d.checked || []).length < CLOSE.length) { toast('请确认全部收尾动作', 'err'); return; }
        if (!(parseInt(d.logs, 10) > 0)) { toast('请填写本次生成的 log 文件数量', 'err'); return; }
        sc = 5; msg = '设备与现场收尾完成，得 5 分';
    }

    S.done[i] = true;
    S.score[i] = sc;
    save();
    toast(msg, 'ok');

    if (i < N - 1) {
        S.step = i + 1;
        save();
        render();
        document.getElementById('body').scrollTop = 0;
    } else {
        render();
    }
}
