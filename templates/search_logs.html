<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索日志 - 灵智尚人</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-right {
            display: flex;
            gap: 10px;
        }

        .back-btn {
            padding: 10px 20px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
        }

        .nav-btn {
            padding: 10px 16px;
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid #667eea;
            border-radius: 10px;
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: #667eea;
            color: white;
        }

        .logout-btn {
            background: rgba(211, 47, 47, 0.1);
            border-color: #d32f2f;
            color: #d32f2f;
        }

        .logout-btn:hover {
            background: #d32f2f;
            color: white;
        }

        .title {
            font-size: 28px;
            color: #333;
            font-weight: 600;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #e0e0e8;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        .logs-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .log-item {
            padding: 20px;
            border-bottom: 1px solid #f0f0f5;
            cursor: pointer;
            transition: background 0.3s;
        }

        .log-item:hover {
            background: #f8f9fc;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .log-query {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .log-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .log-tag.kb {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .log-tag.search {
            background: #e3f2fd;
            color: #1565c0;
        }

        .log-tag.reviewed {
            background: #fff3e0;
            color: #ef6c00;
        }

        .log-time {
            font-size: 12px;
            color: #999;
        }

        .log-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .log-detail {
            display: none;
            padding-top: 15px;
            margin-top: 15px;
            border-top: 1px solid #f0f0f5;
        }

        .log-detail.show {
            display: block;
        }

        .log-content {
            background: #f8f9fc;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .action-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .action-btn.success {
            background: #2e7d32;
            color: white;
        }

        .action-btn.success:hover {
            background: #1b5e20;
        }

        .action-btn.danger {
            background: #d32f2f;
            color: white;
        }

        .action-btn.danger:hover {
            background: #b71c1c;
        }

        .action-btn.secondary {
            background: #f0f0f5;
            color: #666;
        }

        .action-btn.secondary:hover {
            background: #e0e0e8;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            margin-left: auto;
            font-size: 24px;
            color: #999;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #666;
        }

        .note-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e8;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 10px;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }

        .note-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state-text {
            font-size: 18px;
        }

        /* 问题分析统计 */
        .analysis-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 25px;
            margin-bottom: 25px;
        }

        .analysis-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .category-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            border: 2px solid #e8e8f0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .category-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .category-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .category-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .category-bar {
            height: 8px;
            background: #e8e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .category-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .category-percent {
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
        }

        .category-card.clickable {
            cursor: pointer;
        }

        .category-card.clickable:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.25);
        }

        .category-view-btn {
            margin-top: 10px;
            padding: 6px 12px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 6px;
            font-size: 13px;
            color: #667eea;
            text-align: center;
            transition: all 0.3s;
        }

        .category-card.clickable:hover .category-view-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .keywords-section {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .keywords-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .keyword-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .keyword-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .keyword-count {
            background: rgba(255, 255, 255, 0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        .questions-section {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 20px;
        }

        .question-type {
            background: white;
            border: 2px solid #e8e8f0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .question-type:last-child {
            margin-bottom: 0;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .question-type-name {
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        .question-count-badge {
            background: #fff3e0;
            color: #ef6c00;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .question-examples {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        .question-example {
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f5;
        }

        .question-example:last-child {
            border-bottom: none;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: white;
            border: 2px solid #e8e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }

        .tab-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        /* 模态框样式 */
        .modal {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow: hidden;
        }

        .modal.large {
            max-width: 800px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid #eee;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            color: #999;
            cursor: pointer;
            padding: 5px;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-body {
            padding: 25px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 20px 25px;
            border-top: 1px solid #eee;
            background: #f8f9fc;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid;
        }

        .modal-btn.cancel {
            background: white;
            border-color: #ddd;
            color: #666;
        }

        .modal-btn.cancel:hover {
            background: #f5f5f5;
        }

        .modal-btn.confirm {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: #fff;
        }
        .modal-btn.confirm:hover { box-shadow: 0 6px 18px rgba(102,126,234,.45); }
        .modal-btn.warn {
            background: #fff7e6;
            border-color: #ffd591;
            color: #d46b08;
        }
        .modal-btn.warn:hover { background: #fff1d6; }

        /* ===== 知识点排行榜 ===== */
        .topic-summary {
            font-size: 12.5px;
            line-height: 1.7;
            color: #5a67c4;
            background: rgba(102,126,234,.08);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 14px;
        }
        .topic-summary b { color: #3a4694; }

        .topic-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #f8f9fc;
            margin-bottom: 8px;
            transition: .18s;
        }
        .topic-row:hover { background: #f1f4ff; transform: translateX(2px); }

        .topic-rank {
            width: 30px; height: 30px; border-radius: 50%;
            display: grid; place-items: center;
            font-weight: 800; font-size: 13px;
            color: #667eea; background: #eef1fb;
            flex: 0 0 auto;
        }
        .topic-rank.top1 { background: linear-gradient(135deg,#ffb020,#ff6b3d); color: #fff; }
        .topic-rank.top2 { background: linear-gradient(135deg,#b0bec5,#78909c); color: #fff; }
        .topic-rank.top3 { background: linear-gradient(135deg,#d7a86e,#b07d46); color: #fff; }

        .topic-main { flex: 1; min-width: 0; }
        .topic-name { font-size: 14px; font-weight: 700; color: #2f3646; }
        .topic-meta { font-size: 11.5px; color: #9aa2b8; margin-top: 4px; }
        .topic-bar { height: 6px; background: #eceffa; border-radius: 3px; overflow: hidden; margin-top: 6px; }
        .topic-bar i { display: block; height: 100%; border-radius: 3px;
                       background: linear-gradient(90deg,#667eea,#764ba2); }

        .topic-tag {
            font-size: 11px; padding: 2px 9px; border-radius: 10px;
            font-weight: 700; white-space: nowrap; margin-left: 8px;
        }
        .topic-tag.pending { background: #fff3e0; color: #e65100; }
        .topic-tag.done { background: #e8f5e9; color: #2e7d32; }

        .topic-btn {
            padding: 7px 15px;
            border-radius: 9px;
            border: none;
            background: linear-gradient(135deg,#667eea,#764ba2);
            color: #fff;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            flex: 0 0 auto;
            font-family: inherit;
        }
        .topic-btn:hover { box-shadow: 0 4px 14px rgba(102,126,234,.45); }

        .topic-log-item {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            padding: 7px 6px;
            font-size: 12.5px;
            color: #444;
            border-bottom: 1px dashed #eef0f7;
        }
        .topic-log-item:last-child { border-bottom: none; }
        .topic-log-item input { margin-top: 3px; flex: 0 0 auto; }
        .topic-log-meta { color: #9aa2b8; font-size: 11.5px; }

        /* 日志详情列表 */
        .log-detail-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .log-detail-item {
            background: #f8f9fc;
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid #667eea;
        }

        .log-detail-query {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .log-detail-content {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            max-height: 150px;
            overflow-y: auto;
        }

        .log-detail-meta {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
            color: #999;
        }

        /* 图表样式 */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }

        .chart-card.full-width {
            grid-column: span 2;
        }

        .chart-card canvas {
            max-width: 100%;
            height: 280px !important;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .title {
                font-size: 22px;
            }

            .log-header {
                flex-direction: column;
                gap: 8px;
            }

            .log-meta {
                flex-wrap: wrap;
            }

            .category-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== 左侧日志分类导航 + 右侧内容（双栏） ===== */
        .pz-wrap {
            display: grid;
            grid-template-columns: 262px minmax(0, 1fr);
            gap: 18px;
            max-width: 1560px;
            margin: 0 auto;
            padding: 16px 20px 44px;
            align-items: start;
        }
        .pz-wrap.solo { grid-template-columns: minmax(0, 1fr); }
        .pz-side {
            background: white;
            border-radius: 15px;
            padding: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 74px;
            max-height: calc(100vh - 92px);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pz-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .pz-headtitle {
            display: flex; align-items: center; gap: 7px;
            font-size: 15px; font-weight: 700; color: #333;
        }
        .pz-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #667eea; box-shadow: 0 0 8px #667eea; flex: 0 0 auto;
        }
        .pz-mini {
            padding: 4px 12px; border-radius: 14px;
            border: 1px solid #e4e8f6; background: #f7f8fc;
            color: #5563a8; font-size: 12px; cursor: pointer; font-family: inherit;
        }
        .pz-mini:hover { border-color: #667eea; color: #667eea; }

        .pz-summary {
            font-size: 11.5px; line-height: 1.55; color: #5a67c4;
            background: rgba(102,126,234,.08); border-radius: 8px;
            padding: 6px 10px;
        }
        .pz-summary b { color: #4a55a2; }

        .pz-list { overflow-y: auto; flex: 1; min-height: 60px; margin: 0 -4px; padding: 0 4px 6px; }
        .pz-glabel {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 11px; font-weight: 700; letter-spacing: .5px; color: #7a8199;
            padding: 10px 6px 4px;
        }
        .pz-navitem {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 10px; border-radius: 9px;
            font-size: 13px; color: #3c4257; cursor: pointer;
            transition: .16s; margin-bottom: 2px;
        }
        .pz-navitem:hover { background: #f4f6fd; transform: translateX(2px); }
        .pz-navitem.on {

</head>
<body>
    <div id="appNav"></div>
    <div class="pz-wrap" id="pzWrap">
        <!-- ===== 左侧：日志分类导航 ===== -->
        <aside class="pz-side" id="pzSide">

        <!-- ===== 右侧：日志与分析 ===== -->
        <main class="container pz-main">

            <div class="an-pagetitle an-nav-title">
                <h1 class="title">📚 搜索日志</h1>
                <span class="an-sub">学生提问与检索记录 · 审核入库 · 普遍问题分析</span>

        <div class="stats">

            </div>
            <div class="stat-card">

                <div class="stat-label">来自知识库</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="searchLogs">0</div>
                <div class="stat-label">新增搜索</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="reviewedLogs">0</div>
                <div class="stat-label">已审核</div>
            </div>
        </div>

        <!-- 分类筛选已移至左侧导航栏 -->

        <!-- 学生普遍问题分析 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="logs" onclick="switchTab('logs')">📋 日志列表</button>
            <button class="tab-btn" data-tab="analysis" onclick="switchTab('analysis')">📊 问题分析</button>

        <!-- 日志详情模态框 -->
        <div class="modal-overlay" id="logDetailModal" style="display: none;">
            <div class="modal large">
                <div class="modal-header">

                </div>
                <div class="modal-actions">
                    <button class="modal-btn cancel" onclick="hideLogDetailModal()">关闭</button>
                </div>
            </div>

        <!-- 问题分析区域 -->
        <div class="analysis-section" id="analysisSection" style="display: none;">
            <div class="analysis-title">📊 学生普遍问题分析</div>
            
            <!-- 统计图表区域 -->
            <div class="charts-row">
                <div class="chart-card">
                    <h3 style="font-size: 16px; color: #333; margin-bottom: 15px;">📊 知识领域分布饼图</h3>
                    <canvas id="categoryPieChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3 style="font-size: 16px; color: #333; margin-bottom: 15px;">� 知识领域柱状图</h3>
                    <canvas id="categoryBarChart"></canvas>
                </div>
            </div>
            
            <!-- 知识领域分布 -->
            <h3 style="font-size: 16px; color: #333; margin-bottom: 15px;">📚 知识领域详细数据</h3>
            <div class="category-grid" id="categoryGrid">
                <div class="empty-state" style="padding: 20px;">
                    <div class="empty-state-text">加载中...</div>
                </div>
            </div>
            
            <!-- 高频关键词图表 -->
            <div class="charts-row">
                <div class="chart-card full-width">
                    <h3 style="font-size: 16px; color: #333; margin-bottom: 15px;">🔥 高频关键词 TOP 10</h3>
                    <canvas id="keywordsBarChart"></canvas>
                </div>
            </div>
            
            <!-- 高频关键词 -->
            <div class="keywords-section">
                <div class="keyword-tags" id="keywordTags">
                    <div class="empty-state-text">暂无数据</div>
                </div>
            </div>
            
            <!-- 常见问题类型图表 -->
            <div class="charts-row">
                <div class="chart-card">
                    <h3 style="font-size: 16px; color: #333; margin-bottom: 15px;">💡 问题类型分布</h3>
                    <canvas id="questionTypeChart"></canvas>
                </div>
            </div>
            
            <!-- 常见问题类型 -->
            <div class="questions-section">
                <div class="keywords-title">问题类型详情</div>
                <div id="questionsList">
                    <div class="empty-state-text">暂无数据</div>
                </div>
            </div>
        </div>

        <!-- 知识点排行榜 -->
        <div class="analysis-section" id="topicSection" style="display: none;">
            <div class="analysis-title">🏆 学生搜索知识点排行</div>
            <div class="topic-summary" id="topicSummary">加载中…</div>
            <div id="topicList">
                <div class="empty-state-text">加载中…</div>
            </div>
        </div>

        <div class="logs-container" id="logsContainer">
            <div class="empty-state">
                <div class="empty-state-icon">📖</div>
                <div class="empty-state-text">加载中...</div>
            </div>
        </div>
        </main>
    </div><!-- /pz-wrap -->

    <!-- 知识点审核弹窗 -->
    <div class="modal-overlay" id="topicModal" style="display: none;">
        <div class="modal large">
            <div class="modal-header">
                <h3 class="modal-title" id="topicModalTitle">🎯 知识点审核</h3>
                <button class="modal-close" onclick="closeTopicModal()">✕</button>
            </div>
            <div class="modal-body" id="topicModalBody"></div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeTopicModal()">取消</button>
                <button class="modal-btn warn" onclick="dismissTopic()">无需入库</button>
                <button class="modal-btn confirm" onclick="saveTopicToKb()">加入知识库</button>
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];
        let currentFilter = 'all';
        let currentTab = 'logs';

        /* ===== 左侧分类导航状态 ===== */
        const sideState = { status: 'all', domain: '', time: '' };
        let categoryStats = {};     // 来自 /search-logs/analysis 的知识领域统计
        let domainIds = null;       // 选中知识领域时的日志 id 集合
        let domainLoading = false;

        // 退出登录
        async function doLogout() {
            if (confirm('确定要退出登录吗？')) {
                try {
                    const response = await fetch('/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    
                    if (response.ok) {
                        localStorage.removeItem('lingzhi_chat_history');
                        localStorage.removeItem('lingzhi_scenario_history');
                        window.location.href = '/';
                    }
                } catch (error) {
                    console.error('退出失败:', error);
                    localStorage.removeItem('lingzhi_chat_history');
                    localStorage.removeItem('lingzhi_scenario_history');
                    window.location.href = '/';
                }
            }
        }

        // 显示分类日志详情
        async function showCategoryLogs(categoryName) {
            document.getElementById('modalTitle').textContent = `📋 ${categoryName} - 日志详情`;
            document.getElementById('modalBody').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📖</div>
                    <div class="empty-state-text">加载中...</div>
                </div>
            `;
            document.getElementById('logDetailModal').style.display = 'flex';
            
            try {
                const response = await fetch(`/search-logs/category/${encodeURIComponent(categoryName)}`);
                const data = await response.json();
                
                if (data.logs && data.logs.length > 0) {
                    document.getElementById('modalBody').innerHTML = `
                        <div class="log-detail-list">
                            ${data.logs.map(log => `
                                <div class="log-detail-item">
                                    <div class="log-detail-query">🔍 ${escapeHtml(log.query)}</div>
                                    <div class="log-detail-content">📝 ${escapeHtml(log.content.substring(0, 200))}${log.content.length > 200 ? '...' : ''}</div>
                                    <div class="log-detail-meta">
                                        <span>📅 ${log.timestamp}</span>
                                        <span>📁 ${log.is_from_kb ? '知识库' : '搜索'}</span>
                                        <span>${log.is_from_kb ? '🟢 无需审核' : (log.reviewed ? '✓ 已审核' : '⏳ 待审核')}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    document.getElementById('modalBody').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div class="empty-state-text">该分类暂无日志</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载日志失败:', error);
                document.getElementById('modalBody').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <div class="empty-state-text">加载失败</div>
                    </div>
                `;
            }
        }

        // 隐藏日志详情模态框
        function hideLogDetailModal() {
            document.getElementById('logDetailModal').style.display = 'none';
        }

        // 点击模态框外部关闭
        document.getElementById('logDetailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideLogDetailModal();
            }
        });

        // 切换标签页
        function switchTab(tab) {
            currentTab = tab;

            // 更新标签按钮状态
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`[data-tab="${tab}"]`);
            if (activeBtn) activeBtn.classList.add('active');

            const logsEl = document.getElementById('logsContainer');
            const analysisEl = document.getElementById('analysisSection');
            const topicEl = document.getElementById('topicSection');

            if (logsEl) logsEl.style.display = (tab === 'logs') ? 'block' : 'none';
            if (analysisEl) analysisEl.style.display = (tab === 'analysis') ? 'block' : 'none';
            if (topicEl) topicEl.style.display = (tab === 'topics') ? 'block' : 'none';

            if (tab === 'analysis') loadAnalysis();
            if (tab === 'topics') loadTopicRanking();
        }

        /* ===================== 知识点排行榜 ===================== */
        let currentTopic = null;

        async function loadTopicRanking() {
            const listEl = document.getElementById('topicList');
            listEl.innerHTML = '<div class="empty-state-text">加载中…</div>';
            try {
                const resp = await fetch('/api/search-logs/topic-ranking?limit=50');
                const d = await resp.json();
                if (!resp.ok) throw new Error(d.error || '加载失败');
                renderTopicRanking(d);
            } catch (e) {
                listEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div>
                    <div class="empty-state-text">${escapeHtml(e.message)}</div></div>`;
            }
        }

        function renderTopicRanking(d) {
            const topics = d.topics || [];
            document.getElementById('topicSummary').innerHTML =
                `共 <b>${d.topic_count || 0}</b> 个知识点 · 命中 <b>${d.matched_logs || 0}</b> / ${d.total_logs || 0} 条日志` +
                (d.unmatched ? ` · ${d.unmatched} 条未匹配到知识点` : '') +
                ` · 待审核 <b>${d.pending_count || 0}</b> 个`;

            const listEl = document.getElementById('topicList');
            if (!topics.length) {
                listEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div>' +
                    '<div class="empty-state-text">还没有搜索记录，学生提问后会自动统计</div></div>';
                return;
            }

            const max = topics[0].count || 1;
            listEl.innerHTML = topics.map((t, i) => {
                const rankCls = i < 3 ? ' top' + (i + 1) : '';
                const pct = Math.max(6, Math.round(t.count / max * 100));
                const meta = [
                    `搜索 ${t.count} 次`,
                    t.students ? `${t.students} 名学生` : '',
                    t.last_time ? `最近 ${t.last_time.slice(5, 16)}` : '',
                ].filter(Boolean).join(' · ');
                return `<div class="topic-row">
                    <div class="topic-rank${rankCls}">${i + 1}</div>
                    <div class="topic-main">
                        <div>
                            <span class="topic-name">${escapeHtml(t.topic)}</span>
                            <span class="topic-tag ${t.in_kb ? 'done' : 'pending'}">${t.in_kb ? '已入库' : '待审核'}</span>
                        </div>
                        <div class="topic-meta">${escapeHtml(meta)}</div>
                        <div class="topic-bar"><i style="width:${pct}%"></i></div>
                    </div>
                    <button class="topic-btn" data-topic="${escapeHtml(t.topic)}"
                            onclick="openTopicReview(this.dataset.topic)">审核</button>
                </div>`;
            }).join('');
        }

        async function openTopicReview(topic) {
            try {
                const resp = await fetch('/api/search-logs/topic-logs?topic=' + encodeURIComponent(topic));
                const d = await resp.json();
                if (!resp.ok) throw new Error(d.error || '加载失败');
                currentTopic = d;

                document.getElementById('topicModalTitle').textContent = '🎯 审核知识点：' + d.topic;

                const rows = (d.logs || []).map(l => `
                    <label class="topic-log-item">
                        <input type="checkbox" class="topic-log-cb" value="${l.id}" checked>
                        <span>
                            <b>${escapeHtml(l.query)}</b>
                            <div class="topic-log-meta">${escapeHtml(l.timestamp || '')}${l.student_name ? ' · ' + escapeHtml(l.student_name) : ''}${l.added_to_kb ? ' · 已入库' : ''}</div>
                        </span>
                    </label>`).join('') || '<div class="empty-state-text">没有关联记录</div>';

                document.getElementById('topicModalBody').innerHTML = `
                    <div class="topic-summary">
                        <b>${escapeHtml(d.topic)}</b> 共被搜索 <b>${d.count}</b> 次 ·
                        ${d.in_kb ? '知识库里已有相关内容，本次可覆盖补充' : '知识库里还没有这个知识点'}
                    </div>
                    <div class="form-group">
                        <label class="form-label">相关提问（勾选要标记为已处理的记录）</label>
                        <div style="max-height:180px;overflow:auto;border:1px solid #eef0f7;border-radius:10px;padding:6px;">
                            ${rows}
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">知识条目内容（可直接修改后再入库）</label>
                        <textarea id="topicContent" style="width:100%;min-height:190px;padding:12px;border:2px solid #e8e8f0;border-radius:10px;font-size:13px;line-height:1.7;font-family:inherit;box-sizing:border-box;">${escapeHtml(d.draft || '')}</textarea>
                        <div style="font-size:11.5px;color:#9aa2b8;margin-top:6px;">
                            入库后会追加到知识库并重建检索索引；内容为空时请先补全
                        </div>
                    </div>`;

                document.getElementById('topicModal').style.display = 'flex';
            } catch (e) {
                alert('加载失败：' + e.message);
            }
        }

        function closeTopicModal() {
            document.getElementById('topicModal').style.display = 'none';
            currentTopic = null;
        }

        function selectedTopicLogIds() {
            return Array.prototype.slice
                .call(document.querySelectorAll('.topic-log-cb:checked'))
                .map(x => parseInt(x.value, 10))
                .filter(n => !isNaN(n));
        }

        async function saveTopicToKb() {
            if (!currentTopic) return;
            const content = (document.getElementById('topicContent').value || '').trim();
            if (!content) { alert('知识条目内容不能为空'); return; }

            try {
                const resp = await fetch('/api/search-logs/topic/add-to-kb', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        topic: currentTopic.topic,
                        content: content,
                        log_ids: selectedTopicLogIds()
                    })
                });
                const d = await resp.json();
                if (!resp.ok) { alert(d.error || '入库失败'); return; }
                alert(d.message || '已加入知识库');
                closeTopicModal();
                loadTopicRanking();
                loadLogs();
            } catch (e) {
                alert('入库失败：' + e.message);
            }
        }

        async function dismissTopic() {
            if (!currentTopic) return;
            if (!confirm(`确定「${currentTopic.topic}」不需要入库吗？\n相关记录会被标记为已审核。`)) return;
            try {
                const resp = await fetch('/api/search-logs/topic/dismiss', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: currentTopic.topic, log_ids: selectedTopicLogIds() })
                });
                const d = await resp.json();
                if (!resp.ok) { alert(d.error || '操作失败'); return; }
                alert(d.message || '已标记为无需入库');
                closeTopicModal();
                loadTopicRanking();
                loadLogs();
            } catch (e) {
                alert('操作失败：' + e.message);
            }
        }

        // 加载问题分析数据
        async function loadAnalysis() {
            try {
                const response = await fetch('/search-logs/analysis');
                const data = await response.json();
                renderAnalysis(data);
            } catch (error) {
                console.error('加载分析数据失败:', error);
                document.getElementById('categoryGrid').innerHTML = `
                    <div class="empty-state" style="padding: 20px;">
                        <div class="empty-state-text">加载失败</div>
                    </div>
                `;
            }
        }

        // 图表实例缓存
        let charts = {};

        // 销毁现有图表
        function destroyCharts() {
            Object.keys(charts).forEach(key => {
                if (charts[key]) {
                    charts[key].destroy();
                    charts[key] = null;
                }
            });
            charts = {};
        }

        // 创建颜色数组
        const chartColors = [
            'rgba(102, 126, 234, 0.8)',
            'rgba(118, 75, 162, 0.8)',
            'rgba(240, 98, 146, 0.8)',
            'rgba(255, 152, 0, 0.8)',
            'rgba(76, 175, 80, 0.8)',
            'rgba(33, 150, 243, 0.8)',
            'rgba(156, 39, 176, 0.8)',
            'rgba(255, 87, 34, 0.8)',
            'rgba(0, 188, 212, 0.8)',
            'rgba(255, 193, 7, 0.8)'
        ];

        const chartBorderColors = [
            'rgba(102, 126, 234, 1)',
            'rgba(118, 75, 162, 1)',
            'rgba(240, 98, 146, 1)',
            'rgba(255, 152, 0, 1)',
            'rgba(76, 175, 80, 1)',
            'rgba(33, 150, 243, 1)',
            'rgba(156, 39, 176, 1)',
            'rgba(255, 87, 34, 1)',
            'rgba(0, 188, 212, 1)',
            'rgba(255, 193, 7, 1)'
        ];

        // 渲染分析数据
        function renderAnalysis(data) {
            // 销毁之前的图表
            destroyCharts();
            
            // 渲染知识领域分布图表
            const categories = Object.entries(data.category_stats || {});
            const sortedCategories = categories.sort((a, b) => b[1].count - a[1].count);
            const categoryLabels = sortedCategories.map(([name]) => name);
            const categoryCounts = sortedCategories.map(([, stats]) => stats.count);
            
            // 创建饼图
            if (categoryLabels.length > 0) {
                const pieCtx = document.getElementById('categoryPieChart').getContext('2d');
                charts['pie'] = new Chart(pieCtx, {
                    type: 'pie',
                    data: {
                        labels: categoryLabels,
                        datasets: [{
                            data: categoryCounts,
                            backgroundColor: chartColors.slice(0, categoryLabels.length),
                            borderColor: chartBorderColors.slice(0, categoryLabels.length),
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    padding: 15,
                                    usePointStyle: true,
                                    font: { size: 12 }
                                }
                            }
                        }
                    }
                });
                
                // 创建柱状图
                const barCtx = document.getElementById('categoryBarChart').getContext('2d');
                charts['bar'] = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: categoryLabels,
                        datasets: [{
                            label: '问题数量',
                            data: categoryCounts,
                            backgroundColor: chartColors.slice(0, categoryLabels.length),
                            borderColor: chartBorderColors.slice(0, categoryLabels.length),
                            borderWidth: 2,
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        indexAxis: 'y',
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: { beginAtZero: true, grid: { color: '#f0f0f5' } },
                            y: { grid: { display: false } }
                        }
                    }
                });
            }
            
            // 渲染知识领域分布卡片
            const categoryGrid = document.getElementById('categoryGrid');
            if (categories.length === 0) {
                categoryGrid.innerHTML = `
                    <div class="empty-state" style="padding: 20px;">
                        <div class="empty-state-text">暂无数据</div>
                    </div>
                `;
            } else {
                categoryGrid.innerHTML = sortedCategories.map(([name, stats], index) => `
                    <div class="category-card clickable" onclick="showCategoryLogs('${name}')">
                        <div class="category-header">
                            <div class="category-name">${name}</div>
                            <div class="category-count">${stats.count} 个问题</div>
                        </div>
                        <div class="category-bar">
                            <div class="category-bar-fill" style="width: ${stats.percentage}%; background: ${chartColors[index]}"></div>
                        </div>
                        <div class="category-percent">占比 ${stats.percentage}%</div>
                        <div class="category-view-btn">👁️ 查看详情</div>
                    </div>
                `).join('');
            }
            
            // 渲染高频关键词图表
            const keywords = data.top_keywords || [];
            if (keywords.length > 0) {
                const kwLabels = keywords.map(kw => kw.keyword);
                const kwCounts = keywords.map(kw => kw.count);
                
                const kwCtx = document.getElementById('keywordsBarChart').getContext('2d');
                charts['keywords'] = new Chart(kwCtx, {
                    type: 'bar',
                    data: {
                        labels: kwLabels,
                        datasets: [{
                            label: '出现次数',
                            data: kwCounts,
                            backgroundColor: chartColors.slice(0, keywords.length),
                            borderColor: chartBorderColors.slice(0, keywords.length),
                            borderWidth: 2,
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: { grid: { display: false } },
                            y: { beginAtZero: true, grid: { color: '#f0f0f5' } }
                        }
                    }
                });
            }
            
            // 渲染高频关键词标签
            const keywordTags = document.getElementById('keywordTags');
            if (keywords.length === 0) {
                keywordTags.innerHTML = '<div class="empty-state-text">暂无数据</div>';
            } else {
                keywordTags.innerHTML = keywords.map(kw => `
                    <div class="keyword-tag">
                        ${kw.keyword}
                        <span class="keyword-count">${kw.count}</span>
                    </div>
                `).join('');
            }
            
            // 渲染常见问题类型图表
            const questions = data.common_questions || [];
            if (questions.length > 0) {
                const qLabels = questions.map(q => q.type);
                const qCounts = questions.map(q => q.count);
                
                const qCtx = document.getElementById('questionTypeChart').getContext('2d');
                charts['questions'] = new Chart(qCtx, {
                    type: 'doughnut',
                    data: {
                        labels: qLabels,
                        datasets: [{
                            data: qCounts,
                            backgroundColor: chartColors.slice(0, questions.length),
                            borderColor: chartBorderColors.slice(0, questions.length),
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    padding: 15,
                                    usePointStyle: true,
                                    font: { size: 12 }
                                }
                            }
                        }
                    }
                });
            }
            
            // 渲染常见问题类型列表
            const questionsList = document.getElementById('questionsList');
            if (questions.length === 0) {
                questionsList.innerHTML = '<div class="empty-state-text">暂无数据</div>';
            } else {
                questionsList.innerHTML = questions.map(q => `
                    <div class="question-type">
                        <div class="question-header">
                            <div class="question-type-name">${q.type}</div>
                            <div class="question-count-badge">${q.count} 条</div>
                        </div>
                        <div class="question-examples">
                            ${q.examples.map(ex => `
                                <div class="question-example">• ${escapeHtml(ex)}</div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            }
        }

        // 加载日志
        async function loadLogs() {
            try {
                // 日志列表 + 领域统计并行拉取（统计用于左侧分类计数）
                const [logsRes, anaRes] = await Promise.all([
                    fetch('/search-logs'),
                    fetch('/search-logs/analysis').catch(() => null),
                ]);
                const data = await logsRes.json();
                allLogs = data.logs || [];

                if (anaRes && anaRes.ok) {
                    const ana = await anaRes.json();
                    categoryStats = ana.category_stats || {};
                }

                updateStats();
                renderSideNav();
                renderLogs();
            } catch (error) {
                console.error('加载日志失败:', error);
                document.getElementById('logsContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <div class="empty-state-text">加载失败，请稍后重试</div>
                    </div>
                `;
            }
        }

        // 更新统计数据
        function updateStats() {
            document.getElementById('totalLogs').textContent = allLogs.length;
            document.getElementById('kbLogs').textContent = allLogs.filter(l => l.is_from_kb).length;
            document.getElementById('searchLogs').textContent = allLogs.filter(l => !l.is_from_kb).length;
            document.getElementById('reviewedLogs').textContent = allLogs.filter(l => l.reviewed).length;
        }

        /* ===================== 左侧分类导航 ===================== */
        // 按状态过滤
        function applyStatus(list) {
            const s = sideState.status;
            if (s === 'kb') return list.filter(l => l.is_from_kb);
            if (s === 'search') return list.filter(l => !l.is_from_kb);
            if (s === 'reviewed') return list.filter(l => l.reviewed);
            // 知识库内容无需审核，不进入待审核列表
            if (s === 'pending') return list.filter(l => !l.reviewed && !l.is_from_kb);
            return list;
        }

        // 状态 + 知识领域（不含时间）
        function baseFiltered() {
            let list = applyStatus(allLogs);
            if (sideState.domain) {
                list = domainIds ? list.filter(l => domainIds.has(l.id)) : [];
            }
            return list;
        }

        // 时间归档
        function timeKeyOf(log) {
            const d = (log.timestamp || '').slice(0, 10);
            if (!d) return 'older';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const dt = new Date(d + 'T00:00:00');
            if (isNaN(dt.getTime())) return 'older';
            const diff = Math.round((today - dt) / 86400000);
            if (diff <= 0) return 'today';
            if (diff <= 7) return 'week';
            return 'older';
        }

        function renderSideNav() {
            const box = document.getElementById('sideNav');
            if (!box) return;

            const counts = {
                all: allLogs.length,
                kb: allLogs.filter(l => l.is_from_kb).length,
                search: allLogs.filter(l => !l.is_from_kb).length,
                pending: allLogs.filter(l => !l.reviewed && !l.is_from_kb).length,
                reviewed: allLogs.filter(l => l.reviewed).length,
            };

            const base = baseFiltered();
            const timeCounts = {
                today: base.filter(l => timeKeyOf(l) === 'today').length,
                week: base.filter(l => timeKeyOf(l) === 'week').length,
                older: base.filter(l => timeKeyOf(l) === 'older').length,
            };

            const item = (icon, label, count, active, onclick, title) =>
                `<div class="pz-navitem${active ? ' on' : ''}"${title ? ` title="${title}"` : ''} onclick="${onclick}">
                    <span class="ic">${icon}</span><span class="lbl">${label}</span>
                    <span class="cnt">${count}</span>
                 </div>`;

            let html = '<div class="pz-glabel"><span>处理状态</span></div>';
            html += item('🗂', '全部日志', counts.all, sideState.status === 'all', "selectStatus('all')");
            html += item('📚', '来自知识库', counts.kb, sideState.status === 'kb', "selectStatus('kb')", '知识库内容无需审核');
            html += item('🔍', '新增搜索', counts.search, sideState.status === 'search', "selectStatus('search')");
            html += item('⏳', '待审核', counts.pending, sideState.status === 'pending', "selectStatus('pending')");
            html += item('✅', '已审核', counts.reviewed, sideState.status === 'reviewed', "selectStatus('reviewed')");

            const cats = Object.entries(categoryStats || {})
                .filter(([, s]) => (s && s.count) > 0)
                .sort((a, b) => (b[1].count || 0) - (a[1].count || 0));
            if (cats.length) {
                html += '<div class="pz-glabel"><span>知识领域</span></div>';
                html += cats.map(([name, s]) => {
                    const safe = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    return item('📘', name, s.count || 0, sideState.domain === name,
                                `selectDomain('${safe}')`, '只显示该领域的日志');
                }).join('');
            }

            html += '<div class="pz-glabel"><span>时间范围</span></div>';
            html += item('📅', '今天', timeCounts.today, sideState.time === 'today', "selectTime('today')");
            html += item('🗓', '近 7 天', timeCounts.week, sideState.time === 'week', "selectTime('week')");
            html += item('📦', '更早', timeCounts.older, sideState.time === 'older', "selectTime('older')");

            box.innerHTML = html;

            const sum = document.getElementById('sideSummary');
            if (sum) {
                const cond = [];
                if (sideState.status !== 'all') {
                    cond.push({ kb: '知识库', search: '新增搜索', pending: '待审核', reviewed: '已审核' }[sideState.status] || '');
                }
                if (sideState.domain) cond.push(sideState.domain);
                if (sideState.time) {
                    cond.push({ today: '今天', week: '近7天', older: '更早' }[sideState.time]);
                }
                sum.innerHTML = `当前筛选 <b>${base.filter(l => !sideState.time || timeKeyOf(l) === sideState.time).length}</b> 条` +
                    ` / 共 ${allLogs.length} 条` +
                    (cond.length ? `<br>条件：${cond.filter(Boolean).join(' · ')}` : '');
            }
        }

        function selectStatus(key) {
            sideState.status = key;
            renderSideNav();
            renderLogs();
        }

        function selectTime(key) {
            sideState.time = (sideState.time === key) ? '' : key;
            renderSideNav();
            renderLogs();
        }

        async function selectDomain(name) {
            // 再次点击同一个领域 = 取消筛选
            if (sideState.domain === name) {
                sideState.domain = '';
                domainIds = null;
                renderSideNav();
                renderLogs();
                return;
            }
            sideState.domain = name;
            domainIds = null;
            domainLoading = true;
            renderSideNav();
            renderLogs();

            try {
                const resp = await fetch(`/search-logs/category/${encodeURIComponent(name)}`);
                const d = await resp.json();
                domainIds = new Set((d.logs || []).map(l => l.id));
            } catch (e) {
                console.error('加载领域日志失败:', e);
                domainIds = new Set();
            }
            domainLoading = false;
            renderSideNav();
            renderLogs();
        }

        // 渲染日志列表
        function renderLogs() {
            const container = document.getElementById('logsContainer');

            if (domainLoading) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <div class="empty-state-text">正在筛选「${escapeHtml(sideState.domain)}」领域…</div>
                    </div>
                `;
                return;
            }

            let filteredLogs = baseFiltered();
            if (sideState.time) {
                filteredLogs = filteredLogs.filter(l => timeKeyOf(l) === sideState.time);
            }

            if (filteredLogs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">当前筛选条件下没有记录</div>
                    </div>
                `;
                return;
            }

            // 倒序展示（复制一份再 reverse，避免把 allLogs 本身翻乱）
            container.innerHTML = [...filteredLogs].reverse().map(log => `
                <div class="log-item" data-id="${log.id}">
                    <div class="log-header" onclick="toggleLogDetail(${log.id})">
                        <div class="log-query">${escapeHtml(log.query)}</div>
                        <div class="log-meta">
                            <span class="log-tag ${log.is_from_kb ? 'kb' : 'search'}">${log.is_from_kb ? '知识库' : '搜索'}</span>
                            ${log.reviewed ? '<span class="log-tag reviewed">已审核</span>' : ''}
                            ${log.added_to_kb ? '<span class="log-tag" style="background: #e8f5e9; color: #2e7d32;">已入知识库</span>' : ''}
                            <span class="log-time">${log.timestamp}</span>
                        </div>
                    </div>
                    <div class="log-preview">${escapeHtml(log.content.substring(0, 200))}${log.content.length > 200 ? '...' : ''}</div>
                    <div class="log-detail" id="detail-${log.id}">
                        <div class="log-content">${escapeHtml(log.content)}</div>
                        <textarea class="note-input" id="note-${log.id}" placeholder="添加备注...">${escapeHtml(log.note || '')}</textarea>
                        <div class="log-actions">
                            <button class="action-btn secondary" onclick="saveNote(${log.id})">💾 保存备注</button>
                            <button class="action-btn success" onclick="markReviewed(${log.id}, true)">✅ 标记已审核</button>
                            <button class="action-btn primary" onclick="addToKnowledge(${log.id})">📚 添加到知识库</button>
                            <button class="action-btn danger" onclick="deleteLog(${log.id})">🗑️ 删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 切换日志详情
        function toggleLogDetail(logId) {
            const detail = document.getElementById(`detail-${logId}`);
            detail.classList.toggle('show');
        }

        // 保存备注
        async function saveNote(logId) {
            const note = document.getElementById(`note-${logId}`).value;
            try {
                const response = await fetch(`/search-logs/${logId}/review`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note: note })
                });
                if (response.ok) {
                    alert('备注已保存');
                    loadLogs();
                }
            } catch (error) {
                alert('保存失败');
            }
        }

        // 标记审核状态
        async function markReviewed(logId, reviewed) {
            const note = document.getElementById(`note-${logId}`).value;
            try {
                const response = await fetch(`/search-logs/${logId}/review`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reviewed: reviewed, note: note })
                });
                if (response.ok) {
                    const result = await response.json();
                    alert(result.message || (reviewed ? '已标记为已审核' : '已取消审核标记'));
                    loadLogs();
                }
            } catch (error) {
                alert('操作失败');
            }
        }

        // 添加到知识库
        async function addToKnowledge(logId) {
            if (!confirm('确定要将此记录添加到知识库吗？')) {
                return;
            }
            try {
                const response = await fetch(`/search-logs/${logId}/add-to-knowledge`, {
                    method: 'POST'
                });
                if (response.ok) {
                    alert('已添加到知识库！');
                    loadLogs();
                } else {
                    alert('添加失败');
                }
            } catch (error) {
                alert('添加失败');
            }
        }

        // 删除日志
        async function deleteLog(logId) {
            if (!confirm('确定要删除此记录吗？')) {
                return;
            }
            try {
                const response = await fetch(`/search-logs/${logId}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    alert('已删除');
                    loadLogs();
                }
            } catch (error) {
                alert('删除失败');
            }
        }

        // 分类筛选改由左侧导航（selectStatus / selectDomain / selectTime）驱动

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 初始化
        loadLogs();
    </script>

    <!-- 全站顶部导航栏 -->
    <script src="/static/app_nav.js" defer></script>

    <!-- 全局桌宠 Desktop Pet -->
    <link rel="stylesheet" href="/static/desktop_pet.css">
    <script src="/static/desktop_pet.js" defer></script>
</body>
