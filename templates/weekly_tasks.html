<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每周任务卡 - 灵智尚人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 28px 32px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }
        .back-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .header h1 { font-size: 24px; margin-bottom: 4px; }
        .header .subtitle { opacity: 0.9; font-size: 14px; }
        .target-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            background: rgba(255,255,255,0.15);
            padding: 12px 20px;
            border-radius: 12px;
        }
        .target-banner .icon { font-size: 32px; }
        .target-banner .info { flex: 1; }
        .target-banner .job-name { font-size: 18px; font-weight: 600; }
        .target-banner .salary { font-size: 13px; opacity: 0.85; }
        .progress-ring {
            width: 60px;
            height: 60px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-ring svg { transform: rotate(-90deg); }
        .progress-ring .bg-circle { stroke: rgba(255,255,255,0.2); }
        .progress-ring .fg-circle { stroke: white; stroke-dasharray: 163.36; transition: stroke-dashoffset 0.6s; }
        .progress-ring .pct { position: absolute; font-size: 14px; font-weight: 700; }
        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .week-title { font-size: 20px; font-weight: 700; color: #1a1a1a; }
        .week-info { color: #999; font-size: 14px; }
        .stage-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-left: 10px;
        }
        .stage-basic {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }
        .stage-targeted {
            background: #fff7e6;
            color: #d46b08;
            border: 1px solid #ffd591;
        }
        .analysis-box {
            background: white;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid #667eea;
        }
        .analysis-box h3 { font-size: 16px; color: #333; margin-bottom: 10px; }
        .analysis-box p { font-size: 14px; color: #666; line-height: 1.6; }
        .analysis-box .weak-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .analysis-box .weak-tag {
            background: #fff1f0;
            color: #cf1322;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
        }
        .analysis-box .tip {
            background: #f0f5ff;
            color: #2f54eb;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
            line-height: 1.6;
        }
        .task-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .task-card {
            background: white;
            border-radius: 14px;
            padding: 20px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .task-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .task-card.completed { border-color: #b7eb8f; background: #f6ffed; }
        .task-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #d9d9d9;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
            transition: all 0.2s;
        }
        .task-checkbox:hover { border-color: #667eea; }
        .task-checkbox.checked { background: #52c41a; border-color: #52c41a; color: white; }
        .task-checkbox.checked::after { content: '✓'; font-size: 16px; font-weight: 700; }
        .task-content { flex: 1; }
        .task-title { font-size: 16px; font-weight: 600; color: #333; }
        .task-card.completed .task-title { text-decoration: line-through; color: #999; }
        .task-detail { font-size: 13px; color: #888; margin-top: 6px; line-height: 1.5; }
        .task-meta { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .task-tag {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 8px;
        }
        .tag-area { background: #e6f7ff; color: #1890ff; }
        .tag-gap { background: #fff7e6; color: #d46b08; }
        .tag-time { background: #f9f0ff; color: #722ed1; }
        .tag-done { background: #f6ffed; color: #389e0d; }
        .need-target {
            background: white;
            border-radius: 16px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .need-target .icon { font-size: 64px; margin-bottom: 16px; }
        .need-target h2 { font-size: 22px; color: #333; margin-bottom: 8px; }
        .need-target p { color: #888; font-size: 14px; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .career-info {
            background: white;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .career-info h3 { font-size: 16px; color: #333; margin-bottom: 12px; }
        .career-skills { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-tag {
            background: #e8ecfd;
            color: #667eea;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        .career-path-text { font-size: 13px; color: #888; margin-top: 12px; }
        .week-nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .week-tab {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #e8e8f0;
            background: white;
            color: #666;
            transition: all 0.2s;
        }
        .week-tab.active { background: #667eea; color: white; border-color: #667eea; }
        .week-tab:hover:not(.active) { border-color: #667eea; }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 40px 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 18px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { font-size: 18px; font-weight: 600; }
        .modal-close {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.3); }
        .modal-body { padding: 24px 28px; max-height: 70vh; overflow-y: auto; }
        .modal-footer {
            padding: 16px 28px;
            background: #f9f9fc;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .detail-section { margin-bottom: 24px; }
        .detail-section h3 {
            font-size: 15px;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f5;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-section h3 .icon { font-size: 18px; }

        .empty-tip {
            background: #fffbe6;
            border: 1px solid #ffe58f;
            border-radius: 10px;
            padding: 16px 20px;
            color: #874d00;
            font-size: 14px;
            line-height: 1.6;
        }
        .empty-tip .warning-icon { font-size: 20px; margin-right: 8px; }

        .ppt-list, .knowledge-list { display: flex; flex-direction: column; gap: 10px; }
        .ppt-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f5f7ff;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s;
            border: 1px solid #e6e8ff;
        }
        .ppt-item:hover { background: #e8ecff; border-color: #667eea; transform: translateX(4px); }
        .ppt-item .ppt-icon { font-size: 24px; }
        .ppt-item .ppt-info { flex: 1; }
        .ppt-item .ppt-name { font-size: 14px; font-weight: 500; }
        .ppt-item .ppt-meta { font-size: 12px; color: #999; margin-top: 2px; }

        .knowledge-item {
            padding: 14px 18px;
            background: #f8fafc;
            border-radius: 10px;
            border-left: 3px solid #667eea;
        }
        .knowledge-item .concept-name {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .knowledge-item .concept-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .knowledge-item .key-points { display: flex; flex-wrap: wrap; gap: 6px; }
        .knowledge-item .kp-tag {
            font-size: 12px;
            padding: 3px 10px;
            background: #e8ecfd;
            color: #667eea;
            border-radius: 6px;
        }

        .study-suggestion {
            background: linear-gradient(135deg, #f0f5ff 0%, #f5f0ff 100%);
            border: 1px solid #d6e4ff;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 14px;
            color: #333;
            line-height: 1.7;
        }
        .study-suggestion .suggestion-title {
            font-weight: 600;
            color: #2f54eb;
            margin-bottom: 8px;
        }

        /* Quiz Styles */
        .quiz-container { margin-top: 20px; }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 14px 18px;
            background: linear-gradient(135deg, #fff7e6 0%, #fff1f0 100%);
            border-radius: 12px;
        }
        .quiz-header .quiz-info { font-size: 14px; color: #666; }
        .quiz-header .quiz-info strong { color: #d46b08; }
        .quiz-question {
            background: white;
            border: 2px solid #e8e8f0;
            border-radius: 12px;
            padding: 18px 22px;
            margin-bottom: 14px;
            transition: all 0.2s;
        }
        .quiz-question:hover { border-color: #667eea; }
        .quiz-question .q-num {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 6px;
        }
        .quiz-question .q-text {
            font-size: 15px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .quiz-options { display: flex; flex-direction: column; gap: 8px; }
        .quiz-option {
            padding: 10px 14px;
            background: #f8fafc;
            border: 1px solid #e8e8f0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quiz-option:hover { background: #f0f5ff; border-color: #667eea; }
        .quiz-option.selected {
            background: #e8ecfd;
            border-color: #667eea;
            color: #667eea;
            font-weight: 500;
        }
        .quiz-option.correct {
            background: #f6ffed;
            border-color: #52c41a;
            color: #389e0d;
        }
        .quiz-option.wrong {
            background: #fff1f0;
            border-color: #ff4d4f;
            color: #cf1322;
        }
        .quiz-option .option-letter {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: #e8e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        .quiz-option.selected .option-letter { background: #667eea; color: white; }
        .quiz-option.correct .option-letter { background: #52c41a; color: white; }
        .quiz-option.wrong .option-letter { background: #ff4d4f; color: white; }

        .quiz-result {
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            margin-top: 20px;
        }
        .quiz-result.pass { background: #f6ffed; border: 2px solid #b7eb8f; }
        .quiz-result.fail { background: #fff1f0; border: 2px solid #ffa39e; }
        .quiz-result .score-big {
            font-size: 48px;
            font-weight: 700;
            margin: 10px 0;
        }
        .quiz-result.pass .score-big { color: #52c41a; }
        .quiz-result.fail .score-big { color: #ff4d4f; }
        .quiz-result .result-msg { font-size: 14px; color: #666; margin-bottom: 8px; }
        .quiz-result .proficiency-tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
        }
        .proficiency-入门 { background: #fff1f0; color: #cf1322; }
        .proficiency-掌握 { background: #fff7e6; color: #d46b08; }
        .proficiency-熟练 { background: #e6f7ff; color: #1890ff; }
        .proficiency-精通 { background: #f6ffed; color: #389e0d; }

        .quiz-analysis {
            margin-top: 16px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
        }
        .quiz-analysis h4 { font-size: 14px; color: #333; margin-bottom: 10px; }
        .quiz-analysis .analysis-item {
            padding: 8px 0;
            font-size: 13px;
            color: #555;
            border-bottom: 1px solid #eee;
            line-height: 1.6;
        }
        .quiz-analysis .analysis-item:last-child { border-bottom: none; }

        .btn {
            display: inline-block;
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(102,126,234,0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary {
            background: #f0f0f5;
            color: #666;
        }
        .btn-secondary:hover { background: #e4e4ea; }
        .btn-success {
            background: linear-gradient(135deg, #52c41a 0%, #389e0d 100%);
            color: white;
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(82,196,26,0.3); }
        .btn-warning {
            background: #faad14;
            color: white;
        }

        .task-clickable { cursor: pointer; }
        .task-clickable:hover { border-color: #667eea; }
        .quiz-passed-badge {
            background: #f6ffed;
            color: #389e0d;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            margin-left: 6px;
        }
        .quiz-fail-badge {
            background: #fff1f0;
            color: #cf1322;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            margin-left: 6px;
        }

        .proficiency-summary {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .proficiency-card {
            flex: 1;
            min-width: 150px;
            padding: 14px;
            background: #f8fafc;
            border-radius: 10px;
            text-align: center;
        }
        .proficiency-card .pct {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        .proficiency-card .label {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* ===== Fault Scenario & Pre-check Styles ===== */
        .fault-banner {
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-left: 4px solid;
            animation: faultPulse 2s infinite;
        }
        .fault-banner.level-danger {
            background: linear-gradient(135deg, #fff1f0 0%, #fff7e6 100%);
            border-color: #ff4d4f;
        }
        .fault-banner.level-warning {
            background: linear-gradient(135deg, #fffbe6 0%, #fff7e6 100%);
            border-color: #faad14;
        }
        .fault-banner.level-info {
            background: linear-gradient(135deg, #e6f7ff 0%, #f0f5ff 100%);
            border-color: #1890ff;
        }
        @keyframes faultPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,79,0); }
            50% { box-shadow: 0 0 20px 2px rgba(255,77,79,0.15); }
        }
        .fault-banner.level-info { animation: none; }
        .fault-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .fault-icon {
            font-size: 32px;
            animation: faultBlink 1s infinite;
        }
        @keyframes faultBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .fault-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }
        .fault-level-badge {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            margin-left: auto;
        }
        .level-danger .fault-level-badge { background: #ff4d4f; color: white; }
        .level-warning .fault-level-badge { background: #faad14; color: white; }
        .level-info .fault-level-badge { background: #1890ff; color: white; }
        .fault-desc {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .pre-check-modal .modal-body { padding: 30px; }
        .pre-check-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .pre-check-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .pre-check-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .pre-check-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 18px;
            background: #f8fafc;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pre-check-item:hover {
            background: #f0f5ff;
            border-color: #667eea;
        }
        .pre-check-item.checked {
            background: #f6ffed;
            border-color: #b7eb8f;
        }
        .pre-check-item.failed {
            background: #fff1f0;
            border-color: #ffa39e;
        }
        .pre-check-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #d9d9d9;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
            background: white;
        }
        .pre-check-item.checked .pre-check-checkbox {
            background: #52c41a;
            border-color: #52c41a;
            color: white;
        }
        .pre-check-checkbox::after {
            content: '✓';
            font-size: 14px;
            font-weight: 700;
            display: none;
        }
        .pre-check-item.checked .pre-check-checkbox::after { display: block; }
        .pre-check-text {
            flex: 1;
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }
        .pre-check-required-tag {
            display: inline-block;
            padding: 1px 6px;
            background: #fff1f0;
            color: #cf1322;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;

<body>

            <button class="btn btn-primary" style="position:absolute;right:180px;top:15px;padding:8px 16px;font-size:13px;background:linear-gradient(135deg,#13c2c2,#1890ff);border:none;" onclick="showPlatformGuide()">📖 使用说明</button>

            <a href="/survey-page" class="btn btn-primary">前往职业问卷</a>
        </div>

        <div id="tasksContainer" style="display:none;">
            <div class="week-nav" id="weekNav"></div>
            <div class="week-header">
                <div>
                    <span class="week-title" id="weekTitle">第 1 周</span>
                    <span class="stage-badge" id="stageBadge"></span>
                    <span class="week-info" id="weekInfo"></span>
                </div>
            </div>
            <div class="analysis-box" id="analysisBox" style="display:none;"></div>
            <div class="career-info" id="careerInfo"></div>
            <div class="task-grid" id="taskGrid"></div>
        </div>

        <!-- Task Detail Modal -->
        <div class="modal-overlay" id="taskModal">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">任务详情</h2>
                    <button class="modal-close" onclick="closeModal()">✕</button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Dynamic content -->
                </div>
                <div class="modal-footer" id="modalFooter">
                    <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
                    <button class="btn btn-primary" id="completeTaskBtn" onclick="completeTaskFromModal()">✓ 标记为完成</button>
                </div>

        <div class="modal-overlay" id="preCheckModal">
            <div class="modal pre-check-modal" style="max-width:600px;">
                <div class="modal-header" style="background:linear-gradient(135deg,#ff4d4f 0%,#cf1322 100%);">
                    <h2>🛡️ 操作前置自检</h2>

                </div>

                    <div class="pre-check-subtitle" id="preCheckSubtitle"></div>
                    <div class="pre-check-warning" id="preCheckWarning"></div>
                    <div class="pre-check-progress">
                        <div class="progress-text">已确认：<strong id="preCheckCount">0</strong> / <strong id="preCheckTotal">0</strong> 项</div>
                        <div class="progress-bar"><div class="progress-fill" id="preCheckProgress"></div></div>
                    </div>
                    <div class="pre-check-list" id="preCheckList"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closePreCheck()">取消</button>
                    <button class="btn btn-primary" id="preCheckStartBtn" onclick="confirmPreCheck()">开始实训</button>
                </div>
            </div>
        </div>

    <script>
        let currentWeekData = null;
        let currentTaskId = null;
        let currentDetailData = null;
        let currentQuizData = null;

        async function loadWeeklyTasks() {
            const res = await fetch('/api/weekly-tasks');
            const data = await res.json();

            if (data.need_target) {
                document.getElementById('needTarget').style.display = '';
                document.getElementById('tasksContainer').style.display = 'none';
                return;
            }

            if (!data.success) {
                alert(data.message || '加载失败');
                return;
            }

            currentWeekData = data;
            renderTargetBanner(data);
            renderWeekNav(data.all_weeks || []);
            renderStage(data);
            renderAnalysis(data);
            renderCareerInfo(data.career_detail || {});
            renderTasks(data.tasks || []);
            document.getElementById('tasksContainer').style.display = '';
        }

        function renderTargetBanner(data) {
            const detail = data.career_detail || {};
            const pct = data.total_tasks > 0 ? Math.round(data.completed_tasks / data.total_tasks * 100) : 0;
            const offset = 163.36 * (1 - pct / 100);

            const banner = document.getElementById('targetBanner');
            banner.innerHTML = `
                <span class="icon">${detail.icon || '🎯'}</span>
                <div class="info">
                    <div class="job-name">目标：${data.target_job}</div>
                    <div class="salary">💰 ${detail.salary_range || ''} | 📈 ${detail.career_path || ''}</div>
                </div>
                <div class="progress-ring">
                    <svg width="60" height="60">
                        <circle class="bg-circle" cx="30" cy="30" r="26" fill="none" stroke-width="4"/>
                        <circle class="fg-circle" cx="30" cy="30" r="26" fill="none" stroke-width="4" stroke-dashoffset="${offset}"/>
                    </svg>
                    <span class="pct">${pct}%</span>
                </div>
            `;
        }

        function renderStage(data) {
            const badge = document.getElementById('stageBadge');
            const label = data.stage_label || (data.stage === 'basic' ? '基础摸底阶段' : '精准提升阶段');
            const cls = data.stage === 'basic' ? 'stage-basic' : 'stage-targeted';
            badge.className = 'stage-badge ' + cls;
            badge.textContent = label;
        }

        function renderAnalysis(data) {
            const box = document.getElementById('analysisBox');
            if (data.stage === 'targeted' && data.analysis_summary) {
                const weakHtml = (data.weak_areas || []).map(w =>
                    `<span class="weak-tag">${w.area_name} (差距: ${(w.gap*100).toFixed(0)}%)</span>`
                ).join('');
                box.innerHTML = `
                    <h3>🔍 学习分析报告</h3>
                    <p>${data.analysis_summary}</p>
                    ${weakHtml ? '<div class="weak-tags">' + weakHtml + '</div>' : ''}
                    <div class="tip">💡 接下来的任务将重点强化这些薄弱环节，帮您快速达标！</div>
                `;
                box.style.display = '';
            } else if (data.stage === 'basic') {
                box.innerHTML = `
                    <h3>📊 基础摸底阶段</h3>
                    <p>前2周为基础摸底阶段，任务覆盖通信工程全部核心领域。完成这些任务后，系统将根据您的学习数据分析薄弱环节，为您生成精准的提升方案。</p>
                    <div class="tip">💡 建议认真完成每项任务，这将帮助系统更准确地评估您的能力水平</div>
                `;
                box.style.display = '';
            } else {
                box.style.display = 'none';
            }
        }

        function renderWeekNav(allWeeks) {
            const nav = document.getElementById('weekNav');
            if (allWeeks.length <= 1) { nav.innerHTML = ''; return; }
            nav.innerHTML = allWeeks.map(wk => {
                const weekNum = wk.replace('week_', '');
                const isActive = weekNum == currentWeekData.week_num;
                return `<div class="week-tab ${isActive ? 'active' : ''}" onclick="switchWeek('${wk}')">第${weekNum}周</div>`;
            }).join('');
        }

        function switchWeek(weekKey) {
        }

        function renderCareerInfo(detail) {
            if (!detail.icon) { document.getElementById('careerInfo').style.display = 'none'; return; }
            const skillsHtml = (detail.skills || []).map(s => `<span class="skill-tag">${s}</span>`).join('');
            const focusHtml = (detail.learning_focus || []).map(s => `<span class="skill-tag" style="background:#f6ffed;color:#389e0d;">${s}</span>`).join('');
            document.getElementById('careerInfo').innerHTML = `
                <h3> ${detail.icon || ''} ${currentWeekData.target_job} - 岗位信息</h3>
                <p style="font-size:14px;color:#666;margin-bottom:12px;">${detail.description || ''}</p>
                <div style="margin-bottom:8px;"><span style="font-size:13px;color:#999;">核心技能：</span></div>
                <div class="career-skills" style="margin-bottom:12px;">${skillsHtml}</div>
                <div style="margin-bottom:8px;"><span style="font-size:13px;color:#999;">学习重点：</span></div>
                <div class="career-skills" style="margin-bottom:12px;">${focusHtml}</div>
                <div class="career-path-text">💼 职业路径：${detail.career_path || ''}</div>
            `;
        }

        function renderTasks(tasks) {
            const grid = document.getElementById('taskGrid');
            if (tasks.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">暂无任务</div>';
                return;
            }
            const isBasic = currentWeekData.stage === 'basic';
            grid.innerHTML = tasks.map(t => {
                const gapTag = isBasic ? '' : `<span class="task-tag tag-gap">差距: ${t.gap}</span>`;
                const quizBadge = t.completed
                    ? '<span class="quiz-passed-badge">✓ 已通过测验</span>'
                    : '';
                return `
                <div class="task-card task-clickable ${t.completed ? 'completed' : ''}" id="task_${t.id}" onclick="openTaskDetail('${t.id}')">
                    <div class="task-content" style="width:100%;">
                        <div class="task-title">${t.title} ${quizBadge}</div>
                        <div class="task-detail">${t.detail}</div>
                        <div class="task-meta">
                            <span class="task-tag tag-area">📘 ${t.area}</span>
                            ${gapTag}
                            <span class="task-tag tag-time">⏱️ ${t.estimated_time}</span>
                            ${t.completed ? '<span class="task-tag tag-done">✅ 已完成</span>' : '<span class="task-tag" style="background:#e6f7ff;color:#1890ff;">💡 点击查看详情</span>'}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function openTaskDetail(taskId) {
            currentTaskId = taskId;
            const task = currentWeekData.tasks.find(t => t.id === taskId);
            if (!task) return;

            document.getElementById('modalTitle').textContent = task.title;
            document.getElementById('modalBody').innerHTML = '<div style="text-align:center;padding:40px;">⏳ 加载中...</div>';
            document.getElementById('completeTaskBtn').style.display = 'none';
            document.getElementById('taskModal').classList.add('active');

            try {
                const res = await fetch(`/api/weekly-tasks/${taskId}/detail`);
                const detail = await res.json();

                if (!detail.success) {
                    document.getElementById('modalBody').innerHTML = `<div style="padding:20px;color:#ff4d4f;">${detail.error || '加载失败'}</div>`;
                    return;
                }

                currentDetailData = detail;
                renderDetailContent(detail);

                const quizRes = await fetch(`/api/weekly-tasks/${taskId}/quiz`);
                const quizData = await quizRes.json();
                currentQuizData = quizData;

                renderQuizSection(quizData, task);

                updateCompleteButton(task, quizData);

            } catch (err) {
                document.getElementById('modalBody').innerHTML = `<div style="padding:20px;color:#ff4d4f;">加载失败：${err.message}</div>`;
            }
        }

        function renderDetailContent(detail) {
            const body = document.getElementById('modalBody');
            const task = detail.task;

            // PPT section
            let pptHtml = '';
            if (detail.has_ppt && detail.ppt_list.length > 0) {
                pptHtml = `
                    <div class="detail-section">
                        <h3><span class="icon">📊</span> 相关PPT资源</h3>
                        <div class="ppt-list">
                            ${detail.ppt_list.map(p => `
                                <a class="ppt-item" href="${p.url}" target="_blank">
                                    <span class="ppt-icon">📊</span>
                                    <div class="ppt-info">
                                        <div class="ppt-name">${p.name}</div>
                                        <div class="ppt-meta">${p.relevance || ''}</div>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                pptHtml = `
                    <div class="detail-section">
                        <h3><span class="icon">📊</span> PPT资源</h3>
                        <div class="empty-tip">
                            <span class="warning-icon">⚠️</span>
                            知识库中暂未找到与「${detail.area_name}」相关的PPT资源。
                        </div>
                    </div>
                `;
            }

            // Knowledge section
            let knowledgeHtml = '';
            if (detail.has_knowledge && detail.knowledge_info.length > 0) {
                knowledgeHtml = `
                    <div class="detail-section">
                        <h3><span class="icon">📚</span> 相关知识</h3>
                        <div class="knowledge-list">
                            ${detail.knowledge_info.map(k => `
                                <div class="knowledge-item">
                                    <div class="concept-name">${k.concept}</div>
                                    <div class="concept-desc">${k.description}</div>
                                    <div class="key-points">
                                        ${(k.key_points || []).map(kp => `<span class="kp-tag">${kp}</span>`).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                knowledgeHtml = `
                    <div class="detail-section">
                        <h3><span class="icon">📚</span> 知识库</h3>

        // ===== Pre-Check Logic =====
        let preCheckData = null;

        function openPreCheck() {
            const quizData = currentQuizData;
            if (!quizData || !quizData.fault_scenario) {
                startQuiz(currentTaskId);
                return;
            }

            const fs = quizData.fault_scenario;
            const checklist = quizData.pre_checklist || [];
            preCheckData = {
                fault: fs,
                checklist: checklist,
                answers: {},
                taskId: currentTaskId
            };

            document.getElementById('preCheckTitle').textContent = `🛡️ 「${fs.name}」操作前置自检`;
            document.getElementById('preCheckSubtitle').innerHTML = 
                `在开始处理故障前，请逐项确认以下操作规范。<br>` +
                `<strong style="color:#cf1322;">红色标记</strong>为必须确认项，未确认将无法开始实训；<strong style="color:#1890ff;">蓝色标记</strong>为建议项，未确认将在评分时扣分。`;

            renderPreCheckList();
            document.getElementById('preCheckWarning').classList.remove('active');
            document.getElementById('preCheckModal').classList.add('active');
        }

        function renderPreCheckList() {
            if (!preCheckData) return;
            const list = document.getElementById('preCheckList');
            const checklist = preCheckData.checklist;

            list.innerHTML = checklist.map((chk, idx) => {
                const tag = chk.required 
                    ? '<span class="pre-check-required-tag">必须</span>' 
                    : '<span class="pre-check-optional-tag">建议</span>';
                return `
                    <div class="pre-check-item ${preCheckData.answers[chk.id] ? 'checked' : ''}" 
                         id="chk_${chk.id}" 
                         onclick="togglePreCheckItem('${chk.id}')">
                        <div class="pre-check-checkbox"></div>
                        <div class="pre-check-text">${chk.text}${tag}</div>
                    </div>
                `;
            }).join('');

            updatePreCheckProgress();
        }

        function togglePreCheckItem(chkId) {
            if (!preCheckData) return;
            preCheckData.answers[chkId] = !preCheckData.answers[chkId];
            const el = document.getElementById(`chk_${chkId}`);
            if (preCheckData.answers[chkId]) {
                el.classList.add('checked');
                el.classList.remove('failed');
            } else {
                el.classList.remove('checked');
            }
            updatePreCheckProgress();
        }

        function updatePreCheckProgress() {
            if (!preCheckData) return;
            const checklist = preCheckData.checklist;
            const total = checklist.length;
            const checkedCount = checklist.filter(c => preCheckData.answers[c.id]).length;
            const requiredTotal = checklist.filter(c => c.required).length;
            const requiredChecked = checklist.filter(c => c.required && preCheckData.answers[c.id]).length;

            document.getElementById('preCheckCount').textContent = checkedCount;
            document.getElementById('preCheckTotal').textContent = total;
            document.getElementById('preCheckProgress').style.width = (checkedCount / total * 100) + '%';

            const allRequiredChecked = requiredChecked >= requiredTotal;
            const btn = document.getElementById('preCheckStartBtn');
            if (allRequiredChecked) {
                btn.disabled = false;
                btn.textContent = '确认并开始实训';
                btn.classList.add('btn-success');
                btn.classList.remove('btn-primary');
            } else {
                btn.disabled = true;
                btn.textContent = `请完成 ${requiredTotal - requiredChecked} 项必选检查`;
                btn.classList.remove('btn-success');
                btn.classList.add('btn-primary');
            }
        }

        function confirmPreCheck() {
            if (!preCheckData) return;
            const checklist = preCheckData.checklist;
            const failedRequired = checklist.filter(c => c.required && !preCheckData.answers[c.id]);

            if (failedRequired.length > 0) {
                const warning = document.getElementById('preCheckWarning');
                warning.innerHTML = '❌ 以下必须检查项未确认：<br>' + 
                    failedRequired.map(c => `• ${c.text}`).join('<br>');
                warning.classList.add('active');
                failedRequired.forEach(c => {
                    const el = document.getElementById(`chk_${c.id}`);
                    if (el && !el.classList.contains('checked')) {
                        el.classList.add('failed');
                        setTimeout(() => el.classList.remove('failed'), 2000);
                    }
                });
                return;
            }

            // All required checked - proceed to quiz
            window._preCheckAnswers = preCheckData.answers;
            closePreCheck();
            startQuiz(preCheckData.taskId);
        }

        function closePreCheck() {
            document.getElementById('preCheckModal').classList.remove('active');
            preCheckData = null;
        }

        function startQuiz(taskId) {
            const quizData = currentQuizData;
            if (!quizData || !quizData.has_quiz) return;

            const content = document.getElementById('quizContent');
            const questions = quizData.questions;

            // Fault banner inside quiz
            let faultBanner = '';
            if (quizData.fault_scenario) {
                const fs = quizData.fault_scenario;
                const levelIcons = { danger: '🚨', warning: '⚠️', info: 'ℹ️' };
                const levelLabels = { danger: '紧急', warning: '警告', info: '提示' };
                faultBanner = `
                    <div class="fault-banner level-${fs.level}" style="margin-bottom:16px;">
                        <div class="fault-header">
                            <span class="fault-icon">${levelIcons[fs.level] || '⚠️'}</span>
                            <span class="fault-title">正在处理故障：${fs.name}</span>

            content.innerHTML = `

                                    <div class="quiz-option" data-qid="${q.id}" data-idx="${i}" onclick="selectOption('${q.id}', ${i})">

                        </div>
                    `).join('')}
                </div>
                <div style="text-align:center;margin-top:16px;">

                </div>
            `;

            window._quizAnswers = {};
        }

        function selectOption(qid, idx) {
            window._quizAnswers = window._quizAnswers || {};
            window._quizAnswers[qid] = idx;

            document.querySelectorAll(`.quiz-option[data-qid="${qid}"]`).forEach(el => {
                el.classList.remove('selected');
            });
            document.querySelector(`.quiz-option[data-qid="${qid}"][data-idx="${idx}"]`).classList.add('selected');
        }

        async function submitQuiz(taskId) {
            const answers = window._quizAnswers || {};
            const quizData = currentQuizData;
            const questions = quizData.questions;

            // Check if all answered
            const unanswered = questions.filter(q => answers[q.id] === undefined);
            if (unanswered.length > 0) {
                alert(`还有 ${unanswered.length} 道题未作答，请完成所有题目！`);
                return;
            }

            const submitAnswers = {};
            for (const q of questions) {
                submitAnswers[q.id] = answers[q.id];
            }

            // Collect pre-check answers
            const preCheckAnswers = {};
            if (window._preCheckAnswers) {
                Object.assign(preCheckAnswers, window._preCheckAnswers);
            }

            const submitData = {
                answers: submitAnswers,
                pre_check: preCheckAnswers
            };

            // Add fault scenario ID if available
            if (quizData.fault_scenario) {
                submitData.fault_scenario_id = quizData.fault_scenario.id;
            }

            try {
                const res = await fetch(`/api/weekly-tasks/${taskId}/quiz`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(submitData)
                });
                const result = await res.json();

                if (result.pre_check_failed) {
                    // Show pre-check failed warning and re-open pre-check
                    alert('⚠️ ' + result.message + '\n\n' + result.failed_checks.map(c => '• ' + c).join('\n'));
                    // Re-open pre-check with current answers preserved
                    window._quizPreCheckAnswers = preCheckAnswers;
                    if (result.fault_scenario) {
                        quizData.fault_scenario = result.fault_scenario;
                    }
                    openPreCheck();
                    return;
                }

                if (result.success) {
                    showQuizResult(result, questions, submitAnswers);
                    // 失败锁定处理
                    if (result.locked) {
                        showLockOverlay(result.lock_message, result.lock_remaining_seconds);
                    }
                }
            } catch (err) {
                alert('提交失败：' + err.message);
            }
        }

        function showQuizResult(result, questions, submitAnswers) {
            const content = document.getElementById('quizContent');
            const questionsDiv = document.getElementById('quizQuestions');

            // Show correct/wrong on options
            result.results.forEach(r => {
                const qEl = document.querySelector(`#q_${r.id}`);
                if (!qEl) return;

                const correctIdx = r.correct_answer;
                qEl.querySelectorAll('.quiz-option').forEach(opt => {
                    const optIdx = parseInt(opt.dataset.idx);
                    opt.style.pointerEvents = 'none';
                    if (optIdx === correctIdx) {
                        opt.classList.add('correct');
                    } else if (optIdx === r.user_answer && !r.correct) {
                        opt.classList.add('wrong');
                    }
                });

                // Add analysis
                if (r.analysis) {
                    const analysisDiv = document.createElement('div');
                    analysisDiv.style.cssText = 'margin-top:10px;padding:8px 12px;background:#f8fafc;border-radius:8px;font-size:13px;color:#555;';
                    analysisDiv.innerHTML = `<strong>${r.correct ? '✅ 正确' : '❌ 错误'}：</strong>${r.analysis}`;
                    qEl.appendChild(analysisDiv);
                }
            });

            // Build result details
            let faultResultHtml = '';
            if (result.fault_scenario) {
                const fs = result.fault_scenario;
                faultResultHtml = `
                    <div style="margin-top:10px;padding:10px 14px;background:#f0f5ff;border-radius:8px;font-size:13px;color:#333;">
                        <strong>🔧 本次故障场景：</strong>${fs.name}
                    </div>
                `;
            }

            let safetyWarningHtml = '';
            if (result.safety_warning) {
                safetyWarningHtml = `
                    <div style="margin-top:10px;padding:10px 14px;background:#fffbe6;border-radius:8px;font-size:13px;color:#874d00;">
                        ⚠️ <strong>安全提示：</strong>${result.safety_warning}
                    </div>
                `;
            }

            // Show result summary
            const resultDiv = document.createElement('div');
            resultDiv.className = 'quiz-result ' + (result.passed ? 'pass' : 'fail');
            
            // Display safety score breakdown
            const safetyScore = result.safety_score !== undefined ? result.safety_score : 100;
            const finalScore = result.final_score !== undefined ? result.final_score : result.score;
            
            resultDiv.innerHTML = `
                <div class="result-msg">${result.message}</div>
                <div class="score-big">${finalScore}</div>
                <div class="result-msg">答对 ${result.correct} / ${result.total} 题（知识分：${result.score}）</div>
                ${faultResultHtml}
                <div class="safety-score-display">
                    <div class="score-item">
                        <div class="val" style="color:#667eea;">${result.score}</div>
                        <div class="lbl">知识得分</div>
                    </div>
                    <div class="score-item safety-item">
                        <div class="val ${safetyScore < 100 ? 'low' : ''}">${safetyScore}</div>
                        <div class="lbl">安全操作分</div>
                    </div>
                    <div class="score-item">
                        <div class="val" style="color:${result.passed ? '#52c41a' : '#ff4d4f'};">${finalScore}</div>
                        <div class="lbl">综合得分</div>
                    </div>
                </div>
                ${safetyWarningHtml}
                <div class="proficiency-tag proficiency-${result.proficiency_level}">
                    熟练度评估：${result.proficiency_level}
                </div>
                <div style="margin-top:12px;font-size:13px;color:#666;">
                    已尝试次数：${result.attempt_count} | ${result.next_step}
                </div>
            `;

            questionsDiv.appendChild(resultDiv);

            updateCompleteButton(currentTaskId, currentQuizData, result.passed);
        }

        function updateCompleteButton(task, quizData, forcePassed) {
            const btn = document.getElementById('completeTaskBtn');
            let passed = forcePassed !== undefined ? forcePassed : (quizData && quizData.already_passed);
            const hasQuiz = quizData && quizData.has_quiz;

            if (!hasQuiz) {
                btn.textContent = '✓ 标记为完成';
                btn.disabled = false;
                btn.style.display = '';
            } else if (passed) {
                btn.textContent = '✓ 标记为完成（已通过测验）';
                btn.disabled = false;
                btn.style.display = '';
            } else {
                btn.textContent = '⚠️ 需先通过测验';
                btn.disabled = true;
                btn.style.display = '';
            }
        }

        // ===== Troubleshoot (口语化排障) =====
        async function submitTroubleshoot(taskId) {
            const input = document.getElementById('troubleshootInput');
            const desc = input.value.trim();
            if (!desc) { alert('请描述故障现象'); return; }

            const history = document.getElementById('troubleshootHistory');
            history.innerHTML += `
                <div class="troubleshoot-msg user">
                    <div class="msg-label">我的描述</div>
                    ${desc}
                </div>
                <div class="troubleshoot-loading" id="tsLoading">

                    <div class="dots"><span></span><span></span><span></span></div>
                </div>

            input.value = '';
            history.scrollTop = history.scrollHeight;

            try {
                const res = await fetch(`/api/weekly-tasks/${taskId}/troubleshoot`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: desc })
                });
                const data = await res.json();
                document.getElementById('tsLoading')?.remove();

                if (data.success) {
                    history.innerHTML += `
                        <div class="troubleshoot-msg ai">
                            <div class="msg-label">AI排障分析${data.fallback ? '（离线模式）' : ''}</div>
                            ${data.analysis}
                        </div>
                    `;
                }
                history.scrollTop = history.scrollHeight;
            } catch (err) {
                document.getElementById('tsLoading')?.remove();
                alert('排障请求失败：' + err.message);
            }
        }

        // ===== Auto Engineering Report =====
        async function viewReport(taskId) {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">正在生成工程报告...</div>';

            try {
                const res = await fetch(`/api/weekly-tasks/${taskId}/report`);
                const report = await res.json();

                if (!report.success) {
                    modalBody.innerHTML = '<div class="empty-tip">报告生成失败</div>';
                    return;
                }

                const levelIcons = { danger: '🚨', warning: '⚠️', info: 'ℹ️' };
                const fs = report.fault_scenario || {};
                const cap = report.capability_assessment || {};
                const cp = report.competency_profile || {};
                const radarData = cp.radar_data || [];

                // 生成雷达图SVG
                const radarSize = 280;
                const cx = radarSize / 2;
                const cy = radarSize / 2;
                const radius = 100;
                const n = radarData.length;
                let radarPoints = [];
                let axisLines = [];
                let gridCircles = [];
                let labels = [];

                // 网格圆
                for (let g = 1; g <= 4; g++) {
                    const r = (radius * g) / 4;
                    gridCircles.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e0e0e0" stroke-width="1"/>`);
                }

                radarData.forEach((dim, i) => {
                    const angle = (Math.PI * 2 * i) / n - Math.PI / 2;

        // ===== Closed-loop Evaluation =====
        async function viewEvaluation(taskId, mode, question, response) {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">正在生成评价...</div>';

            try {
                const body = { mode: mode };
                if (question) body.question = question;
                if (response) body.response = response;

                const res = await fetch(`/api/weekly-tasks/${taskId}/evaluation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (!data.success) {
                    modalBody.innerHTML = '<div class="empty-tip">评价生成失败</div>';
                    return;
                }

                if (data.mode === 'review') {
                    renderReview(modalBody, data, taskId);
                } else if (data.mode === 'stress_test') {
                    renderStressResult(modalBody, data, taskId);
                }
            } catch (err) {
                modalBody.innerHTML = '<div class="empty-tip">评价请求失败：' + err.message + '</div>';
            }
        }

                }
            } catch (err) {
                resultDiv.innerHTML = '<div class="stress-evaluation" style="background:#fff1f0;border-color:#ffa39e;">评价请求失败：' + err.message + '</div>';
            }
        }

        function renderStressResult(container, data, taskId) {
            container.innerHTML = `
                <div class="report-section">
                    <div class="report-header">
                        <span style="font-size:24px;">🔥</span>
                        <span class="report-title">AI施压模拟 - 评价结果</span>
                    </div>
                    <div class="report-block">
                        <div class="report-block-title">考官问题</div>
                        <div style="font-size:13px;color:#555;">${data.question}</div>
                    </div>
                    <div class="report-block">
                        <div class="report-block-title">AI评价</div>
                        <div class="stress-evaluation">${data.evaluation}</div>
                    </div>
                    <div style="display:flex;gap:10px;margin-top:16px;">

        }

        // ===== Lock Check =====
        async function checkLockStatus(taskId) {
            try {
                const res = await fetch(`/api/weekly-tasks/${taskId}/lock-status`);
                const data = await res.json();
                if (data.locked) {
                    showLockOverlay(data.lock_reason, data.lock_remaining_seconds);
                    return true;
                }
                return false;
            } catch {
                return false;
            }
        }

        function showLockOverlay(reason, seconds) {
            const quizSection = document.getElementById('quizSection');
            if (!quizSection) return;
            let overlay = document.getElementById('lockOverlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'lockOverlay';
                overlay.className = 'lock-overlay active';
                quizSection.style.position = 'relative';
                quizSection.appendChild(overlay);
            }
            overlay.innerHTML = `
                <div class="lock-icon">🔒</div>
                <div class="lock-title">操作权限已锁定</div>
                <div class="lock-reason">${reason}</div>
                <div class="lock-timer" id="lockTimer">${Math.ceil(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}</div>
                <div class="lock-timer-label">冷却倒计时</div>
            `;
            overlay.classList.add('active');
            startLockTimer(seconds);
        }

        function startLockTimer(seconds) {
            let remaining = seconds;
            const timer = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(timer);
                    const overlay = document.getElementById('lockOverlay');
                    if (overlay) overlay.classList.remove('active');
                    return;
                }
                const el = document.getElementById('lockTimer');
                if (el) {
                    el.textContent = `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, '0')}`;
                }
            }, 1000);
        }
