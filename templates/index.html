<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵智尚人</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 950px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .header-text h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header-text p {
            font-size: 14px;
            opacity: 0.9;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            background: #f7f8fc;
            border-bottom: 1px solid #e8e8f0;
        }

        .mode-btn {
            padding: 8px 20px;
            border: 2px solid #e0e0e8;
            background: white;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #666;
        }

        .mode-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f7f8fc;
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .avatar {
            background: #e9eff6;
            color: #667eea;
        }

        .message-content {
            max-width: 72%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-top-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #1a1a1a;
            border-top-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .message-content pre {
            background: #1a1a2e;
            color: #e8e8e8;
            padding: 14px 16px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 12px 0;
            font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace;
            font-size: 14px;
        }

        .message-content code {
            font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace;
        }

        .message-content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 12px;
        }

        .input-area {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e8e8f0;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .image-preview {
            max-width: 60px;
            max-height: 60px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #667eea;
            display: none;
        }

        .image-preview.show {
            display: block;
        }

        .image-preview.remove {
            cursor: pointer;
            opacity: 0.7;
        }

        .image-preview.remove:hover {
            opacity: 1;
            border-color: #ff4757;
        }

        .upload-btn {
            padding: 12px;
            background: #f0f2f5;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.2s;
        }

        .upload-btn:hover {
            background: #e6e8ec;
        }

        .input-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f0f2f5;
            border-radius: 12px;
        }

        .input-box textarea {
            width: 100%;
            padding: 14px 16px;
            border: none;
            background: transparent;
            font-size: 16px;
            resize: none;
            max-height: 120px;
            outline: none;
            font-family: inherit;
            border-radius: 12px;
        }

        .send-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transform: translateY(-1px);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .typing-indicator .message-content {
            padding: 18px 20px;
        }

        .typing-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }

        .messages-area::-webkit-scrollbar {
            width: 8px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: #d0d0d8;
            border-radius: 4px;
        }

        .messages-area::-webkit-scrollbar-thumb:hover {
            background: #bcbcc4;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <div class="header-icon">🤖</div>
            <div class="header-text">
                <h1>灵智尚人</h1>
                <p>智能对话，随时为您服务</p>
            </div>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="fast" onclick="switchMode('fast')">
                ⚡ 快速回答
            </button>
            <button class="mode-btn" data-mode="deep" onclick="switchMode('deep')">
                🧠 深度思考
            </button>
        </div>

        <div class="messages-area" id="messagesArea">
            <div class="message assistant">
                <div class="avatar">🤖</div>
                <div class="message-content">
                    你好！我是灵智尚人，很高兴为您服务！您可以选择快速回答或深度思考模式来问我问题。
                </div>
            </div>
        </div>

        <div class="input-area">
            <img id="imagePreview" class="image-preview" src="" alt="预览">
            <input type="file" id="imageUpload" style="display: none;" accept="image/*">
            <button class="upload-btn" onclick="document.getElementById('imageUpload').click()">
                📷
            </button>
            <div class="input-box">
                <textarea id="userInput" placeholder="请输入您的问题..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize()"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                发送
            </button>
        </div>
    </div>

    <script>
        const messagesArea = document.getElementById('messagesArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        
        let selectedImage = null;
        let currentMode = 'fast';
        let isGenerating = false;

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
        }

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreview.classList.add('show', 'remove');
                    selectedImage = event.target.result.split(',')[1];
                };
                reader.readAsDataURL(file);
            }
        });

        imagePreview.addEventListener('click', function() {
            if (imagePreview.classList.contains('remove')) {
                imagePreview.src = '';
                imagePreview.classList.remove('show', 'remove');
                selectedImage = null;
                imageUpload.value = '';
            }
        });

        function autoResize() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        }

        function addMessage(content, isUser, imageBase64 = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (isUser ? 'user' : 'assistant');
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isUser ? '👤' : '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            let htmlContent = formatMessage(content);
            if (imageBase64) {
                htmlContent = `<img src="data:image/png;base64,${imageBase64}" alt="图片"><br><br>` + htmlContent;
            }
            contentDiv.innerHTML = htmlContent;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesArea.appendChild(messageDiv);
            
            scrollToBottom();
            return contentDiv;
        }

        function formatMessage(content) {
            return content
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/\n/g, '<br>');
        }

        function addTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'typingIndicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content typing-indicator';
            contentDiv.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesArea.appendChild(messageDiv);
            
            scrollToBottom();
            return messageDiv;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function scrollToBottom() {
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function setInputDisabled(disabled) {
            userInput.disabled = disabled;
            sendBtn.disabled = disabled;
            imageUpload.disabled = disabled;
        }

        async function sendMessage() {
            if (isGenerating) return;
            
            const message = userInput.value.trim();
            
            if (!message && !selectedImage) {
                addMessage('请描述这张图片', true, selectedImage);
            } else if (!message) {
                return;
            } else {
                addMessage(message, true, selectedImage);
            }
            
            userInput.value = '';
            userInput.style.height = 'auto';
            imagePreview.src = '';
            imagePreview.classList.remove('show', 'remove');
            imageUpload.value = '';
            setInputDisabled(true);
            addTypingIndicator();
            
            isGenerating = true;
            let fullResponse = '';
            let messageContentDiv = null;
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        message: message,
                        image: selectedImage,
                        mode: currentMode,
                        stream: true
                    }),
                });
                
                if (!response.ok) {
                    throw new Error('请求失败');
                }
                
                removeTypingIndicator();
                messageContentDiv = addMessage('', false, null);
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.content) {
                                    fullResponse += data.content;
                                    messageContentDiv.innerHTML = formatMessage(fullResponse);
                                    scrollToBottom();
                                } else if (data.error) {
                                    messageContentDiv.innerHTML = data.error;
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }
                
            } catch (error) {
                removeTypingIndicator();
                if (!messageContentDiv) {
                    addMessage('请求出错，请稍后重试', false);
                } else {
                    messageContentDiv.innerHTML = '请求出错，请稍后重试';
                }
            } finally {
                isGenerating = false;
                setInputDisabled(false);
                selectedImage = null;
                userInput.focus();
            }
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        userInput.focus();
    </script>
</body>
</html>
