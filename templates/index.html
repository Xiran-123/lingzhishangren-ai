                            <span style="font-weight:bold;color:#333;">${c.title}</span>
                            <span style="background:${c.level==='高级'?'#ff4d4f':c.level==='中级'?'#fa8c16':'#52c41a'};color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;">${c.level}</span>
                        </div>
                        <div style="font-size:12px;color:#666;margin-bottom:6px;">${c.category}</div>
                        <div style="font-size:12px;color:#555;line-height:1.4;">${c.description.substring(0, 80)}...</div>
                    </div>
                `).join('');

                overlay.innerHTML = `
                    <div style="background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;">
                        <div style="background:linear-gradient(135deg,#fa541c,#eb2f96);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;">
                            <div><h2 style="font-size:20px;font-weight:bold;margin:0;">⚖️ 工程伦理案例辩论</h2><p style="font-size:12px;opacity:0.9;margin:4px 0 0;">AI引导思考 · 价值判断训练 · 责任意识培养</p></div>
                            <button onclick="document.getElementById('ethicsOverlay').remove()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:20px;cursor:pointer;border-radius:50%;width:32px;height:32px;">×</button>
                        </div>
                        <div id="ethicsBody" style="padding:20px 24px;overflow-y:auto;flex:1;">
                            <div style="font-size:13px;color:#666;margin-bottom:14px;">选择一个案例开始辩论：</div>
                            <div style="display:grid;grid-template-columns:1fr;gap:12px;">${caseCards}</div>
                        </div>
                    </div>
                `;
            } catch (err) {
                overlay.innerHTML = '<div style="color:#fff;">加载失败：' + err.message + '</div>';
            }
        }

        async function selectEthicsCase(caseId) {
            try {
                const res = await fetch('/api/double-teacher/ethics-cases/' + caseId);
                const data = await res.json();
                const c = data.case;
                const body = document.getElementById('ethicsBody');
                if (!body) return;

                let questionInputs = c.questions.map((q, i) => `
                    <div style="margin-bottom:12px;">
                        <div style="font-size:13px;font-weight:bold;margin-bottom:6px;color:#333;">Q${i+1}. ${q}</div>
                        <textarea class="ethics-answer" rows="2" style="width:100%;padding:10px;border:2px solid #e8e8f0;border-radius:8px;font-size:13px;outline:none;resize:vertical;" placeholder="请阐述你的观点..."></textarea>
                    </div>
                `).join('');

                body.innerHTML = `
                    <div style="margin-bottom:16px;">
                        <div style="background:linear-gradient(135deg,#fa541c,#eb2f96);color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:12px;">
                            <div style="font-weight:bold;font-size:15px;margin-bottom:4px;">${c.title}</div>
                            <div style="font-size:12px;opacity:0.9;">${c.category} · ${c.level}</div>
                        </div>
                        <div style="background:#f8f9fc;border-radius:10px;padding:14px;font-size:13px;color:#444;line-height:1.6;margin-bottom:14px;">${c.description}</div>
                    </div>
                    <div style="margin-bottom:14px;">
                        <div style="font-size:13px;font-weight:bold;margin-bottom:10px;">💭 请回答以下问题（AI将分析你的思维质量）</div>
                        ${questionInputs}
                    </div>
                    <div style="display:flex;gap:10px;">
                        <button class="btn btn-secondary" onclick="showEthicsDebate()">返回案例列表</button>
                        <button class="btn btn-primary" style="flex:1;" onclick="submitEthicsAnswers('${caseId}')">提交辩论 · AI分析思维质量</button>
                    </div>
                `;
            } catch (err) { alert('加载失败：' + err.message); }
        }

        async function submitEthicsAnswers(caseId) {
            const inputs = document.querySelectorAll('.ethics-answer');
            const answers = Array.from(inputs).map(t => t.value);
            if (answers.some(a => a.length < 5)) { alert('请完整回答所有问题'); return; }

            try {
                const res = await fetch('/api/double-teacher/ethics-cases/' + caseId + '/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({answers})
                });
                const data = await res.json();
                const a = data.analysis;
                const body = document.getElementById('ethicsBody');
                if (!body) return;

                let dimBars = Object.entries(a.dimensions).map(([k, v]) => {
                    const nameMap = {user_perspective:'用户视角',responsibility:'责任意识',feasibility:'可行性',ethics_awareness:'伦理意识'};
                    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                        <span style="font-size:12px;color:#555;width:70px;">${nameMap[k]}</span>
                        <div style="flex:1;background:#f0f0f0;border-radius:4px;height:8px;overflow:hidden;">
                            <div style="width:${v}%;background:linear-gradient(90deg,#fa541c,#eb2f96);height:100%;border-radius:4px;"></div>
                        </div>
                        <span style="font-size:12px;font-weight:bold;min-width:35px;text-align:right;">${v}</span>
                    </div>`;
                }).join('');

                body.innerHTML = `
                    <div style="text-align:center;padding:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:12px;margin-bottom:16px;">
                        <div style="font-size:14px;opacity:0.9;margin-bottom:4px;">思维质量综合评分</div>
                        <div style="font-size:48px;font-weight:bold;">${a.score}</div>
                        <div style="font-size:13px;">${a.score>=60?'🎉 表现优秀，思维清晰':a.score>=40?'👍 思考较为全面':'💪 继续锻炼批判性思维'}</div>
                    </div>
                    <div style="background:#f8f9fc;border-radius:10px;padding:16px;margin-bottom:14px;">
                        <div style="font-size:13px;font-weight:bold;margin-bottom:10px;">📊 维度分析</div>
                        ${dimBars}
                    </div>
                    <div style="background:#f6ffed;border-radius:10px;padding:16px;margin-bottom:14px;">
                        <div style="font-size:13px;font-weight:bold;margin-bottom:8px;color:#52c41a;">💡 老师引导建议</div>
                        <div style="font-size:12px;color:#444;line-height:1.6;">${data.teacher_guidance}</div>
                    </div>
                    <div style="display:flex;gap:10px;">
                        <button class="btn btn-secondary" style="flex:1;" onclick="showEthicsDebate()">返回案例列表</button>
                        <button class="btn btn-primary" onclick="document.getElementById('ethicsOverlay').remove()">完成</button>
                    </div>
                `;
            } catch (err) { alert('提交失败：' + err.message); }
        }

        // ===== 教师练习题管理 =====
        async function showExerciseManager() {
            if (document.getElementById('exMgrOverlay')) return;
            const overlay = document.createElement('div');
            overlay.id = 'exMgrOverlay';
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:99999;display:flex;justify-content:center;align-items:center;padding:20px;';
            overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
            overlay.innerHTML = '<div style="color:#fff;font-size:16px;">加载练习题库...</div>';
            document.body.appendChild(overlay);

            try {
                const res = await fetch('/api/teacher/exercises');
                const data = await res.json();
                if (!data.success) { overlay.innerHTML = '<div style="color:#fff;">' + (data.error || '加载失败') + '</div>'; return; }

                const exercises = data.exercises || [];
                // 按知识点分组
                const grouped = {};
                exercises.forEach(e => {
                    const kp = e.knowledge_point || '未分类';
                    if (!grouped[kp]) grouped[kp] = [];
                    grouped[kp].push(e);
                });

                let groupHtml = Object.entries(grouped).map(([kp, list]) => {
                    let items = list.map(e => {
                        const typeMap = {choice:'选择题', fill:'填空题', short:'简答题'};
                        const diffStars = '★'.repeat(e.difficulty || 1) + '☆'.repeat(Math.max(0, 3 - (e.difficulty || 1)));
                        const sourceTag = e.source === 'custom'
                            ? '<span style="background:#fa541c;color:#fff;padding:1px 6px;border-radius:4px;font-size:10px;">自定义</span>'
                            : '<span style="background:#1890ff;color:#fff;padding:1px 6px;border-radius:4px;font-size:10px;">内置</span>';
                        const delBtn = e.source === 'custom'
                            ? `<button class="btn btn-secondary" style="padding:2px 10px;font-size:11px;color:#ff4d4f;border:1px solid #ffa39e;" onclick="deleteExercise('${e.id}')">删除</button>`
                            : '';
                        return `
                            <div style="background:#f8f9fc;border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                                <div style="flex:1;">
                                    <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;">
                                        ${sourceTag}
                                        <span style="font-size:11px;color:#888;">${typeMap[e.type] || e.type}</span>
                                        <span style="color:#faad14;font-size:11px;">${diffStars}</span>
                                    </div>
                                    <div style="font-size:13px;color:#333;margin-bottom:3px;">${e.question}</div>
                                    <div style="font-size:11px;color:#888;">答案：${e.answer}</div>
                                </div>
                                ${delBtn}
                            </div>
                        `;
                    }).join('');
                    return `
                        <div style="margin-bottom:16px;">
                            <div style="font-size:13px;font-weight:bold;color:#1a1a1a;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #f0f0f0;">
                                📚 ${kp} <span style="color:#888;font-weight:normal;font-size:12px;">(${list.length}题)</span>
                            </div>
                            ${items}
                        </div>
                    `;
                }).join('');

                overlay.innerHTML = `
                    <div style="background:#fff;border-radius:16px;max-width:800px;width:100%;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;">
                        <div style="background:linear-gradient(135deg,#fa541c,#fa8c16);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;">
                            <div>
                                <h2 style="font-size:20px;font-weight:bold;margin:0;">📝 练习题管理</h2>
                                <p style="font-size:12px;opacity:0.9;margin:4px 0 0;">共 ${data.total} 题（内置 ${data.builtin_count} · 自定义 ${data.custom_count}）</p>
                            </div>
                            <div style="display:flex;gap:8px;">
                                <input type="file" id="exImportFile" accept=".json" style="display:none;" onchange="importExercises(event)">
                                <button onclick="document.getElementById('exImportFile').click()" style="background:#52c41a;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;">📤 导入题库</button>
                                <button onclick="downloadExerciseTemplate()" style="background:rgba(255,255,255,0.25);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;">📥 下载模板</button>
                                <button onclick="showAddExerciseForm()" style="background:#fff;color:#fa541c;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;">➕ 添加题目</button>
                                <button onclick="document.getElementById('exMgrOverlay').remove()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:20px;cursor:pointer;border-radius:50%;width:32px;height:32px;">×</button>
                            </div>
                        </div>
                        <div id="exMgrBody" style="padding:20px 24px;overflow-y:auto;flex:1;">
                            ${groupHtml || '<div style="text-align:center;padding:40px;color:#999;">暂无题目</div>'}
                        </div>
                    </div>
                `;
            } catch (err) {
                overlay.innerHTML = '<div style="color:#fff;">加载失败：' + err.message + '</div>';
            }
        }

        function showAddExerciseForm() {
            const body = document.getElementById('exMgrBody');
            if (!body) return;
            body.innerHTML = `
                <div style="max-width:600px;margin:0 auto;">
                    <div style="font-size:15px;font-weight:bold;margin-bottom:16px;color:#fa541c;">➕ 添加新练习题</div>
                    <div style="margin-bottom:14px;">
                        <label style="font-size:13px;font-weight:bold;display:block;margin-bottom:6px;">知识点 *</label>
                        <input type="text" id="exKp" list="kpList" placeholder="输入或选择知识点（如：傅里叶变换、5G NR等）" style="width:100%;padding:10px 14px;border:2px solid #e8e8f0;border-radius:10px;font-size:14px;outline:none;">
                        <datalist id="kpList">
                            <option value="傅里叶变换">
                            <option value="奈奎斯特采样定理">
                            <option value="QAM调制">
                            <option value="OFDM技术">
                            <option value="信道编码">
                            <option value="MIMO技术">
                            <option value="5G NR">
                            <option value="天线原理">
                            <option value="射频工程">
                        </datalist>
                    </div>
                    <div style="margin-bottom:14px;">
                        <label style="font-size:13px;font-weight:bold;display:block;margin-bottom:6px;">题型 *</label>
                        <select id="exType" onchange="onTypeChange()" style="width:100%;padding:10px 14px;border:2px solid #e8e8f0;border-radius:10px;font-size:14px;outline:none;">
                            <option value="choice">选择题（单选）</option>
                            <option value="fill">填空题</option>
                            <option value="short">简答题</option>
                        </select>
                    </div>
                    <div style="margin-bottom:14px;">
                        <label style="font-size:13px;font-weight:bold;display:block;margin-bottom:6px;">难度</label>
                        <select id="exDiff" style="width:100%;padding:10px 14px;border:2px solid #e8e8f0;border-radius:10px;font-size:14px;outline:none;">
                            <option value="1">★ 简单</option>
                            <option value="2" selected>★★ 中等</option>
                            <option value="3">★★★ 困难</option>
                        </select>
                    </div>
                    <div style="margin-bottom:14px;">
                        <label style="font-size:13px;font-weight:bold;display:block;margin-bottom:6px;">题目内容 *</label>
                        <textarea id="exQuestion" rows="3" style="width:100%;padding:10px 14px;border:2px solid #e8e8f0;border-radius:10px;font-size:14px;outline:none;resize:vertical;" placeholder="输入题目内容..."></textarea>
                    </div>
                    <div id="exOptionsArea" style="margin-bottom:14px;">
                        <label style="font-size:13px;font-weight:bold;display:block;margin-bottom:6px;">选项（选择题）</label>
                        <div id="optionsContainer">
                            <input type="text" class="ex-option" placeholder="A. 选项内容" style="width:100%;padding:8px 12px;border:2px solid #e8e8f0;border-radius:8px;font-size:13px;margin-bottom:6px;outline:none;">
                            <input type="text" class="ex-option" placeholder="B. 选项内容" style="width:100%;padding:8px 12px;border:2px solid #e8e8f0;border-radius:8px;font-size:13px;margin-bottom:6px;outline:none;">
                            <input type="text" class="ex-option" placeholder="C. 选项内容" style="width:100%;padding:8px 12px;border:2px solid #e8e8f0;border-radius:8px;font-size:13px;margin-bottom:6px;outline:none;">
                            <input type="text" class="ex-option" placeholder="D. 选项内容" style="width:100%;padding:8px 12px;border:2px solid #e8e8f0;border-radius:8px;font-size:13px;margin-bottom:6px;outline:none;">
                        </div>
                        <button onclick="addOption()" style="background:#f0f0f0;border:1px dashed #ccc;padding:4px 12px;border-radius:6px;font-size:12px;cursor:pointer;color:#666;">+ 添加选项</button>
                    </div>
                    <div style="margin-bottom:14px;">
                        <label style="font-size:13px;font-weight:bold;display:block;margin-bottom:6px;">正确答案 *</label>
                        <input type="text" id="exAnswer" placeholder="选择题填字母（如A），填空/简答填答案内容" style="width:100%;padding:10px 14px;border:2px solid #e8e8f0;border-radius:10px;font-size:14px;outline:none;">
                    </div>
                    <div style="margin-bottom:14px;">
                        <label style="font-size:13px;font-weight:bold;display:block;margin-bottom:6px;">答案解析（可选）</label>
                        <textarea id="exAnalysis" rows="2" style="width:100%;padding:10px 14px;border:2px solid #e8e8f0;border-radius:10px;font-size:13px;outline:none;resize:vertical;" placeholder="输入答案解析..."></textarea>
                    </div>
                    <div style="display:flex;gap:10px;">
                        <button class="btn btn-secondary" onclick="showExerciseManager()">返回列表</button>
                        <button class="btn btn-primary" style="flex:1;background:linear-gradient(135deg,#fa541c,#fa8c16);" onclick="submitAddExercise()">保存题目</button>
                    </div>
                </div>
            `;
        }

        function onTypeChange() {
            const type = document.getElementById('exType').value;
            const area = document.getElementById('exOptionsArea');
            if (area) area.style.display = type === 'choice' ? 'block' : 'none';
        }

        function addOption() {
            const container = document.getElementById('optionsContainer');
            if (!container) return;
            const count = container.children.length;
            const letters = 'ABCDEFGH';
            const letter = letters[count] || '?';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'ex-option';
            input.placeholder = `${letter}. 选项内容`;
            input.style.cssText = 'width:100%;padding:8px 12px;border:2px solid #e8e8f0;border-radius:8px;font-size:13px;margin-bottom:6px;outline:none;';
            container.appendChild(input);
        }

        async function submitAddExercise() {
            const kp = document.getElementById('exKp').value.trim();
            const type = document.getElementById('exType').value;
            const difficulty = parseInt(document.getElementById('exDiff').value);
            const question = document.getElementById('exQuestion').value.trim();
            const answer = document.getElementById('exAnswer').value.trim();
            const analysis = document.getElementById('exAnalysis').value.trim();

            if (!kp || !question || !answer) { alert('知识点、题目和答案不能为空'); return; }

            let options = [];
            if (type === 'choice') {
                options = Array.from(document.querySelectorAll('.ex-option')).map(i => i.value.trim()).filter(v => v);
                if (options.length < 2) { alert('选择题至少需要2个选项'); return; }
            }

            try {
                const res = await fetch('/api/teacher/exercises/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({knowledge_point: kp, type, difficulty, question, options, answer, analysis})
                });
                const data = await res.json();
                if (data.success) {
                    alert('✅ ' + data.message);
                    showExerciseManager(); // 刷新列表
                } else {
                    alert('保存失败：' + (data.error || ''));
                }
            } catch (err) { alert('保存失败：' + err.message); }
        }

        async function deleteExercise(exId) {
            if (!confirm('确认删除这道自定义题目？')) return;
            try {
                const res = await fetch('/api/teacher/exercises/' + exId, {method: 'DELETE'});
                const data = await res.json();
                if (data.success) { alert('已删除'); showExerciseManager(); }
                else { alert('删除失败：' + (data.error || '')); }
            } catch (err) { alert('删除失败：' + err.message); }
        }

        async function importExercises(event) {
            const file = event.target.files[0];
            if (!file) return;
            try {
                const text = await file.text();
                const json = JSON.parse(text);
                const res = await fetch('/api/teacher/exercises/import', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(json)
                });
                const data = await res.json();
                if (!data.success) { alert('导入失败：' + (data.error || '')); return; }
                let msg = `✅ 成功导入 ${data.added_count} 道题目`;
                if (data.error_count > 0) {
                    msg += `\n⚠️ ${data.error_count} 条失败：\n` + data.errors.join('\n');
                }
                alert(msg);
                showExerciseManager();
            } catch (err) {
                alert('文件解析失败：' + err.message + '\n请确保是合法的JSON文件');
            }
            event.target.value = ''; // 重置input
        }

        async function downloadExerciseTemplate() {
            try {
                const res = await fetch('/api/teacher/exercises/template');
                const data = await res.json();
                const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '练习题导入模板.json';
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) { alert('下载模板失败：' + err.message); }
        }
    </script>

    <!-- 上传知识库文件模态框 -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-title">
                📤 上传知识库文件
                <span class="modal-close" onclick="closeUploadModal()">×</span>
            </div>
            
            <div class="upload-area" id="uploadArea">

            <input type="file" id="fileInput" class="file-input" accept=".docx,.doc,.pptx,.ppt,.txt">
            
            <div class="upload-progress" id="uploadProgress">

            </div>
            
            <button class="modal-btn cancel" onclick="closeUploadModal()" style="width: 100%;">取消</button>
        </div>
    </div>

    <link rel="stylesheet" href="/static/desktop_pet.css">

</body>
