<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵智尚人</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a1838 0%, #0d1f45 50%, #1a2d6a 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 全局粒子背景层 */
        .bg-particles {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
            overflow: hidden;
        }
        .bg-particles span {
            position: absolute; display: block;
            border-radius: 50%;
            background: rgba(0, 200, 255, 0.7);
            box-shadow: 0 0 6px rgba(0, 200, 255, 0.8);
            animation: bgFloat linear infinite;
        }
        @keyframes bgFloat {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            10%  { opacity: 0.9; }
            90%  { opacity: 0.7; }
            100% { transform: translateY(-120vh) translateX(30px); opacity: 0; }
        }
        /* 粒子位置/尺寸/时长（18 个） */
        .bg-particles span:nth-child(1)  { left: 5%;  top: 85%; width:3px; height:3px; animation-duration: 14s; animation-delay: 0s; }
        .bg-particles span:nth-child(2)  { left: 12%; top: 60%; width:4px; height:4px; animation-duration: 16s; animation-delay: -2s; }
        .bg-particles span:nth-child(3)  { left: 20%; top: 30%; width:2px; height:2px; animation-duration: 12s; animation-delay: -5s; }
        .bg-particles span:nth-child(4)  { left: 28%; top: 80%; width:3px; height:3px; animation-duration: 15s; animation-delay: -1s; }
        .bg-particles span:nth-child(5)  { left: 35%; top: 15%; width:4px; height:4px; animation-duration: 18s; animation-delay: -7s; }
        .bg-particles span:nth-child(6)  { left: 42%; top: 70%; width:2px; height:2px; animation-duration: 13s; animation-delay: -3s; }
        .bg-particles span:nth-child(7)  { left: 50%; top: 45%; width:3px; height:3px; animation-duration: 17s; animation-delay: -6s; }
        .bg-particles span:nth-child(8)  { left: 58%; top: 90%; width:4px; height:4px; animation-duration: 14s; animation-delay: -4s; }
        .bg-particles span:nth-child(9)  { left: 65%; top: 25%; width:2px; height:2px; animation-duration: 16s; animation-delay: -8s; }
        .bg-particles span:nth-child(10) { left: 72%; top: 65%; width:3px; height:3px; animation-duration: 12s; animation-delay: -2s; }
        .bg-particles span:nth-child(11) { left: 80%; top: 40%; width:4px; height:4px; animation-duration: 15s; animation-delay: -5s; }
        .bg-particles span:nth-child(12) { left: 88%; top: 85%; width:2px; height:2px; animation-duration: 18s; animation-delay: -9s; }
        .bg-particles span:nth-child(13) { left: 95%; top: 55%; width:3px; height:3px; animation-duration: 13s; animation-delay: -1s; }
        .bg-particles span:nth-child(14) { left: 8%;  top: 50%; width:3px; height:3px; animation-duration: 16s; animation-delay: -6s; }
        .bg-particles span:nth-child(15) { left: 25%; top: 95%; width:4px; height:4px; animation-duration: 14s; animation-delay: -3s; }
        .bg-particles span:nth-child(16) { left: 48%; top: 5%;  width:2px; height:2px; animation-duration: 17s; animation-delay: -7s; }
        .bg-particles span:nth-child(17) { left: 68%; top: 80%; width:3px; height:3px; animation-duration: 15s; animation-delay: -4s; }
        .bg-particles span:nth-child(18) { left: 92%; top: 10%; width:2px; height:2px; animation-duration: 18s; animation-delay: -8s; }

        .chat-container {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(0, 200, 255, 0.1);
            width: 100%;
            max-width: 960px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative; z-index: 1;
        }

        .header {
            background: linear-gradient(135deg, #0a1a4a 0%, #0e2a60 100%);
            color: white;
            padding: 14px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 10px;
            border-bottom: 1px solid rgba(0, 200, 255, 0.2);
            position: relative;
        }
        /* header 装饰线 */
        .header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,200,255,0.6), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header-right {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        .nav-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #e0ecff;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            white-space: nowrap;
            line-height: 1.4;
        }

        .nav-btn:hover {
            background: rgba(0, 200, 255, 0.2);
            border-color: rgba(0, 200, 255, 0.5);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 130, 255, 0.3);
        }

        /* ===== 设置下拉菜单 ===== */
        .settings-wrap { position: relative; display: inline-block; }
        .settings-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
            padding: 6px;
            min-width: 180px;
            z-index: 10000;
        }
        .settings-menu.open { display: block; }
        .settings-item {
            display: block;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }
        .settings-item:hover { background: #f0f5ff; }
        .settings-danger { color: #ff4d4f; }

        .header-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #0080ff, #00c8ff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(0, 130, 255, 0.4);
        }

        .header-text h1 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .header-text p {
            font-size: 12px;
            opacity: 0.65;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(91,141,255,0.15);
        }

        .mode-btn {
            padding: 8px 20px;
            border: 2px solid rgba(102,126,234,0.25);
            background: rgba(255,255,255,0.7);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a5a8a;
        }

        .mode-btn:hover {
            border-color: #667eea;
            color: #667eea;
            background: rgba(255,255,255,0.9);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: linear-gradient(180deg, #f0f4ff 0%, #e8edff 50%, #f0f4ff 100%);
            position: relative;
        }
        /* 聊天区背景装饰：淡淡的网格 + 光圈 */
        .messages-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(91,141,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(91,141,255,0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }
        .messages-area::after {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(91,141,255,0.12), transparent 70%);
            bottom: -100px; right: -80px;
            pointer-events: none;
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .avatar {
            background: transparent;
            padding: 0;
            box-shadow: none;
        }
        .message.assistant .avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .message-content {
            max-width: 72%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-top-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: linear-gradient(135deg, rgba(240,244,255,0.95) 0%, rgba(232,237,255,0.95) 100%);
            color: #1a1a2e;
            border-top-left-radius: 4px;
            border: 1px solid rgba(102,126,234,0.12);
            box-shadow: 0 2px 8px rgba(91,141,255,0.08);
        }

        .message-content pre {
            background: #1a1a2e;
            color: #e8e8e8;
            padding: 14px 16px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 12px 0;
            font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace;
            font-size: 14px;
        }

        .message-content code {
            font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace;
        }

        .message-content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 12px;
        }

        /* AI生成内容标识（合规要求） */
        .ai-gen-tag {
            display: inline-block;
            font-size: 11px;
            line-height: 1;
            color: #5b6cff;
            background: rgba(91, 108, 255, 0.1);
            border: 1px solid rgba(91, 108, 255, 0.35);
            border-radius: 4px;
            padding: 3px 8px;
            margin-bottom: 8px;
            user-select: none;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .action-btn {
            padding: 6px 14px;
            background: #f0f2f5;
            border: none;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
        }

        .action-btn:hover {
            background: #667eea;
            color: white;
        }

        .input-area {
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(240,244,255,0.85));
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(91,141,255,0.15);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .image-preview {
            max-width: 60px;
            max-height: 60px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #667eea;
            display: none;
        }

        .image-preview.show {
            display: block;
        }

        .image-preview.remove {
            cursor: pointer;
            opacity: 0.7;
        }

        .image-preview.remove:hover {
            opacity: 1;
            border-color: #ff4757;
        }

        .upload-btn {
            padding: 12px;
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(102,126,234,0.15);
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.2s;
        }

        .upload-btn:hover {
            background: rgba(255,255,255,0.95);
        }

        .input-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.75);
            border: 1px solid rgba(102,126,234,0.15);
            border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-box:focus-within {
            border-color: rgba(102,126,234,0.5);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .input-box textarea {
            width: 100%;
            padding: 14px 16px;
            border: none;
            background: transparent;
            font-size: 16px;
            resize: none;
            max-height: 120px;
            outline: none;
            font-family: inherit;
            border-radius: 12px;
        }

        .send-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transform: translateY(-1px);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .typing-indicator .message-content {
            padding: 18px 20px;
        }

        .typing-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }

        .messages-area::-webkit-scrollbar {
            width: 8px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: #d0d0d8;
            border-radius: 4px;
        }

        .messages-area::-webkit-scrollbar-thumb:hover {
            background: #bcbcc4;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            margin-left: auto;
            font-size: 24px;
            color: #999;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #666;
        }

        .upload-area {
            border: 2px dashed #e0e0e8;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #667eea;
            background: #f8f9fc;
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 16px;
            color: #666;
            margin-bottom: 5px;
        }

        .upload-hint {
            font-size: 12px;
            color: #999;
        }

        .file-input {
            display: none;
        }

        .upload-progress {
            display: none;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e8;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid;
        }

        .modal-btn.cancel {
            background: white;
            border-color: #ddd;
            color: #666;
        }

        .modal-btn.cancel:hover {
            background: #f5f5f5;
        }

        /* ====================== 会话侧边栏（豆包风格） ====================== */
        .conv-sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 270px;
            background: rgba(10, 26, 74, 0.96);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(0, 200, 255, 0.25);
            box-shadow: 8px 0 40px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 900;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .conv-sidebar.open { transform: translateX(0); }

        .conv-side-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 14px 12px;
            border-bottom: 1px solid rgba(0, 200, 255, 0.15);
        }
        .conv-side-logo {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: rgba(0, 200, 255, 0.12);
            border: 1px solid rgba(0, 200, 255, 0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .conv-side-title {
            flex: 1;
            color: #d8e8ff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .conv-collapse-btn {
            background: none; border: none;
            color: rgba(200, 216, 255, 0.55);
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .conv-collapse-btn:hover { color: #fff; background: rgba(0, 200, 255, 0.12); }

        .conv-new-btn {
            margin: 12px 12px 4px;
            padding: 11px;
            border: 1px solid rgba(0, 200, 255, 0.35);
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.35), rgba(118, 75, 162, 0.35));
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .conv-new-btn:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 4px 18px rgba(102, 126, 234, 0.45);
            transform: translateY(-1px);
        }
        .conv-new-btn:active { transform: scale(0.98); }

        .conv-section-label {
            padding: 14px 18px 6px;
            color: rgba(200, 216, 255, 0.45);
            font-size: 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 14px;
        }
        .conv-list::-webkit-scrollbar { width: 5px; }
        .conv-list::-webkit-scrollbar-thumb { background: rgba(0, 200, 255, 0.25); border-radius: 3px; }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.18s;
            position: relative;
            margin-bottom: 2px;
        }
        .conv-item:hover { background: rgba(0, 200, 255, 0.08); }
        .conv-item.active {
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.28), rgba(118, 75, 162, 0.15));
            box-shadow: inset 3px 0 0 #667eea;
        }
        .conv-item-icon {
            width: 32px; height: 32px;
            border-radius: 9px;
            background: rgba(0, 200, 255, 0.1);
            border: 1px solid rgba(0, 200, 255, 0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .conv-item-body { flex: 1; min-width: 0; }
        .conv-item-title {
            color: #d8e8ff;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item-meta {
            color: rgba(200, 216, 255, 0.4);

            </div>

                🔔
                <span id="notificationBadge" class="notification-badge" style="position: absolute; top: 10px; right: 10px; background: #ff4757; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: none; align-items: center; justify-content: center;">0</span>

    <script>
        const messagesArea = document.getElementById('messagesArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        
        let selectedImage = null;
        let currentMode = 'fast';
        let isGenerating = false;
        let chatHistory = [];
        let conversationHistory = [];  // 用于API的对话历史
        let currentUser = { role: 'student', student_name: '', class_name: '' };

        // AI生成内容标识（合规要求）
        const AI_GEN_TAG = '<div class="ai-gen-tag">✨ AI 生成内容</div>';

        // 本地存储键名
        const STORAGE_KEY = 'lingzhi_chat_history';
        
        // 获取当前用户信息
        async function loadCurrentUser() {
            try {
                const response = await fetch('/current-user');
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data;
                    renderNavigation();
                    updateHeaderTitle();
                    updateUserAvatar();
                    loadNotificationCount();
                }
            } catch (error) {
                console.error('获取用户信息失败:', error);
            }
        }
        
        // 加载未读通知数量
        async function loadNotificationCount() {
            try {
                const response = await fetch('/api/notifications');
                const data = await response.json();
                
                if (data.notifications) {
                    const unreadCount = data.notifications.filter(n => !n.read).length;
                    const badge = document.getElementById('notificationBadge');
                    
                    if (unreadCount > 0) {
                        badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
                        badge.style.display = 'flex';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            } catch (error) {
                console.error('加载通知数量失败:', error);
            }
        }
        
        // 显示通知弹窗
        async function showNotificationModal() {
            try {
                const response = await fetch('/api/notifications');
                const data = await response.json();
                
                let content = '';
                
                if (!data.notifications || data.notifications.length === 0) {
                    content = `
                        <div style="text-align: center; padding: 40px; color: #999;">
                            <div style="font-size: 48px;">📭</div>
                            <p>暂无通知</p>
                        </div>
                    `;
                } else {
                    content = data.notifications.map(notif => `
                        <div style="background: ${notif.read ? '#f8f9fc' : '#fff5f5'}; border-radius: 10px; padding: 16px; margin-bottom: 12px; border-left: 4px solid ${notif.read ? '#667eea' : '#ff4757'};">
                            <div style="font-weight: 600; color: #333; margin-bottom: 8px;">${escapeHtml(notif.title)}</div>
                            <div style="font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 10px;">${escapeHtml(notif.content)}</div>
                            <div style="font-size: 12px; color: #999;">
                                <span>📁 ${notif.class_name || '未指定班级'}</span> &nbsp;
                                <span>📅 ${notif.created_at}</span>
                            </div>
                            ${!notif.read && currentUser.role === 'student' ? 
                                `<button onclick="markNotificationRead(${notif.id})" style="margin-top: 10px; padding: 6px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">✓ 标记已读</button>` : 
                                ''}
                        </div>
                    `).join('');
                }
                
                const modal = document.createElement('div');
                modal.id = 'notificationModal';
                modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;';
                modal.innerHTML = `
                    <div style="background: white; border-radius: 16px; max-width: 500px; width: 90%; max-height: 80vh; overflow: hidden;">
                        <div style="padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                            <h3 style="margin: 0;">📢 我的通知</h3>
                            <button onclick="closeNotificationModal()" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">✕</button>
                        </div>
                        <div style="padding: 20px; max-height: 60vh; overflow-y: auto;">
                            ${content}
                        </div>
                    </div>
                `;
                
                document.body.appendChild(modal);
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) closeNotificationModal();
                });
                
                loadNotificationCount();
            } catch (error) {
                console.error('加载通知失败:', error);
            }
        }
        
        function closeNotificationModal() {
            const modal = document.getElementById('notificationModal');
            if (modal) modal.remove();
        }
        
        async function markNotificationRead(notificationId) {
            try {
                await fetch(`/api/notifications/${notificationId}`, {
                    method: 'PUT'
                });
                showNotificationModal();
            } catch (error) {
                console.error('标记已读失败:', error);
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 渲染导航菜单
        function renderNavigation() {
            const headerRight = document.getElementById('headerRight');
            let navHTML = '';
            
            // 学生端导航
            if (currentUser.role === 'student') {
                navHTML = `
                    <a href="/scenario-page" class="nav-btn">🎬 剧情演绎</a>
                    <a href="/scenario-demo" class="nav-btn" style="background: linear-gradient(135deg, #0080ff, #00c8ff);">🎞️ 沉浸式剧情</a>
                    <a href="/exercise-page" class="nav-btn" style="background: rgba(67, 233, 123, 0.8);">✏️ 互动练习</a>
                    <a href="/student-portrait-page" class="nav-btn" style="background: rgba(102, 126, 234, 0.8);">🎯 我的能力</a>
                    <a href="/weekly-tasks-page" class="nav-btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">📋 每周任务</a>
                    <a href="/wrong-questions-page" class="nav-btn" style="background: rgba(245, 87, 108, 0.8);">📝 错题本</a>
                    <a href="/knowledge-graph-page" class="nav-btn" style="background: rgba(42, 82, 152, 0.8);">🕸️ 知识图谱</a>
                    <a href="/ppt-resources-page" class="nav-btn" style="background: linear-gradient(135deg, #7b2ff7, #f107a3);">📚 课件中心</a>
                    <a href="/job-recruitment-page" class="nav-btn" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">💼 岗位招聘</a>
                    <button class="nav-btn" style="background: linear-gradient(135deg, #fa541c, #eb2f96);" onclick="showEthicsDebate()">⚖️ 伦理辩论</button>
                    <button class="nav-btn" onclick="viewMyReport()">📊 我的报告</button>
                    ${settingsNavHTML()}
                `;
            } else {
                // 老师端导航
                navHTML = `
                    <a href="/scenario-page" class="nav-btn">🎬 剧情演绎</a>
                    <a href="/scenario-demo" class="nav-btn" style="background: linear-gradient(135deg, #0080ff, #00c8ff);">🎞️ 沉浸式剧情</a>
                    <a href="/exercise-page" class="nav-btn" style="background: rgba(67, 233, 123, 0.8);">✏️ 互动练习</a>
                    <a href="/search-logs-page" class="nav-btn">📚 搜索日志</a>
                    <a href="/student-report-page" class="nav-btn">📊 学生分析</a>
                    <a href="/student-portrait-page" class="nav-btn" style="background: rgba(102, 126, 234, 0.8);">🎯 能力画像</a>
                    <a href="/knowledge-graph-page" class="nav-btn" style="background: rgba(42, 82, 152, 0.8);">🕸️ 知识图谱</a>
                    <a href="/job-recruitment-page" class="nav-btn" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">💼 岗位招聘</a>
                    <a href="/class-notification-page" class="nav-btn">📢 班级通知</a>
                    <a href="/upload-knowledge-page" class="nav-btn" style="background: rgba(17, 153, 142, 0.8);">📤 上传知识库</a>
                    <button class="nav-btn" style="background: linear-gradient(135deg,#fa541c,#fa8c16);" onclick="showExerciseManager()">📝 练习题管理</button>
                    <button class="nav-btn" style="background: linear-gradient(135deg,#ff4d4f,#fa541c);" onclick="showTeacherDashboard()">🎛️ 教师驾驶舱</button>
                    <button class="nav-btn" style="background: linear-gradient(135deg,#722ed1,#13c2c2);" onclick="showAgentConfig()">🤖 AI助教配置</button>
                    ${settingsNavHTML()}
                `;
            }

            headerRight.innerHTML = navHTML;
        }

        // ===== 设置菜单（使用说明/桌宠/清除记录/退出登录） =====
        function settingsNavHTML() {
            return `
                <div class="settings-wrap">
                    <button class="nav-btn" style="background: linear-gradient(135deg, #5961f9, #2c3e7a);" onclick="toggleSettings(event)">⚙️ 设置</button>
                    <div class="settings-menu" id="settingsMenu">
                        <a class="settings-item" onclick="closeSettings();showPlatformGuide();">📖 使用说明</a>
                        <a class="settings-item" onclick="document.getElementById('avatarInput').click();">🖼️ 更换头像</a>
                        <a class="settings-item" id="petToggleItem" onclick="togglePet();">🐾 关闭桌宠</a>
                        <a class="settings-item" onclick="closeSettings();clearChatHistory();">🗑️ 清除对话记录</a>
                        <a class="settings-item settings-danger" onclick="closeSettings();doLogout();">🔓 退出登录</a>
                    </div>
                </div>
                <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none" onchange="uploadAvatar(this);">`;
        }

        function toggleSettings(e) {
            e.stopPropagation();
            const menu = document.getElementById('settingsMenu');
            if (!menu) return;
            menu.classList.toggle('open');
            const item = document.getElementById('petToggleItem');
            if (item) item.textContent = localStorage.getItem('pet_disabled') === '1' ? '🐾 开启桌宠' : '🐾 关闭桌宠';
        }

        function closeSettings() {
            const menu = document.getElementById('settingsMenu');
            if (menu) menu.classList.remove('open');
        }

        // ===== 头像上传 =====
        async function uploadAvatar(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) {
                alert('头像图片不能超过2MB');
                input.value = '';
                return;
            }
            const fd = new FormData();
            fd.append('avatar', file);
            try {
                const r = await fetch('/api/avatar', { method: 'POST', body: fd });
                const d = await r.json();
                if (d.success) {
                    currentUser.avatar_url = d.avatar_url + '?t=' + Date.now();
                    updateUserAvatar();
                    closeSettings();
                } else {
                    alert(d.error || '上传失败，请重试');
                }
            } catch (e) {
                alert('上传失败，请检查网络');
            }
            input.value = '';
        }

        // 头部显示/更新用户头像
        function updateUserAvatar() {
            const icon = document.querySelector('.header-left .header-icon');
            if (!icon) return;
            let img = document.getElementById('userAvatarImg');
            if (currentUser.avatar_url) {
                if (!img) {
                    icon.innerHTML = '<img id="userAvatarImg" alt="头像" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">';
                    img = document.getElementById('userAvatarImg');
                    icon.title = '我的头像';
                }
                img.src = currentUser.avatar_url;
            }
        }

        function togglePet() {
            if (localStorage.getItem('pet_disabled') === '1') {
                localStorage.removeItem('pet_disabled');
                location.reload(); // 重新加载以重建桌宠
            } else {
                localStorage.setItem('pet_disabled', '1');
                const pet = document.getElementById('globalPet');
                if (pet) pet.remove();
                const menu = document.getElementById('settingsMenu');
                if (menu) menu.classList.remove('open');
                const item = document.getElementById('petToggleItem');
                if (item) item.textContent = '🐾 开启桌宠';
            }
        }

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.settings-wrap')) closeSettings();
        });
        
        // 退出登录
        async function doLogout() {
            if (confirm('确定要退出登录吗？')) {
                try {
                    const response = await fetch('/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    
                    if (response.ok) {
                        // 清除本地存储
                        localStorage.removeItem(STORAGE_KEY);
                        window.location.href = '/';
                    }
                } catch (error) {
                    console.error('退出失败:', error);
                    // 即使请求失败，也跳转到登录页面
                    localStorage.removeItem(STORAGE_KEY);
                    window.location.href = '/';
                }
            }
        }
        
        // 更新头部标题
        function updateHeaderTitle() {
            const headerText = document.querySelector('.header-text p');
            if (currentUser.role === 'student' && currentUser.student_name) {
                headerText.textContent = `欢迎, ${currentUser.student_name}！`;
            } else if (currentUser.role === 'teacher') {

        // 保存聊天记录
        function saveChatHistory() {
            try {
                const dataToSave = JSON.stringify(chatHistory);
                // 检查大小，超过4MB就删除最早的记录
                if (dataToSave.length > 4 * 1024 * 1024) {
                    chatHistory = chatHistory.slice(-20); // 保留最近20条
                    saveChatHistory();
                    return;
                }
                localStorage.setItem(STORAGE_KEY, dataToSave);
            } catch (e) {
                console.error('保存聊天记录失败:', e);
                // 如果是配额不足，删除一半的旧记录
                if (e.name === 'QuotaExceededError') {
                    chatHistory = chatHistory.slice(-Math.floor(chatHistory.length / 2));
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
                    } catch (e2) {
                        console.error('再次保存失败:', e2);
                        chatHistory = [];
                    }
                }
            }
        }
        
        // 加载聊天记录
        function loadChatHistory() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    chatHistory = JSON.parse(saved);
                    // 验证数据格式
                    if (!Array.isArray(chatHistory)) {
                        chatHistory = [];
                    }
                    renderChatHistory();
                }
            } catch (e) {
                console.error('加载聊天记录失败:', e);
                chatHistory = [];
            }
        }
        
        // 渲染聊天记录
        function renderChatHistory() {
            if (chatHistory.length === 0) return;
            
            // 重置conversationHistory
            conversationHistory = [];
            
            // 清除所有消息（包括默认消息和之前的聊天）
            const allMessages = messagesArea.querySelectorAll('.message');
            allMessages.forEach(msg => {

            });

            chatHistory.forEach(msg => {

        // 清除聊天记录（删除当前会话）
        async function clearChatHistory() {
            if (!confirm('确定要清除当前对话的所有记录吗？')) return;
            chatHistory = [];
            conversationHistory = [];
            if (currentConvId) {

        /* ====================== 会话侧边栏逻辑（豆包风格） ====================== */
        const CURRENT_CONV_KEY = 'lingzhi_current_conv';
        const MIGRATED_KEY = 'lingzhi_migrated_v2';
        let conversations = [];
        let currentConvId = localStorage.getItem(CURRENT_CONV_KEY) || null;

        function escapeTitle(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function timeAgo(iso) {
            try {
                const diff = Date.now() - new Date(iso).getTime();
                if (diff < 60000) return '刚刚';
                if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
                if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
                if (diff < 7 * 86400000) return Math.floor(diff / 86400000) + '天前';
                return new Date(iso).toLocaleDateString('zh-CN');
            } catch (e) { return ''; }
        }

        async function loadConversations() {
            try {
                const r = await fetch('/api/conversations');
                if (!r.ok) return;
                const d = await r.json();
                conversations = d.conversations || [];
                renderConvList();
            } catch (e) { console.error('加载会话列表失败', e); }
        }

        function renderConvList() {
            const list = document.getElementById('convList');
            document.getElementById('convCount').textContent = conversations.length ? conversations.length + ' 条' : '';
            if (!conversations.length) {
                list.innerHTML = '<div class="conv-empty">暂无历史对话<br>发一条消息开始吧 ✨</div>';
                return;
            }
            list.innerHTML = '';
            conversations.forEach(c => {
                const item = document.createElement('div');
                item.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
                item.innerHTML = `
                    <div class="conv-item-icon">💬</div>
                    <div class="conv-item-body">
                        <div class="conv-item-title">${escapeTitle(c.title)}</div>
                        <div class="conv-item-meta">${timeAgo(c.updated_at)} · ${c.message_count}条 · ${escapeTitle(c.preview).slice(0, 24)}</div>
                    </div>
                    <div class="conv-item-actions">
                        <button title="重命名" data-a="rename">✏️</button>

        async function openConversation(id) {
            if (isGenerating) { alert('AI 正在回复中，请稍候再切换会话'); return; }
            try {
                const r = await fetch('/api/conversations/' + id);
                if (!r.ok) { loadConversations(); return; }
                const d = await r.json();
                currentConvId = id;
                localStorage.setItem(CURRENT_CONV_KEY, id);
                messagesArea.innerHTML = '';
                chatHistory = [];
                conversationHistory = [];
                (d.messages || []).forEach(m => {
                    addMessage(m.content, m.isUser, m.image, false);
                    chatHistory.push({ content: m.content, isUser: m.isUser, image: m.image, timestamp: m.timestamp });
                    conversationHistory.push({ role: m.isUser ? 'user' : 'assistant', content: m.content });
                });
                renderConvList();
                scrollToBottom();
                if (window.innerWidth < 1180) toggleSidebarForce(false);
            } catch (e) { console.error('打开会话失败', e); }
        }

        async function deleteConversation(id) {
            if (!confirm('删除这个对话？')) return;
            try { await fetch('/api/conversations/' + id, { method: 'DELETE' }); } catch (e) {}
            if (id === currentConvId) {
                currentConvId = null;
                localStorage.removeItem(CURRENT_CONV_KEY);
                resetChatUI();
            }
            loadConversations();
        }

        async function renameConversation(id) {
            const c = conversations.find(x => x.id === id);
            const t = prompt('重命名对话：', c ? c.title : '');
            if (!t || !t.trim()) return;
            try {
                await fetch('/api/conversations/' + id, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: t.trim() })
                });
            } catch (e) {}
            loadConversations();
        }

            try {
                const r = await fetch('/api/conversations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: (firstMsg || '新的对话').slice(0, 20) })
                });
                const d = await r.json();
                currentConvId = d.id;
                localStorage.setItem(CURRENT_CONV_KEY, d.id);
                loadConversations();
            } catch (e) { console.error('创建会话失败', e); }

                method: 'POST',
                headers: { 'Content-Type': 'application/json' },

        // 旧版 localStorage 单会话记录 → 一次性迁移到服务器
        async function migrateOldHistory() {
            if (localStorage.getItem(MIGRATED_KEY)) return;
            let old = null;
            try { old = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) {}
            if (Array.isArray(old) && old.length) {
                try {
                    const r = await fetch('/api/conversations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: '历史记录' })
                    });
                    const d = await r.json();
                    for (const m of old) {
                        await fetch(`/api/conversations/${d.id}/messages`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ content: m.content || '', isUser: !!m.isUser, image: m.image || null })
                        });
                    }
                } catch (e) {}
            }
            localStorage.setItem(MIGRATED_KEY, '1');
            localStorage.removeItem(STORAGE_KEY);
        }

        function addMessage(content, isUser, imageBase64 = null, saveToHistory = true) {
            // 保存到聊天历史（可以选择不立即保存）
            if (saveToHistory) {
                // 确保图片数据完整（包含data URL前缀）
                let imageDataToSave = null;
                if (imageBase64) {
                    if (imageBase64.startsWith('data:image/')) {
                        imageDataToSave = imageBase64;
                    } else {
                        // 如果没有前缀，添加PNG前缀
                        imageDataToSave = `data:image/png;base64,${imageBase64}`;
                    }
                }
                
                chatHistory.push({
                    content: content,
                    isUser: isUser,
                    image: imageDataToSave,
                    timestamp: Date.now()
                });
                saveChatHistory();
            }
            
            // 维护API对话历史（用户消息总是立即添加）
            if (isUser) {
                conversationHistory.push({
                    role: 'user',
                    content: content
                });
            } else if (saveToHistory) {
                // AI消息在saveToHistory=true时也立即添加（非流式情况）
                conversationHistory.push({
                    role: 'assistant',
                    content: content
                });
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (isUser ? 'user' : 'assistant');
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            if (isUser) {
                avatar.textContent = '👤';
                avatar.style.fontSize = '20px';
            } else {
                const img = document.createElement('img');
                img.src = '/static/bot_new.jpg';
                img.alt = 'AI';
                avatar.appendChild(img);
            }
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            let htmlContent = formatMessage(content);
            if (imageBase64) {
                // 检查是否是完整的Data URL
                if (imageBase64.startsWith('data:image/')) {
                    // 已经是完整的Data URL，直接使用
                    htmlContent = `<img src="${imageBase64}" alt="图片" style="max-width: 100%; border-radius: 8px; margin: 10px 0;"><br>` + htmlContent;
                } else {
                    // 假设是base64编码的数据，默认使用PNG格式
                    htmlContent = `<img src="data:image/png;base64,${imageBase64}" alt="图片" style="max-width: 100%; border-radius: 8px; margin: 10px 0;"><br>` + htmlContent;
                }
            }
            contentDiv.innerHTML = (isUser ? '' : AI_GEN_TAG) + htmlContent;
            
            // 为AI消息添加操作按钮（追问）
            if (!isUser && content) {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                
                const followBtn = document.createElement('button');
                followBtn.className = 'action-btn';
                followBtn.innerHTML = '🔄 追问';
                followBtn.onclick = function() {

                    userInput.style.height = 'auto';

                    userInput.scrollTop = userInput.scrollHeight;
                };
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'action-btn';
                copyBtn.innerHTML = '📋 复制';
                copyBtn.onclick = function() {
                    navigator.clipboard.writeText(content).then(() => {
                        copyBtn.innerHTML = '✓ 已复制';
                        setTimeout(() => {
                            copyBtn.innerHTML = '📋 复制';

                    });

                actionsDiv.appendChild(followBtn);
                actionsDiv.appendChild(copyBtn);

            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesArea.appendChild(messageDiv);
            
            scrollToBottom();
            return contentDiv;
        }

        function formatMessage(content) {

                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/\n/g, '<br>');

        async function sendMessage() {
            if (isGenerating) return;
            
            const message = userInput.value.trim();
            
            // 验证：必须有消息或图片
            if (!message && !selectedImage) {
                return;
            }
            
            // 保存图片数据（因为后面会清空）
            const imageToSend = selectedImage;
            
            // 添加用户消息
            addMessage(message || '请描述这张图片', true, selectedImage);

            // 首条消息时创建会话，并把用户消息落库
            await ensureConversation(message);
            saveMsgToServer(message || '请描述这张图片', true, imageToSend);
            
            // 清空输入，但不清空 selectedImage（留到 finally）
            userInput.value = '';
            userInput.style.height = 'auto';
            imagePreview.src = '';
            imagePreview.classList.remove('show', 'remove');
            imageUpload.value = '';
            setInputDisabled(true);
            addTypingIndicator();
            
            isGenerating = true;
            let fullResponse = '';
            let messageContentDiv = null;
            
            try {
                // 限制历史记录数量，只发送最近的6条（3轮对话），提高响应速度
                const maxHistoryLength = 6;
                const recentHistory = conversationHistory.slice(-maxHistoryLength - 1, -1) || [];
                
                const requestBody = { 
                    message: message,
                    image: imageToSend,
                    mode: currentMode,
                    stream: true,
                    conversation_history: recentHistory
                };
                
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody),
                });
                
                if (!response.ok) {
                    throw new Error('请求失败');
                }
                
                removeTypingIndicator();
                // 创建AI消息容器，但不立即添加到conversationHistory
                messageContentDiv = addMessage('', false, null, false);
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    
                    let sepIndex;
                    while ((sepIndex = buffer.indexOf('\n\n')) !== -1) {
                        const line = buffer.substring(0, sepIndex);
                        buffer = buffer.substring(sepIndex + 2);
                        
                        if (line.startsWith('data: ')) {
                            const dataStr = line.slice(6);
                            if (dataStr === '[DONE]') {
                                break;
                            }
                            try {
                                const data = JSON.parse(dataStr);
                                if (data.content) {
                                    fullResponse += data.content;
                                    messageContentDiv.innerHTML = AI_GEN_TAG + formatMessage(fullResponse);
                                    scrollToBottom();
                                } else if (data.error) {
                                    messageContentDiv.innerHTML = AI_GEN_TAG + data.error;
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }
                
                // 流式完成后，将完整消息保存到历史
                if (fullResponse) {
                    // 更新聊天历史中的最后一条AI消息
                    const lastIndex = chatHistory.length - 1;
                    if (lastIndex >= 0 && !chatHistory[lastIndex].isUser) {
                        chatHistory[lastIndex].content = fullResponse;
                    } else {
                        chatHistory.push({
                            content: fullResponse,
                            isUser: false,
                            image: null,
                            timestamp: Date.now()
                        });
                    }
                    saveChatHistory();
                    
                    // 更新API对话历史中的最后一条AI消息
                    const convLastIndex = conversationHistory.length - 1;
                    if (convLastIndex >= 0 && conversationHistory[convLastIndex].role === 'assistant') {
                        conversationHistory[convLastIndex].content = fullResponse;
                    } else {
                        conversationHistory.push({
                            role: 'assistant',
                            content: fullResponse
                        });
                    }

                    // AI 回复落库
                    saveMsgToServer(fullResponse, false, null);
                }
                
            } catch (error) {
                removeTypingIndicator();
                if (!messageContentDiv) {
                    addMessage('请求出错，请稍后重试', false);
                } else {
                    messageContentDiv.innerHTML = '请求出错，请稍后重试';
                }
            } finally {
                isGenerating = false;
                setInputDisabled(false);
                selectedImage = null;
                userInput.focus();
            }
        }

            });

            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });

            document.getElementById('fileInput').addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });
        }

        async function handleFile(file) {
            const allowedExtensions = ['.docx', '.doc', '.pptx', '.ppt', '.txt'];
            
            const fileName = file.name.toLowerCase();
            const isAllowed = allowedExtensions.some(ext => fileName.endsWith(ext));
            
            if (!isAllowed) {
                alert('不支持的文件格式！请上传 .docx, .doc, .pptx, .ppt 或 .txt 文件');
                return;
            }

            const progressDiv = document.getElementById('uploadProgress');
            const progressFill = document.getElementById('progressFill');
            
            progressDiv.style.display = 'block';
            progressFill.style.width = '30%';

            const formData = new FormData();
            formData.append('file', file);

            try {
                progressFill.style.width = '60%';
                
                const response = await fetch('/api/knowledge/upload', {
                    method: 'POST',
                    body: formData
                });

                progressFill.style.width = '100%';

                const result = await response.json();
                
                if (result.success) {
                    alert(result.message);
                    closeUploadModal();
                } else {
                    alert('上传失败: ' + result.error);
                }
            } catch (error) {
                alert('上传失败: ' + error.message);
            } finally {
                setTimeout(() => {
                    progressDiv.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 500);
            }
        }
