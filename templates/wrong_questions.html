<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题本与智能复习 - 灵智尚人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .header h1 { color: #333; font-size: 24px; }
        .btn {
            padding: 10px 20px;
            background: #f5576c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 2px solid #f0f0f5;
            padding-bottom: 10px;
        }
        .full-width { grid-column: 1 / -1; }
        .stat-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card.blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .stat-card.green { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .stat-value { font-size: 32px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.9; margin-top: 5px; }
        
        .add-form {
            background: #f8f9fc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #666; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e8;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .wrong-item {
            background: #f8f9fc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid #f5576c;
            transition: all 0.3s;
        }
        .wrong-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .wrong-item.mastered {
            border-left-color: #43e97b;
            opacity: 0.6;
        }
        .wrong-question {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .wrong-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }
        .wrong-actions {
            display: flex;
            gap: 10px;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-master { background: #43e97b; color: white; }
        .btn-detail { background: #4facfe; color: white; }
        
        .rec-item {
            background: #fff5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #ffa94d;
        }
        .rec-priority {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 5px;
        }

        /* ===== 移动端适配（新增） ===== */
        @media (max-width: 768px) {
            body { padding: 8px !important; }
            .container { max-width: 100% !important; }
            .header {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 10px;
                padding: 14px 16px !important;
            }
            .header h1 { font-size: 18px !important; }
            .header > div {
                display: flex !important;
                gap: 8px !important;
                flex-wrap: wrap !important;
            }
            .header > div > .btn { flex: 1 1 calc(50% - 4px) !important; margin-right: 0 !important; text-align: center !important; }
            .card { padding: 16px !important; }
            .card h2 { font-size: 16px !important; margin-bottom: 12px !important; }
            .grid { grid-template-columns: 1fr !important; gap: 14px !important; }
            .stat-row { flex-wrap: wrap !important; gap: 10px !important; }
            .stat-card { flex: 1 1 calc(33% - 8px) !important; padding: 12px 8px !important; min-width: 0 !important; }
            .stat-value { font-size: 22px !important; }
            .add-form { padding: 14px !important; }
            .form-group input, .form-group textarea, .form-group select {
                font-size: 14px !important;
            }
            /* HTML 内联 grid 1fr 1fr（能力类别+知识点） */
            .add-form div[style*="grid-template-columns"] {
                grid-template-columns: 1fr !important;
                gap: 10px !important;
            }
            .wrong-item { padding: 12px !important; }
            .wrong-question { font-size: 14px !important; }
            .wrong-meta { flex-wrap: wrap !important; gap: 6px 10px !important; font-size: 11px !important; }
            .rec-item { padding: 12px !important; }
        }
        @media (max-width: 480px) {
            body { padding: 4px !important; }
            .header { padding: 12px !important; }
            .header h1 { font-size: 16px !important; }
            .card { padding: 12px !important; border-radius: 12px !important; }
            .stat-value { font-size: 18px !important; }
            .stat-label { font-size: 11px !important; }
        }
    </style>
    <!-- 全局按钮美化 -->
    <link rel="stylesheet" href="/static/global_buttons.css">
<link rel="stylesheet" href="/static/global_pages.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 错题本 & 智能复习</h1>
            <div>
                <a href="/student-portrait-page" class="btn" style="background: #667eea; margin-right: 10px;">能力画像</a>
                <a href="/" class="btn">← 返回</a>
            </div>
        </div>

        <div class="card full-width">
            <div class="stat-row">
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">错题总数</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-value" id="masteredCount">0</div>
                    <div class="stat-label">已掌握</div>
                </div>
                <div class="stat-card blue">
                    <div class="stat-value" id="unmasteredCount">0</div>
                    <div class="stat-label">待复习</div>
                </div>
            </div>

            <div class="add-form">
                <h3 style="color: #333; margin-bottom: 15px;">➕ 添加错题</h3>
                <div class="form-group">
                    <label>问题：</label>
                    <textarea id="question" placeholder="请输入错题内容..."></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>能力类别：</label>
                        <select id="category">
                            <option value="理论基础">理论基础</option>
                            <option value="调制技术">调制技术</option>
                            <option value="工程实践">工程实践</option>
                            <option value="工程伦理">工程伦理</option>
                            <option value="综合素质">综合素质</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>知识点（可选）：</label>
                        <input type="text" id="knowledgePoint" placeholder="如：傅里叶变换">
                    </div>
                </div>
                <div class="form-group">
                    <label>正确答案（可选）：</label>
                    <textarea id="correctAnswer" placeholder="请输入正确答案..." style="min-height: 50px;"></textarea>
                </div>
                <button class="btn" onclick="addWrongQuestion()" style="width: 100%;">添加错题</button>
            </div>
        </div>

        <div class="grid" style="margin-top: 20px;">
            <div class="card">
                <h2>🎯 智能复习推荐</h2>
                <div id="recommendList"></div>
            </div>
            <div class="card">
                <h2>📚 错题列表</h2>
                <div id="wrongList" style="max-height: 500px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            await Promise.all([loadWrongQuestions(), loadRecommendations()]);
        }

        async function loadWrongQuestions() {
            try {
                const response = await fetch('/api/wrong-questions');
                const data = await response.json();
                
                document.getElementById('totalCount').textContent = data.total;
                document.getElementById('masteredCount').textContent = data.total - data.unmastered;
                document.getElementById('unmasteredCount').textContent = data.unmastered;
                
                const list = document.getElementById('wrongList');
                if (data.questions.length === 0) {
                    list.innerHTML = '<div style="text-align: center; color: #999; padding: 30px;">暂无错题</div>';
                    return;
                }
                
                list.innerHTML = data.questions.map(q => `
                    <div class="wrong-item ${q.mastered ? 'mastered' : ''}">
                        <div class="wrong-question">${escapeHtml(q.question)}</div>
                        <div class="wrong-meta">
                            <span>📁 ${q.category}</span>
                            ${q.knowledge_point ? `<span>🎯 ${q.knowledge_point}</span>` : ''}
                            <span>❌ 错${q.count}次</span>
                            <span>⏰ ${q.last_wrong_time}</span>
                        </div>
                        ${q.correct_answer ? `<div style="background: white; padding: 8px; border-radius: 5px; font-size: 13px; color: #51cf66; margin-top: 8px;"><strong>正确答案：</strong>${escapeHtml(q.correct_answer)}</div>` : ''}
                        <div class="wrong-actions" style="margin-top: 10px;">
                            ${!q.mastered ? `<button class="btn-sm btn-master" onclick="markMastered('${q.id}')">✓ 标记掌握</button>` : '<span style="color: #43e97b; font-size: 12px;">✅ 已掌握</span>'}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载错题失败:', error);
            }
        }

        async function loadRecommendations() {
            try {
                const response = await fetch('/api/review/recommend?limit=5');
                const data = await response.json();
                
                const list = document.getElementById('recommendList');
                if (data.recommendations.length === 0) {
                    list.innerHTML = '<div style="text-align: center; color: #999; padding: 30px;">🎉 暂无需要复习的错题</div>';
                    return;
                }
                
                list.innerHTML = data.recommendations.map((q, i) => `
                    <div class="rec-item">
                        <span class="rec-priority">优先级 ${i + 1}</span>
                        <div style="font-weight: 600; color: #333; margin: 5px 0;">${escapeHtml(q.question)}</div>
                        <div style="font-size: 12px; color: #999;">
                            ${q.category} · 错${q.count}次 · ${q.knowledge_point || '未分类知识点'}
                        </div>
                        ${q.correct_answer ? `<div style="background: white; padding: 8px; border-radius: 5px; font-size: 12px; color: #51cf66; margin-top: 8px;">💡 ${escapeHtml(q.correct_answer)}</div>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载推荐失败:', error);
            }
        }

        async function addWrongQuestion() {
            const question = document.getElementById('question').value.trim();
            const category = document.getElementById('category').value;
            const knowledgePoint = document.getElementById('knowledgePoint').value.trim();
            const correctAnswer = document.getElementById('correctAnswer').value.trim();
            
            if (!question) {
                alert('请输入问题内容');
                return;
            }
            
            try {
                const response = await fetch('/api/wrong-questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question, category, 
                        knowledge_point: knowledgePoint,
                        correct_answer: correctAnswer
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('错题已添加');
                    document.getElementById('question').value = '';
                    document.getElementById('knowledgePoint').value = '';
                    document.getElementById('correctAnswer').value = '';
                    loadData();
                } else {
                    alert('添加失败: ' + result.error);
                }
            } catch (error) {
                alert('添加失败: ' + error.message);
            }
        }

        async function markMastered(id) {
            if (!confirm('确定已掌握这道题？')) return;
            try {
                const response = await fetch(`/api/wrong-questions/${id}/master`, { method: 'POST' });
                const result = await response.json();
                if (result.success) {
                    loadData();
                }
            } catch (error) {
                alert('操作失败: ' + error.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        loadData();
    </script>

    <!-- 全局桌宠 Desktop Pet -->
    <link rel="stylesheet" href="/static/desktop_pet.css">
    <script src="/static/desktop_pet.js" defer></script>
</body>
</html>
