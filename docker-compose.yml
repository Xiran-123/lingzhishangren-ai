version: '3.8'

services:
  lingzhishangren:
    build: .
    container_name: lingzhishangren-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=your-production-secret-key-change-this
    # 大模型密钥：由挂载的 api_key.local 提供（见 volumes），或改用环境变量：
    # environment:
    #   - SILICONFLOW_API_KEY=sk-xxxxxx
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      # 镜像未装 curl，改用 Python 标准库做健康检查
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
